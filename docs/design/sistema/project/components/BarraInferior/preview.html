<!-- @dsCard group="Navegación" height=120 subtitle="Barra inferior en móvil: cinco destinos, el actual con píldora y «+» para registrar" -->
<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Barra inferior</title>
<style>
html,body{margin:0}
body{background:var(--ui-surface-page);color:var(--ui-text-default);font-family:var(--font-sans);padding:var(--space-4)}
.icon{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i20{width:var(--size-icon-sm);height:var(--size-icon-sm);stroke-width:var(--icon-stroke-user-units-sm)}
.i24{width:var(--size-icon-md);height:var(--size-icon-md);stroke-width:var(--icon-stroke-user-units-md)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--ui-text-secondary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--border-width-focus) solid var(--ui-border-focus);outline-offset:var(--focus-offset)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0.01ms!important;animation-duration:0.01ms!important;animation-iteration-count:1!important}}
.marco{max-width:var(--breakpoint-base);background:var(--ui-surface-page);border:var(--border-width-default) solid var(--ui-border-divider);border-radius:var(--radius-md);overflow:hidden}
.barra{height:var(--layout-bottombar-height);padding-bottom:env(safe-area-inset-bottom);background:var(--ui-surface-raised);border-top:var(--border-width-default) solid var(--ui-border-divider)}
.barra ul{display:flex;justify-content:space-around;margin:0;padding:0;list-style:none}
.destino{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:var(--size-bottombar-item-min-width);height:var(--size-bottombar-item-height);padding:0;border:0;background:none;color:var(--ui-text-secondary);font-family:inherit;text-decoration:none;cursor:pointer}
.destino:focus-visible{outline-offset:-2px}
.pildora{display:flex;align-items:center;justify-content:center;width:var(--size-bottombar-indicator-width);height:var(--size-bottombar-indicator-height);border-radius:var(--radius-full)}
.destino[aria-current="page"]{color:var(--ui-text-default)}
.destino[aria-current="page"] .caption{font-weight:var(--font-weight-medium)}
.destino[aria-current="page"] .pildora{background:var(--ui-surface-selected);color:var(--ui-icon-selected)}
.mas{display:flex;align-items:center;justify-content:center;width:var(--size-bottombar-add);height:var(--size-bottombar-add);border-radius:var(--radius-full);background:var(--ui-action-primary-bg);color:var(--ui-text-on-primary)}
</style>
</head>
<body>
<div class="marco">
<nav class="barra" aria-label="Destinos">
<ul>
<li><a class="destino" href="#" aria-current="page"><span class="pildora"><svg class="icon i24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="caption">Inicio</span></a></li>
<li><a class="destino" href="#"><span class="pildora"><svg class="icon i24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/> <path d="M7 2v20"/> <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span><span class="caption">Comidas</span></a></li>
<li><button class="destino" type="button" aria-label="Registrar gasto"><span class="mas"><svg class="icon i24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></span></button></li>
<li><a class="destino" href="#"><span class="pildora"><svg class="icon i24" viewBox="0 0 24 24" aria-hidden="true"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/> <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/> <circle cx="18" cy="20" r="2"/> <circle cx="8" cy="20" r="2"/></svg></span><span class="caption">Compras</span></a></li>
<li><a class="destino" href="#"><span class="pildora"><svg class="icon i24" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"/> <circle cx="11" cy="11" r="8"/></svg></span><span class="caption">Buscar</span></a></li>
</ul>
</nav>
</div>
</body>
</html>
