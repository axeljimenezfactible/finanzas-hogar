<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Barra lateral</title>
<style>
html,body{margin:0}
body{background:var(--ui-surface-page);color:var(--ui-text-default);font-family:var(--font-sans);padding:var(--space-4)}
.icon{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i20{width:var(--size-icon-sm);height:var(--size-icon-sm);stroke-width:var(--icon-stroke-user-units-sm)}
.i24{width:var(--size-icon-md);height:var(--size-icon-md);stroke-width:var(--icon-stroke-user-units-md)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--ui-text-secondary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--border-width-focus) solid var(--ui-border-focus);outline-offset:var(--focus-offset)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0.01ms!important;animation-duration:0.01ms!important;animation-iteration-count:1!important}}
.lateral{display:flex;flex-direction:column;gap:var(--space-1);width:var(--layout-sidebar-width);padding:var(--space-2);box-sizing:border-box;background:var(--ui-surface-card)}
.cabeza,.fila,.pie{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1)}
.cabeza{padding-left:var(--space-2)}
.espacio{margin:0;font-weight:var(--font-weight-semibold)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:var(--size-avatar);height:var(--size-avatar);padding:0;border:0;border-radius:var(--radius-full);background:var(--ui-surface-hover);box-shadow:0 0 0 2px var(--ui-person-axel);color:var(--ui-text-default);font-family:inherit;font-weight:var(--font-weight-medium);cursor:pointer}
ul{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.sub{padding-left:var(--space-4)}
.item{flex:1;display:flex;align-items:center;gap:var(--space-2);height:var(--size-control-coarse);padding:0 var(--space-2);border:0;border-radius:var(--radius-sm);background:none;color:var(--ui-text-secondary);font-family:inherit;text-decoration:none;cursor:pointer;transition:background-color var(--duration-fast) var(--ease-standard)}
.item .icon{color:var(--ui-icon-default)}
.item:hover{background:var(--ui-surface-hover);color:var(--ui-text-default)}
.item[aria-current="page"]{background:var(--ui-surface-selected);color:var(--ui-text-default);font-weight:var(--font-weight-medium)}
.item[aria-current="page"] .icon{color:var(--ui-icon-selected)}
.item:focus-visible,.boton:focus-visible{outline-offset:-2px}
.boton{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--size-control-coarse);height:var(--size-control-coarse);padding:0;border:var(--border-width-default) solid transparent;border-radius:var(--radius-sm);background:none;color:var(--ui-icon-default);cursor:pointer}
.boton:hover{background:var(--ui-surface-hover)}
.boton[aria-pressed="true"]{background:var(--ui-surface-selected);border-color:var(--ui-border-selected);color:var(--ui-icon-selected)}
.boton .icon{transition:transform var(--duration-base) var(--ease-standard)}
.boton[aria-expanded="true"] .icon{transform:rotate(90deg)}
@media (pointer:fine) and (not (any-pointer:coarse)){.item,.boton{height:var(--size-sidebar-item)}.boton{width:var(--size-sidebar-item)}}
.pie{margin-top:var(--space-2);padding-top:var(--space-2);border-top:var(--border-width-default) solid var(--ui-border-divider)}
.tema{display:flex;gap:var(--space-1)}
</style>
</head>
