<!-- @dsCard group="Gráficas" height=560 subtitle="Líneas con marcador, trazo y etiqueta directa; orden fijo de las 8 series" -->
<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Gráfica</title>
<style>
html,body{margin:0}
body{background:var(--ui-surface-page);color:var(--ui-text-default);font-family:var(--font-sans);padding:var(--space-4)}
.icon{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i20{width:var(--size-icon-sm);height:var(--size-icon-sm);stroke-width:var(--icon-stroke-user-units-sm)}
.i24{width:var(--size-icon-md);height:var(--size-icon-md);stroke-width:var(--icon-stroke-user-units-md)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--ui-text-secondary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--border-width-focus) solid var(--ui-border-focus);outline-offset:var(--focus-offset)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0.01ms!important;animation-duration:0.01ms!important;animation-iteration-count:1!important}}
figure{max-width:760px;margin:0;padding:var(--space-4);background:var(--ui-surface-card);border-radius:var(--radius-md)}
figcaption p,h4{margin:0}
.titulo,h4{color:var(--ui-text-secondary);font-weight:var(--font-weight-regular)}
.trazo{display:block;width:100%;max-width:600px;height:auto;margin-top:var(--space-3)}
.defs{position:absolute;width:0;height:0}
.grid{stroke:var(--ui-viz-grid);stroke-width:var(--border-width-default)}
.base{stroke:var(--ui-viz-baseline);stroke-width:var(--border-width-default)}
.eje{fill:var(--ui-text-secondary);font-variant-numeric:tabular-nums}
.etq{fill:var(--ui-text-default);font-variant-numeric:tabular-nums}
.l{fill:none;stroke-width:var(--size-viz-line);stroke-linecap:round;stroke-linejoin:round}
.s1{stroke:var(--ui-chart-1);stroke-dasharray:var(--viz-series-1-dash)}
.s2{stroke:var(--ui-chart-2);stroke-dasharray:var(--viz-series-2-dash)}
.s3{stroke:var(--ui-chart-3);stroke-dasharray:var(--viz-series-3-dash)}
.s4{stroke:var(--ui-chart-4);stroke-dasharray:var(--viz-series-4-dash)}
.s5{stroke:var(--ui-chart-5);stroke-dasharray:var(--viz-series-5-dash)}
.s6{stroke:var(--ui-chart-6);stroke-dasharray:var(--viz-series-6-dash)}
.s7{stroke:var(--ui-chart-7);stroke-dasharray:var(--viz-series-7-dash)}
.s8{stroke:var(--ui-chart-8);stroke-dasharray:var(--viz-series-8-dash)}
.mk{stroke:var(--ui-surface-card);stroke-width:2px}
.f1{fill:var(--ui-chart-1)}.f2{fill:var(--ui-chart-2)}.f3{fill:var(--ui-chart-3)}.f4{fill:var(--ui-chart-4)}
.f5{fill:var(--ui-chart-5)}.f6{fill:var(--ui-chart-6)}.f7{fill:var(--ui-chart-7)}.f8{fill:var(--ui-chart-8)}
.x6,.x7{fill:none;stroke-width:2px;stroke-linecap:round}
.x6{stroke:var(--ui-chart-6)}.x7{stroke:var(--ui-chart-7)}
.a8{fill:var(--ui-surface-card);stroke:var(--ui-chart-8);stroke-width:2px}
.pt{fill:none;stroke:var(--ui-surface-card);stroke-width:1.5px}
.pd{fill:var(--ui-surface-card)}
.leyenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-1) var(--space-4);margin:var(--space-2) 0 var(--space-3);padding:0;list-style:none}
.leyenda li{display:flex;align-items:center;gap:var(--space-2)}
.muestra{flex:none;width:88px;height:20px}
.texto{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--size-control-coarse);padding:0 var(--space-2);border:0;border-radius:var(--radius-sm);background:none;color:var(--ui-text-secondary);font-family:inherit;cursor:pointer}
.texto:hover{background:var(--ui-surface-hover);color:var(--ui-text-default)}
</style>
</head>
<body>

</svg>
