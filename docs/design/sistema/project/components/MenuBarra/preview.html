<!-- @dsCard group="Navegación" height=330 subtitle="Comandos con /, fila resaltada, alias y atajos" -->
<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Menú barra</title>
<style>
html,body{margin:0}
body{background:var(--ui-surface-page);color:var(--ui-text-default);font-family:var(--font-sans);padding:var(--space-4)}
.icon{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i20{width:var(--size-icon-sm);height:var(--size-icon-sm);stroke-width:var(--icon-stroke-user-units-sm)}
.i24{width:var(--size-icon-md);height:var(--size-icon-md);stroke-width:var(--icon-stroke-user-units-md)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--ui-text-secondary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--border-width-focus) solid var(--ui-border-focus);outline-offset:var(--focus-offset)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0.01ms!important;animation-duration:0.01ms!important;animation-iteration-count:1!important}}
.panel{max-width:var(--layout-command-width);background:var(--ui-surface-raised);border:var(--border-width-default) solid var(--ui-border-divider);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);overflow:hidden}
.busca{display:flex;align-items:center;gap:var(--space-2);height:var(--size-control-coarse);padding:0 var(--space-3);border-bottom:var(--border-width-default) solid var(--ui-border-divider);color:var(--ui-icon-default)}
.busca:focus-within{outline:var(--border-width-focus) solid var(--ui-border-focus);outline-offset:-2px}
.busca input{flex:1;min-width:0;padding:0;border:0;background:none;color:var(--ui-text-default);font-family:inherit;outline:none}
.lista{padding:var(--space-1) var(--space-2) var(--space-2)}
.grupo{margin:var(--space-2) 0 var(--space-1);padding:0 var(--space-2);color:var(--ui-text-secondary)}
.op{display:flex;align-items:center;gap:var(--space-2);height:var(--size-control-coarse);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--ui-text-default);cursor:pointer}
@media (pointer:fine) and (not (any-pointer:coarse)){.busca,.op{height:var(--size-control-fine)}}
.op .icon{color:var(--ui-icon-default)}
.op[aria-selected="true"]{background:var(--ui-surface-hover)}
.alias{color:var(--ui-text-secondary)}
.tecla{margin-left:auto;padding:0 var(--space-1);border:var(--border-width-default) solid var(--ui-border-divider);border-radius:var(--radius-sm);color:var(--ui-text-secondary);font-family:inherit}
.op[aria-disabled="true"]{color:var(--ui-text-disabled);cursor:not-allowed}
</style>
</head>
<body>
<div class="panel" role="dialog" aria-label="Menú de comandos">
<div class="busca"><svg class="icon i20" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"/> <circle cx="11" cy="11" r="8"/></svg><input class="body" role="combobox" aria-expanded="true" aria-controls="cmds" aria-activedescendant="op-gasto" aria-label="Buscar o escribir un comando" value="/"></div>
<div class="lista small" id="cmds" role="listbox" aria-label="Comandos">
<div role="group" aria-labelledby="g1"><div class="grupo caption" id="g1">Registrar</div>
<div class="op" role="option" id="op-gasto" aria-selected="true"><svg class="icon i20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V7"/> <path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/> <path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/></svg>Registrar gasto <span class="alias">/gasto</span></div>
<div class="op" role="option" aria-selected="false"><svg class="icon i20" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/> <path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>Registrar peso <span class="alias">/peso</span></div></div>
<div role="group" aria-labelledby="g2"><div class="grupo caption" id="g2">Herramientas</div>
<div class="op" role="option" aria-selected="false"><svg class="icon i20" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/> <path d="M9 3v18"/></svg>Colapsar barra lateral <span class="alias">/barra</span><kbd class="tecla caption">Ctrl+\</kbd></div>
<div class="op" role="option" aria-selected="false"><svg class="icon i20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/> <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/> <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/> <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/> <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>Cambiar tema <span class="alias">/tema</span><kbd class="tecla caption">Ctrl+Shift+L</kbd></div>
<div class="op" role="option" aria-selected="false" aria-disabled="true"><svg class="icon i20" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/> <path d="M3 5V19A9 3 0 0 0 21 19V5"/> <path d="M3 12A9 3 0 0 0 21 12"/></svg>Respaldar ahora <span>· Requiere conexión</span></div></div>
</div>
</div>
</body>
</html>
