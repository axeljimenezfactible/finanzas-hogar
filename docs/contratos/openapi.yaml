components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  parameters:
    PersonId:
      name: "person_id"
      in: "query"
      required: false
      description: "Filtro global «persona»: ids de persona separados por coma (person.id). En gastos filtra expense.person_id; en partes de dinero, la persona de la parte."
      style: "form"
      explode: false
      schema:
        type: "array"
        items:
          type: "integer"
          minimum: 1
    Family:
      name: "family"
      in: "query"
      required: false
      description: "Filtro global «familia» (U1 §0.2, K5), tres valores incluyentes: household = Hogar, registros con reparto Hogar o Conjunto (incluye lo conjunto); external = Karen, registros con reparto Karen o Conjunto (incluye lo conjunto); joint = Conjunto, solo los registros con reparto Conjunto. Sin valor: todos."
      schema:
        type: "string"
        enum:
          - "household"
          - "external"
          - "joint"
    CategoryId:
      name: "category_id"
      in: "query"
      required: false
      description: "Filtro global «categoría»: ids separados por coma (category.id)."
      style: "form"
      explode: false
      schema:
        type: "array"
        items:
          type: "integer"
          minimum: 1
    StoreId:
      name: "store_id"
      in: "query"
      required: false
      description: "Filtro global «tienda»: ids separados por coma (store.id); en promociones, el comercio ligado."
      style: "form"
      explode: false
      schema:
        type: "array"
        items:
          type: "integer"
          minimum: 1
    Period:
      name: "period"
      in: "query"
      required: false
      description: "Filtro global «periodo», una sola sintaxis: `2026-10` mes calendario (periodo base); `2026-10-q1` / `2026-10-q2` quincena (q1 del 1 al 15, q2 del 16 al último día; días de pago 15 y 30, y en febrero el último día, p. ej. 2027-02-28); `2026-W42` semana ISO de lunes a domingo; `2026` año calendario; `2026-10-10..2026-11-09` rango inclusivo. Quincenas y semanas según K8 (el 31 cae en q2). Sin valor: el periodo por defecto de cada operación."
      schema:
        type: "string"
        pattern: "^([0-9]{4}|[0-9]{4}-(0[1-9]|1[0-2])|[0-9]{4}-(0[1-9]|1[0-2])-q[12]|[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])|[0-9]{4}-[0-9]{2}-[0-9]{2}\\.\\.[0-9]{4}-[0-9]{2}-[0-9]{2})$"
        examples:
          - "2026-10"
    CreditId:
      name: "credit_id"
      in: "query"
      required: false
      description: "Filtro global «crédito»: ids de línea separados por coma (credit.id). En gastos, la forma de pago a crédito con esa línea."
      style: "form"
      explode: false
      schema:
        type: "array"
        items:
          type: "integer"
          minimum: 1
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "Cursor opaco devuelto en `next_cursor` de la página anterior. Sin valor: primera página."
      schema:
        type: "string"
        maxLength: 512
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Registros por página: 50 por defecto (U1); máximo 200 (K6)."
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: "sort"
      in: "query"
      required: false
      description: "Orden: propiedades separadas por coma; prefijo `-` = descendente (p. ej. `-expense_date,-created_at`). El orden por defecto de cada lista está en su descripción. El id cierra siempre el orden para que el cursor sea estable."
      schema:
        type: "string"
        pattern: "^-?[a-z][a-z0-9_]*(,-?[a-z][a-z0-9_]*)*$"
    BudgetScope:
      name: "scope"
      in: "query"
      required: false
      description: "Alcance de un cambio de monto (K2): this_month = «solo este mes»; onward = «de este mes en adelante» (por omisión; preseleccionado en pantalla)."
      schema:
        type: "string"
        enum:
          - "this_month"
          - "onward"
        default: "onward"
    BudgetMonth:
      name: "month"
      in: "query"
      required: false
      description: "Mes al que aplica el cambio de monto (AAAA-MM): el que muestra la pantalla. Sin valor, el mes en curso."
      schema:
        $ref: "#/components/schemas/Month"
    ListWeek:
      name: "week"
      in: "query"
      required: true
      description: "Llave de la lista de compras semanal (R3-01): dice qué lista se lee o se escribe. No es un filtro ni sustituye al filtro global `period` (C1-datos.md §6, «Llaves que no son filtros»). Semana ISO `2026-W42`, de lunes a domingo (K8). Obligatoria: la pantalla manda la semana que muestra; el contrato no tiene semana por omisión (la regla de la lista vigente vive en la PWA, U1 §0.2)."
      schema:
        type: "string"
        pattern: "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$"
        examples:
          - "2026-W42"
    OverviewFrom:
      name: "from"
      in: "query"
      required: true
      description: "Llave del resumen mensual del tablero (getDashboardMonthlyOverview, K54): primer mes de la ventana, `AAAA-MM`. No es un filtro (C1-datos.md §6, «Llaves que no son filtros»). Obligatoria; `from` mayor que `to` o más de 24 meses responde 422 `validation_failed`."
      schema:
        $ref: "#/components/schemas/Month"
    OverviewTo:
      name: "to"
      in: "query"
      required: true
      description: "Llave del resumen mensual del tablero (getDashboardMonthlyOverview, K54): último mes de la ventana, `AAAA-MM`, incluido; puede ser posterior al mes en curso (meses de proyección). Obligatoria."
      schema:
        $ref: "#/components/schemas/Month"
    Q:
      name: "q"
      in: "query"
      required: false
      description: "Texto libre, sin distinguir mayúsculas ni acentos."
      schema:
        type: "string"
        maxLength: 200
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Obligatorio en todo POST de captura. Clave única por intento (UUID v4 recomendado). Repetir la misma clave con el mismo cuerpo devuelve la respuesta original con `Idempotent-Replayed: true`; con otro cuerpo, 409 `idempotency_key_reused`. La API la guarda por cuenta en la tabla idempotency_key de S1 (huella SHA-256 del cuerpo y respuesta); retención de 24 h al sembrar (K6; valor vigente de app_setting idempotency.retention_hours, que se cambia con updateDataSettings, K44). Gastos y pesos guardan además la clave en su propio renglón, sin purga, y responden 200 con el mismo recurso al reintento (K9)."
      schema:
        type: "string"
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
  headers:
    RequestId:
      description: "Identificador de la petición (también en Error.request_id y audit_log.request_id)."
      schema:
        type: "string"
    IdempotentReplayed:
      description: "true cuando la respuesta es la repetición de una captura ya hecha con la misma Idempotency-Key."
      schema:
        type: "boolean"
    SetCookie:
      description: "Cookie de sesión `fh_session`: HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age de la sesión larga (90 días renovables con el uso, K11)."
      schema:
        type: "string"
  responses:
    BadRequest:
      description: "Petición mal formada: JSON inválido o parámetro con formato incorrecto (`bad_request`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Sin sesión, sesión vencida o cerrada desde otro dispositivo (`unauthorized`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Acción no permitida sobre ese registro (`forbidden`, `read_only_source`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "El registro no existe (`not_found`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Conflicto con el estado actual (`conflict`, `already_exists`, `in_use`, `budget_overlap`, `idempotency_key_reused`, …)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "Archivo demasiado grande (`payload_too_large`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: "El cálculo pasó su tiempo máximo (`unavailable`); no se guardó nada."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "Tipo de archivo no admitido (`unsupported_media_type`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: "Validación de negocio o de campos (`validation_failed`, con `fields`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "Demasiados intentos de inicio de sesión (`too_many_attempts`, con `retry_at`)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: "Cualquier otro error, incluidos 500 `internal_error`, 501 `not_implemented` y 503 `unavailable`, con el esquema único."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MoneyCents:
      type: "integer"
      description: "Importe exacto en centavos de MXN (entero, nunca punto flotante). 97375 = $973.75. Redondeo ROUND_HALF_UP; en una serie de pagos el último ajusta centavos. En pantalla: `$` y dos decimales."
      examples:
        - 97375
    Date:
      type: "string"
      format: "date"
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: "Fecha de negocio ISO 8601 (AAAA-MM-DD) del calendario de America/Mexico_City. En pantalla se muestra 10-oct-2026."
      examples:
        - "2026-10-30"
    DateTime:
      type: "string"
      format: "date-time"
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?(Z|[+-][0-9]{2}:[0-9]{2})$"
      description: "Instante ISO 8601 con desplazamiento explícito de America/Mexico_City (hoy -06:00). La base lo guarda en UTC con «Z» y la API lo convierte al responder. El sufijo «Z» (UTC) solo se acepta en las entradas; las respuestas siempre llevan el desplazamiento (K12, R2-06)."
      examples:
        - "2026-10-10T21:30:00-06:00"
    BasisPoints:
      type: "integer"
      minimum: 0
      maximum: 10000
      description: "Porcentaje en puntos base: 10000 = 100 %, 5000 = 50 %."
      examples:
        - 5000
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    Month:
      type: "string"
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      description: "Mes calendario AAAA-MM."
      examples:
        - "2026-10"
    Error:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "request_id"
      description: "Esquema único de error de toda la API (C1 §3). Lo usan todas las respuestas 4xx y 5xx."
      properties:
        code:
          type: "string"
          pattern: "^[a-z][a-z0-9_]*$"
          description: "Código estable en inglés (tabla de códigos en C1-datos.md §3)."
          examples:
            - "validation_failed"
        message:
          type: "string"
          description: "Mensaje para la persona usuaria, en español de México."
          examples:
            - "Revisa los campos marcados."
        fields:
          type: "array"
          description: "Detalle por campo cuando aplica (validación)."
          items:
            $ref: "#/components/schemas/FieldError"
        request_id:
          type: "string"
          description: "Identificador de la petición; es el mismo valor que el encabezado X-Request-Id y el de audit_log.request_id."
          examples:
            - "01JABCDEF0123456789"
        retry_at:
          $ref: "#/components/schemas/DateTime"
          description: "Solo en 429 (límite de intentos de inicio de sesión): hora a partir de la cual se puede intentar de nuevo."
    FieldError:
      type: "object"
      additionalProperties: false
      required:
        - "field"
        - "code"
        - "message"
      properties:
        field:
          type: "string"
          description: "Nombre de la propiedad (nombre_codigo) o ruta JSON del campo con error."
          examples:
            - "amount_cents"
        code:
          type: "string"
          pattern: "^[a-z][a-z0-9_]*$"
          description: "Motivo estable en inglés: required, invalid_format, out_of_range, not_found, not_allowed, conflict."
          examples:
            - "out_of_range"
        message:
          type: "string"
          description: "Explicación en español de México."
          examples:
            - "El monto debe ser mayor que cero."
    Page:
      type: "object"
      required:
        - "items"
        - "next_cursor"
      description: "Envoltura única de toda colección paginada (C1 §5). `next_cursor` = null indica que no hay más."
      properties:
        items:
          type: "array"
          description: "Registros de la página, en el orden pedido."
        next_cursor:
          type:
            - "string"
            - "null"
          description: "Cursor opaco para pedir la página siguiente; null cuando no hay más registros."
    Health:
      type: "object"
      description: "Estado mínimo del servidor (público, sin datos)."
      properties:
        status:
          type: "string"
          enum:
            - "ok"
          description: "Siempre ok si el servidor responde y la base abre."
        time:
          $ref: "#/components/schemas/DateTime"
          description: "Hora del servidor."
      required:
        - "status"
        - "time"
      x-calculado: true
    LoginRequest:
      type: "object"
      description: "Credenciales de inicio de sesión. La contraseña nunca se guarda ni se registra."
      properties:
        username:
          type: "string"
          description: "Usuario (user_account.username), sin distinguir mayúsculas."
        password:
          type: "string"
          description: "Contraseña en claro, solo de entrada."
          writeOnly: true
          x-entrada: true
        device_label:
          type: "string"
          description: "Nombre legible del dispositivo (device_session.device_label), p. ej. «Chrome en Android»."
      required:
        - "username"
        - "password"
    CurrentSession:
      type: "object"
      description: "Sesión de quien hace la petición (N-001). Axel y Ximena tienen los mismos permisos."
      properties:
        user_account_id:
          type: "integer"
          description: "Cuenta (user_account.id)."
        username:
          type: "string"
          description: "Usuario (user_account.username)."
        person_id:
          type: "integer"
          description: "Persona dueña de la cuenta (user_account.person_id)."
        display_name:
          type: "string"
          description: "Nombre visible (person.display_name)."
        participation:
          type: "string"
          enum:
            - "holder"
            - "co_holder"
          description: "Papel (person.participation): titular o co-titular, mismos permisos."
        device_session_id:
          type: "integer"
          description: "Sesión de este dispositivo (device_session.id)."
        expires_at:
          $ref: "#/components/schemas/DateTime"
          description: "Vencimiento de la sesión (device_session.expires_at)."
        last_seen_at:
          $ref: "#/components/schemas/DateTime"
          description: "Último uso (device_session.last_seen_at)."
      required:
        - "user_account_id"
        - "username"
        - "person_id"
        - "display_name"
        - "participation"
        - "device_session_id"
        - "expires_at"
        - "last_seen_at"
      x-calculado: true
    PasswordChangeRequest:
      type: "object"
      description: "Cambio de la contraseña propia (N-273). Solo entrada."
      properties:
        current_password:
          type: "string"
          description: "Contraseña actual."
          writeOnly: true
          x-entrada: true
        new_password:
          type: "string"
          minLength: 1
          description: "Contraseña nueva: al menos el mínimo vigente de app_setting auth.password_min_length (12 caracteres al sembrar; K6, K44; se cambia con updateSecuritySettings). Más corta: 422 validation_failed y el mensaje dice el mínimo vigente."
          writeOnly: true
          x-entrada: true
      required:
        - "current_password"
        - "new_password"
    SessionRevokeRequest:
      type: "object"
      description: "Cierre de varias sesiones (N-272)."
      properties:
        scope:
          type: "string"
          enum:
            - "user_except_current"
            - "all_except_current"
            - "all"
          description: "user_except_current = todas las de una cuenta salvo la actual; all_except_current = todas salvo la actual; all = todas, incluida la actual."
          x-entrada: true
        user_account_id:
          type: "integer"
          description: "Cuenta cuyas sesiones se cierran (obligatorio con user_except_current)."
      required:
        - "scope"
    SessionRevokeResult:
      type: "object"
      description: "Resultado del cierre de sesiones."
      properties:
        revoked_count:
          type: "integer"
          description: "Número de sesiones cerradas."
      required:
        - "revoked_count"
      x-calculado: true
    UserAccount:
      type: "object"
      description: "Cuenta de usuario (tabla `user_account`). Cuenta para iniciar sesión. Solo dos: Axel y Ximena, con los mismos permisos (no hay roles). Karen nunca tiene cuenta. Campos ausentes = sin valor (NULL)."
      x-tabla: "user_account"
      required:
        - "id"
        - "person_id"
        - "username"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        person_id:
          type: "integer"
          description: "Persona dueña de la cuenta"
        username:
          type: "string"
          description: "Usuario para iniciar sesión"
        is_active:
          type: "boolean"
          description: "0 = cuenta deshabilitada (no puede iniciar sesión)"
        last_login_at:
          $ref: "#/components/schemas/DateTime"
          description: "Último inicio de sesión correcto"
        created_at:
          $ref: "#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
        display_name:
          type: "string"
          description: "Nombre visible (person.display_name)."
          x-calculado: true
        participation:
          type: "string"
          enum:
            - "holder"
            - "co_holder"
          description: "Papel de la persona (person.participation)."
          x-calculado: true
    DeviceSession:
      type: "object"
      description: "Sesión por dispositivo (tabla `device_session`). Sesión larga (meses) de una cuenta en un dispositivo. Se puede cerrar desde Ajustes. Campos ausentes = sin valor (NULL)."
      x-tabla: "device_session"
      required:
        - "id"
        - "user_account_id"
        - "last_seen_at"
        - "expires_at"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        user_account_id:
          type: "integer"
          description: "Cuenta dueña de la sesión"
        device_label:
          type: "string"
          description: "Nombre legible del dispositivo (Chrome en Android)"
        user_agent:
          type: "string"
          description: "Agente de usuario reportado por el navegador"
        last_seen_at:
          $ref: "#/components/schemas/DateTime"
          description: "Último uso"
        expires_at:
          $ref: "#/components/schemas/DateTime"
          description: "Vencimiento de la sesión"
        revoked_at:
          $ref: "#/components/schemas/DateTime"
          description: "Cierre manual desde Ajustes. NULL = vigente"
        created_at:
          $ref: "#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
        is_current:
          type: "boolean"
          description: "true si es la sesión de esta petición."
          x-calculado: true
        username:
          type: "string"
          description: "Usuario dueño de la sesión."
          x-calculado: true
    Person:
      type: "object"
      description: "Persona (tabla `person`). Persona que participa en el dinero del hogar: el titular (Axel), la co-titular (Ximena) o una participante externa sin cuenta (Karen). Campos ausentes = sin valor (NULL)."
      x-tabla: "person"
      required:
        - "id"
        - "code"
        - "display_name"
        - "participation"
        - "pays_share_directly"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        code:
          type: "string"
          description: "Clave estable para semilla e importadores (axel, ximena, karen)"
        display_name:
          type: "string"
          description: "Nombre que se muestra en pantallas y reportes"
        participation:
          type: "string"
          enum:
            - "holder"
            - "co_holder"
            - "external"
          description: "Papel: holder = titular (Axel), co_holder = co-titular con los mismos permisos (Ximena), external = participante externa sin cuenta (Karen)"
        pays_share_directly:
          type: "boolean"
          description: "1 = paga su parte directo al acreedor (Karen con Kueski). Su parte es informativa para el flujo de efectivo del titular y repone la línea cuando ella paga"
        fortnight_payment_cap_cents:
          $ref: "#/components/schemas/MoneyCents"
          description: "Tope de pago por quincena de la persona, opcional (K13): no hay tope fijo; Axel lo captura por persona en Ajustes «Personas y reparto» cuando quiera. El comparador lo usa como objetivo (pago parejo y bajo el tope, K17), nunca como restricción dura (K16). Ausente (NULL) = sin tope. El contrato no fija ninguna cifra."
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
        has_account:
          type: "boolean"
          description: "true si tiene cuenta de usuario (Karen nunca)."
          x-calculado: true
    PersonUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de persona (tabla `person`)."
      x-tabla: "person"
      properties:
        display_name:
          type: "string"
          description: "Nombre que se muestra en pantallas y reportes"
        fortnight_payment_cap_cents:
          anyOf:
            - $ref: "#/components/schemas/MoneyCents"
            - type: "null"
          description: "Tope de pago por quincena de la persona, opcional (K13): no hay tope fijo; Axel lo captura por persona en Ajustes «Personas y reparto» cuando quiera. El comparador lo usa como objetivo (pago parejo y bajo el tope, K17), nunca como restricción dura (K16). Ausente (NULL) = sin tope. El contrato no fija ninguna cifra. · null borra el valor"
        notes:
          type:
            - "string"
            - "null"
          description: "notes · null borra el valor"
      minProperties: 1
    CostShareRulePart:
      type: "object"
      description: "Parte de una regla de reparto (tabla `cost_share_rule_part`). Parte de una persona dentro de una regla: un porcentaje o un monto fijo. Lo que no se asigna aquí va a la persona del resto. Campos ausentes = sin valor (NULL)."
      x-tabla: "cost_share_rule_part"
      required:
        - "id"
        - "rule_id"
        - "person_id"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        rule_id:
          type: "integer"
          description: "Regla a la que pertenece"
        person_id:
          type: "integer"
          description: "Persona de la parte"
        pct_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "Porcentaje en puntos base: 5000 = 50.00 % (Conjunto 50/50: Karen 5000)"
        fixed_cents:
          $ref: "#/components/schemas/MoneyCents"
          description: "Monto fijo en centavos (parte fija de Karen en despensas futuras: 119150)"
        created_at:
          $ref: "#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
    CostShareRule:
      type: "object"
      description: "Regla de reparto (tabla `cost_share_rule`). Cómo se divide un monto entre el hogar Axel–Ximena (a nombre del titular) y la participante externa: hogar, Karen o conjunto con su porcentaje. Las partes con porcentaje o monto fijo van en cost_share_rule_part y el resto cae en remainder_person_id. Campos ausentes = sin valor (NULL)."
      x-tabla: "cost_share_rule"
      required:
        - "id"
        - "name"
        - "remainder_person_id"
        - "is_template"
        - "is_default"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        name:
          type: "string"
          description: "Nombre visible (Hogar, Karen, Conjunto 50/50)"
        remainder_person_id:
          type: "integer"
          description: "Persona que recibe el resto del monto y absorbe los centavos de redondeo (en el hogar, el titular)"
        is_template:
          type: "boolean"
          description: "1 = regla reutilizable que se ofrece en capturas. 0 = regla de un solo uso (renglón «mixto» por cantidad)"
        is_default:
          type: "boolean"
          description: "1 = regla que aplica cuando ni el gasto ni su categoría traen regla (Hogar)"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
        parts:
          type: "array"
          items:
            $ref: "#/components/schemas/CostShareRulePart"
          description: "Partes de la regla (cost_share_rule_part)."
          x-calculado: true
    CostShareRulePartInput:
      type: "object"
      description: "Parte de una regla de reparto (entrada)."
      properties:
        person_id:
          type: "integer"
          description: "Persona (cost_share_rule_part.person_id)."
        pct_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "Porcentaje (cost_share_rule_part.pct_bp)."
        fixed_cents:
          $ref: "#/components/schemas/MoneyCents"
          description: "Monto fijo (cost_share_rule_part.fixed_cents)."
      required:
        - "person_id"
      additionalProperties: false
    CostShareRuleUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de regla de reparto (tabla `cost_share_rule`)."
      x-tabla: "cost_share_rule"
      properties:
        name:
          type: "string"
          description: "Nombre visible (Hogar, Karen, Conjunto 50/50)"
        notes:
          type:
            - "string"
            - "null"
          description: "notes · null borra el valor"
        parts:
          type: "array"
          items:
            $ref: "#/components/schemas/CostShareRulePartInput"
          description: "Reemplaza las partes de la regla (cost_share_rule_part). El resto y los centavos van a remainder_person_id."
        scope:
          type: "string"
          enum:
            - "onward"
            - "all"
          x-entrada: true
          x-provisional: true
          description: "Alcance del cambio de partes (Q2-68 C, RN-03; C1-datos §7.2): onward = «solo los nuevos»: los gastos ya guardados conservan sus partes congeladas en expense_share; all = «también los ya capturados»: el motor de reparto recalcula con las partes nuevas el expense_share de los gastos ya capturados. Obligatorio si viene parts y solo se acepta con parts (si no, 422 validation_failed). Sin valor por omisión: la pantalla pregunta el alcance en cada cambio (P-26.12). Qué gastos abarca all es PROVISIONAL: bloqueo C1-reparto-alcance."
      minProperties: 1
    Period:
      type: "object"
      description: "Periodo (tabla `period`). Mes calendario (periodo base del presupuesto) y sus dos quincenas (subperiodos). Los días de pago (15, y 30 o último día) son FIRMES (oráculo). Los rangos de la quincena (1 a 15 y 16 a fin de mes) son FIRMES (K8). Ambos se validan en la propia tabla. Campos ausentes = sin valor (NULL)."
      x-tabla: "period"
      required:
        - "id"
        - "kind"
        - "year"
        - "month"
        - "start_date"
        - "end_date"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        kind:
          type: "string"
          enum:
            - "month"
            - "fortnight"
          description: "month = mes calendario, fortnight = quincena"
        parent_id:
          type: "integer"
          description: "Mes al que pertenece la quincena. NULL en meses"
        year:
          type: "integer"
          description: "Año"
        month:
          type: "integer"
          description: "Mes"
        half:
          type: "integer"
          enum:
            - 1
            - 2
          description: "Quincena 1 (días 1 a 15) o 2 (día 16 a fin de mes). NULL en meses"
        start_date:
          $ref: "#/components/schemas/Date"
          description: "Primer día (ISO)"
        end_date:
          $ref: "#/components/schemas/Date"
          description: "Último día, inclusive (ISO)"
        pay_date:
          $ref: "#/components/schemas/Date"
          description: "Día de pago de la quincena: 15, o 30 o el último día si el mes es más corto (28-feb-2027). NULL en meses"
        created_at:
          $ref: "#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
        label:
          type: "string"
          description: "Clave del periodo en el formato del filtro `period` (2026-10 o 2026-10-q1)."
          x-calculado: true
    ShareLine:
      type: "object"
      description: "Parte de dinero de una persona."
      properties:
        person_id:
          type: "integer"
          description: "Persona (expense_share.person_id): el titular representa al hogar."
        amount_cents:
          $ref: "#/components/schemas/MoneyCents"
          description: "Monto de la parte (expense_share.amount_cents)."
      required:
        - "person_id"
        - "amount_cents"
      x-calculado: true
    Expense:
      type: "object"
      description: "Gasto (tabla `expense`). Gasto real: fijo, variable o venidero. Guarda la fecha que inicia el devengo, los meses de devengo, el medio de pago (si es crédito el efectivo sale por los pagos programados), quién pagó, a quién se atribuye y su reparto. Campos ausentes = sin valor (NULL)."
      x-tabla: "expense"
      required:
        - "id"
        - "kind"
