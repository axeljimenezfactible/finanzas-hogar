# Generador: backend/internal/api/c1gen/ (agente S6a-contrato-c1, WF-0, 2026-10-10; v1.1: agente C1-v1.1, puerta 1, 2026-10-11). Regenerar: python3 -I backend/internal/api/c1gen/build.py (con --check compara sin escribir).
# Fuente: esquema de S1 (backend/db/migrations/*.sql, aplicadas en orden) + necesidades de U1 (docs/design/U1-arquitectura.md). Ver docs/contratos/C1-datos.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1)"
  version: "1.5.1"
  summary: "Contrato C1 v1.5 del backend Go local de Finanzas Hogar."
  description: "Contrato C1 v1.5 (12-oct-2026, respuestas de las puertas 1, 1b, 2 y 2 bis, y tablero de control K54). Convenciones únicas (detalle en docs/contratos/C1-datos.md): dinero entero en centavos MXN con sufijo `_cents` (esquema MoneyCents, ROUND_HALF_UP, el último pago de una serie ajusta centavos); fechas ISO `AAAA-MM-DD` (Date) e instantes con desplazamiento de America/Mexico_City (DateTime; «Z» solo en entradas); un solo esquema de error (Error); paginación por cursor con la envoltura Page; seis filtros globales (person_id, family, category_id, store_id, period, credit_id); `Idempotency-Key` obligatoria en los POST de captura; parámetros operativos (K44) por clave de app_setting, con valor vigente, valor inicial y «restablecer», en las operaciones /api/v1/settings/*. Solo `POST /api/v1/auth/login` y `GET /health` son públicos; las cuatro operaciones del agente externo (`/api/v1/external-agent/*`, K53) usan la credencial de servicio `serviceToken` en lugar de la cookie; todo lo demás exige la cookie de sesión. Axel y Ximena tienen los mismos permisos; Karen no tiene cuenta. Extensiones: `x-tablas` (tablas de S1 que lee o escribe la operación), `x-necesidades` (necesidades N-xxx de U1), `x-calculado` (campo calculado, no es columna), `x-entrada` (dato de acción que no se guarda), `x-columna` (columna a la que corresponde una entrada en lista), `x-app-setting` (clave de app_setting), `x-tabla` (tabla de un esquema de entidad), `x-provisional` (depende de un bloqueo abierto) y `x-agente-externo` (operación del agente externo con credencial de servicio, K53)."
servers:
  - url: "https://finanzas.local:8443"
    description: "Máquina de casa, solo red local (decisión H)."
security:
  - cookieAuth: []
