                type: "integer"
                description: "kcal promedio por día."
              days_with_plan:
                type: "integer"
                description: "Días con al menos un tiempo asignado (n de 7)."
              daily_kcal_target:
                type: "integer"
                description: "Meta diaria (health_profile.daily_kcal_target)."
            required:
