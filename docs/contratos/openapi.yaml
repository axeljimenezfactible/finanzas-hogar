        category_id:
          type: "integer"
          description: "Categoría. NULL = presupuesto total del mes"
        amount_cents:
          $ref: "#/components/schemas/MoneyCents"
          description: "Monto planeado por mes en centavos"
        valid_from_date:
          $ref: "#/components/schemas/Date"
          description: "Primer día del primer mes en que rige"
        valid_to_date:
          $ref: "#/components/schemas/Date"
          description: "Último día del último mes en que rige, inclusive. NULL = rige hasta que se cambie. Cada cambio hecho en Ajustes elige su vigencia (K2) con el alcance `scope` de updateBudget: «de este mes en adelante» (`onward`, preseleccionada y valor por omisión) deja NULL y elimina los renglones posteriores de la misma categoría, que el monto nuevo reemplaza (updateBudget, C1-datos.md §7.1); «solo este mes» (`this_month`) pone el último día de ese mes y el monto anterior sigue desde el mes siguiente"
