          description: "Tipo del valor."
        unit:
          type: "string"
          description: "Unidad en español (intentos, minutos, días, MB…)."
        value:
          type:
            - "array"
            - "null"
          items:
            type: "integer"
            minimum: 0
          description: "Valor vigente (app_setting.value_json del hogar). null = no hay valor guardado."
        initial_value:
          type:
            - "array"
            - "null"
          items:
            type: "integer"
            minimum: 0
          description: "Valor inicial sembrado por la migración (el decidido en decisiones.md §A–§K; K44). «Restablecer» vuelve a él. null = no hay valor inicial."
        is_initial:
          type: "boolean"
          description: "true si el valor vigente es igual al inicial."
    SettingParameterTime:
      type: "object"
      x-calculado: true
      description: "Parámetro operativo de tipo hora HH:MM (K44, C1 §11.7): una clave de app_setting del hogar con su valor vigente y su valor inicial. El tipo y el rango de cada clave los validan los disparadores de S1 (trg_app_setting_param_int* de 00003; trg_app_setting_param_range* y trg_app_setting_param_time* de 00004) y los declara la propiedad de la clave en el cambio de su sección (minimum, maximum o pattern; puerta 2, K50)."
      required:
        - "key"
        - "value_type"
        - "unit"
        - "value"
        - "initial_value"
        - "is_initial"
      properties:
        key:
          type: "string"
          description: "Clave de app_setting (app_setting.setting_key)."
        value_type:
          type: "string"
          enum:
            - "time"
          description: "Tipo del valor."
        unit:
          type: "string"
          description: "Unidad en español (intentos, minutos, días, MB…)."
        value:
          type:
            - "string"
            - "null"
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: "Valor vigente (app_setting.value_json del hogar). null = no hay valor guardado."
        initial_value:
          type:
            - "string"
            - "null"
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: "Valor inicial sembrado por la migración (el decidido en decisiones.md §A–§K; K44). «Restablecer» vuelve a él. null = no hay valor inicial."
        is_initial:
          type: "boolean"
          description: "true si el valor vigente es igual al inicial."
    PriceSettings:
      type: "object"
      description: "Ajustes de precios (app_setting price.*; N-291, N-322). La frescura y el peso en la comparativa siguen RN-12 con los valores vigentes de price.stale_after_days y price.zero_weight_after_days (K22, K40, K44); PROFECO nunca compite: solo es referencia."
      properties:
        assisted_reading_enabled:
          type: "boolean"
          description: "Interruptor general de la lectura asistida (price.assisted_reading_enabled, false por defecto). No aplica desde K53: la aplicación no lee sitios de tiendas."
          x-app-setting: "price.assisted_reading_enabled"
        parameters:
          type: "object"
          additionalProperties: false
          required:
            - "price.stale_after_days"
            - "price.zero_weight_after_days"
            - "price.profeco_import_max_gb"
          properties:
            price.stale_after_days:
              $ref: "#/components/schemas/SettingParameterInteger"
              description: "Un precio es viejo cuando tiene esta edad en días o más (decisión E). Valor inicial: 30 (días; Decisión E, K22; sembrado por 00001). Rango: entero de 1 o más; 1 o más (Q2-77), Q2-77 (K50)."
              x-app-setting: "price.stale_after_days"
            price.zero_weight_after_days:
              $ref: "#/components/schemas/SettingParameterInteger"
              description: "Días de edad desde los que un precio ya no compite en la comparativa: solo se muestra marcado. Entero en días. Entre price.stale_after_days y este valor el peso baja en línea recta (K22, K40, K44). Valor inicial: 90 (días; K22, K40; sembrado por 00003). Rango: entero de 0 o más; igual o mayor que price.stale_after_days (Q2-77; lo valida el motor de precios), Q2-77 (K50)."
              x-app-setting: "price.zero_weight_after_days"
            price.profeco_import_max_gb:
              $ref: "#/components/schemas/SettingParameterInteger"
              description: "Tamaño máximo de un archivo de PROFECO al importarlo. Entero en GB (K6, K44). Valor inicial: 1 (GB; K6; sembrado por 00003). Rango: entero de 0 o más."
              x-app-setting: "price.profeco_import_max_gb"
          x-calculado: true
          description: "Parámetros operativos de «Tiendas y precios» por clave de app_setting (K44, C1 §11.7): valor vigente, valor inicial, tipo y unidad."
      required:
        - "assisted_reading_enabled"
        - "parameters"
      x-calculado: true
    PriceSettingsUpdate:
      type: "object"
      description: "Cambio de los ajustes de precios (N-292, N-322): el interruptor general de lectura asistida y los parámetros de K44. Desde K53 la aplicación no lee sitios de tiendas y ningún veredicto habilita el interruptor: true responde siempre 409 assisted_reading_not_allowed (docs/estado/S5-terminos.md queda como registro histórico). price.zero_weight_after_days tiene que ser igual o mayor que price.stale_after_days con los valores que quedan después del cambio (Q2-77, K50, RN-12; también lo valida el motor de precios): si no, 422 validation_failed y no se guarda ninguno."
      properties:
        assisted_reading_enabled:
          type: "boolean"
          description: "Nuevo valor."
          x-app-setting: "price.assisted_reading_enabled"
        parameters:
          type: "object"
          additionalProperties: false
          minProperties: 1
          description: "Valores nuevos por clave de app_setting (K44). Un valor vacío, null, de otro tipo o fuera del rango de la clave (minimum, maximum o pattern de su propiedad; puerta 2, K50) responde 422 validation_failed y no se sustituye por otro."
          properties:
            price.stale_after_days:
              type: "integer"
              minimum: 1
              description: "Valor nuevo de price.stale_after_days (días). Rango: entero de 1 o más; 1 o más (Q2-77), Q2-77 (K50)."
              x-app-setting: "price.stale_after_days"
            price.zero_weight_after_days:
              type: "integer"
              minimum: 0
              description: "Valor nuevo de price.zero_weight_after_days (días). Rango: entero de 0 o más; igual o mayor que price.stale_after_days (Q2-77; lo valida el motor de precios), Q2-77 (K50)."
              x-app-setting: "price.zero_weight_after_days"
            price.profeco_import_max_gb:
              type: "integer"
              minimum: 0
              description: "Valor nuevo de price.profeco_import_max_gb (GB). Rango: entero de 0 o más."
              x-app-setting: "price.profeco_import_max_gb"
        reset_parameters:
          type: "array"
          uniqueItems: true
          minItems: 1
          items:
            type: "string"
            enum:
              - "price.stale_after_days"
              - "price.zero_weight_after_days"
              - "price.profeco_import_max_gb"
          x-entrada: true
          description: "Restablecer (K44): claves que vuelven a su valor inicial (initial_value de la lectura). Una clave no puede venir a la vez aquí y en parameters (422 validation_failed)."
      additionalProperties: false
      minProperties: 1
    ExternalAgentReference:
      type: "object"
      description: "Datos de referencia para el agente externo (K53): ids de tiendas, grupos de producto y tiempos de comida con los que arma sus lotes. Los ids de productos y presentaciones los devuelve importExternalCatalog."
