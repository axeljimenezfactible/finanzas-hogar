  - name: "Inicio"
    description: "Inicio: tarjetas del resumen, calendario del hogar, búsqueda y vistas de base de datos."
  - name: "Gastos"
    description: "Gastos, adjuntos y captura de tickets con OCR."
  - name: "Presupuesto"
    description: "Presupuesto, flujo y proyección, ingresos y ahorro."
  - name: "Comidas"
    description: "Plan de comidas y recetario."
