      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de un renglón de presupuesto: monto, fin de la vigencia (valid_to_date; null = sin fin) o notas. Alcance de un cambio de monto (K2): «de este mes en adelante» (scope=onward, preseleccionado) o «solo este mes» (scope=this_month); lo aplica updateBudget partiendo los renglones sin traslapes; con onward el monto nuevo rige sin fin y reemplaza los renglones posteriores de la categoría (C1-datos.md §7.1)."
      x-tabla: "budget"
