        current_weight_date:
          $ref: "#/components/schemas/Date"
          description: "Fecha del último peso."
          x-calculado: true
        age_years:
          type: "integer"
          description: "Edad en años cumplidos a hoy."
          x-calculado: true
        bmi_tenths:
          type: "integer"
          description: "IMC × 10, ROUND_HALF_UP (peso kg ÷ estatura m²)."
          x-calculado: true
        bmi_class:
          type: "string"
          enum:
            - "underweight"
            - "normal"
            - "overweight"
            - "obesity"
          description: "Clasificación del IMC (motor S4; OMS 18.5 / 25 / 30, K7)."
          x-calculado: true
        suggested_kcal_target:
          type: "integer"
          description: "Meta diaria de kcal sugerida (motor S4, RN-17 1.3, K23, K36): Mifflin-St Jeor × factor de actividad (5 niveles, 1.2 a 1.9); con goal = lose se resta el ajuste de bajar y con gain se suma el de subir: el de la persona (goal_adjust_lose_kcal o goal_adjust_gain_kcal) o, si es NULL, el de la casa (app_setting health.goal_adjust_lose_kcal o health.goal_adjust_gain_kcal); maintain no ajusta; un solo redondeo ROUND_HALF_UP al final. Con los valores iniciales (0 y 0) los tres objetivos sugieren lo mismo. La persona la confirma o escribe otra en daily_kcal_target. Ausente si falta algún dato (estatura, fecha de nacimiento, sexo, actividad, peso u objetivo)."
          x-calculado: true
        household_goal_adjust_lose_kcal:
          type: "integer"
          description: "Ajuste de bajar de la casa (app_setting health.goal_adjust_lose_kcal, 0 al sembrar; K36, K44), para mostrar «El de la casa: n kcal»; se cambia con updateHealthSettings (N-326)."
          x-calculado: true
        household_goal_adjust_gain_kcal:
