    description: "Lista de compras, comparar canasta, productos, precios e inventario."
  - name: "Créditos"
    description: "Líneas, compras a crédito, pagos, promociones y comparador de escenarios."
  - name: "Salud"
    description: "Perfil de salud, peso y calorías."
  - name: "Reportes"
    description: "Reportes, estado de cuenta de Karen, avisos enviados y jobs."
  - name: "Ajustes"
    description: "Las 14 secciones de Ajustes, sesiones y sistema."
