    ShoppingList:
      type: "object"
      description: "Lista de compras de la semana (N-150). Guarda lo que no se calcula (artículos a mano, tienda, presentación o cantidad elegidas y marcas de comprado; shopping_list y shopping_list_item) y añade al consultar lo que calculan S4 y S5 (piezas, tienda recomendada, precio y frescura). Agrupada por vertical y tienda asignada (orden de groups[]: S4 §6.5, Q2-42 A), luego categoría de producto, orden alfabético. Marcas y artículos compartidos en el servidor entre los dos teléfonos (K1)."
      properties:
        shopping_list_id:
          type: "integer"
          description: "Lista guardada de la semana (shopping_list.id). Ausente = la semana todavía no tiene lista: se crea al generarla (N-127) o al agregar un artículo (N-152)."
        start_date:
          $ref: "#/components/schemas/Date"
          description: "Primer día de la semana (shopping_list.start_date; lunes, K8)."
        end_date:
          $ref: "#/components/schemas/Date"
          description: "Último día de la semana, inclusive (shopping_list.end_date)."
        generated_at:
          $ref: "#/components/schemas/DateTime"
          description: "Última generación desde el plan (shopping_list.generated_at). Ausente = no se ha generado."
        groups:
          type: "array"
          items:
            type: "object"
            description: "Grupo: par vertical y tienda asignada (S4 §6.5). Orden (Q2-42 A): primero los de mercado y luego los de cadena; dentro de cada vertical, por visit_date ascendente (sin fecha al final) y luego por id de tienda, con el grupo sin tienda al final."
            properties:
              purchase_channel:
                type: "string"
                enum:
                  - "market"
                  - "chain"
                description: "Vertical (product_group.purchase_channel)."
              store_id:
                type: "integer"
                description: "Tienda asignada del grupo (assigned_store_id de sus artículos). Ausente = sin tienda; en vertical market es el grupo «sin mercado dado de alta» (Q2-40 A), con el total de sus artículos con precio de S5."
              visit_weekday:
                type: "integer"
                description: "Día ISO de visit_date (1 = lunes … 7 = domingo), que es el visit_weekday del mercado. Solo en grupos de mercado con tienda."
              visit_date:
                $ref: "#/components/schemas/Date"
                description: "Fecha de la próxima visita del mercado (S4 next_visit, que calcula S5 §9; Q2-42 A: se cuenta desde la fecha más tardía entre hoy y el lunes de la semana de la lista). Solo en grupos de mercado con tienda."
              items:
                type: "array"
                items:
                  $ref: "#/components/schemas/ShoppingListItem"
                description: "Artículos."
              total_cents:
                $ref: "#/components/schemas/MoneyCents"
                description: "Total estimado del grupo: Σ estimated_price_cents de sus artículos con precio (calculated y manual, comprados o no). Los que no tienen precio no suman y se reconocen por estimated_price_cents ausente (Q2-42 A)."
