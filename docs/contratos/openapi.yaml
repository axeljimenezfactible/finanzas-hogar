          $ref: "#/components/schemas/DateTime"
          description: "updated_at"
        goal:
          type: "string"
          enum:
            - "lose"
            - "maintain"
            - "gain"
          description: "Objetivo que ajusta la meta sugerida de kilocalorías: lose = bajar de peso, maintain = mantener, gain = subir. NULL = todavía no lo elige"
