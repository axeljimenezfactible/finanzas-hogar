    Budget:
      type: "object"
      description: "Presupuesto (tabla `budget`). Monto mensual planeado por categoría o total, con vigencia: rige desde un mes hasta otro (inclusive) o sin fin. El monto de un solo mes es un renglón que empieza y termina en ese mes. Sirve para «real contra plan» y para las alertas al 80 % y 100 %. Campos ausentes = sin valor (NULL)."
      x-tabla: "budget"
      required:
        - "id"
        - "amount_cents"
        - "valid_from_date"
        - "created_at"
        - "updated_at"
