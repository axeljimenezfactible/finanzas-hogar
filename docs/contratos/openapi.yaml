                  - "market"
                  - "chain"
                description: "product_group.purchase_channel."
            required:
              - "id"
              - "name"
              - "purchase_channel"
            x-calculado: true
          description: "Grupos de producto, en orden de id."
        meal_slots:
          type: "array"
          items:
            type: "object"
            description: "Tiempo de comida."
            properties:
              id:
                type: "integer"
                description: "meal_slot.id."
              code:
                type: "string"
                enum:
                  - "breakfast"
                  - "lunch"
                  - "dinner"
                  - "snack"
                description: "meal_slot.code."
              name:
                type: "string"
                description: "meal_slot.name."
            required:
              - "id"
              - "code"
              - "name"
            x-calculado: true
          description: "Tiempos de comida, en orden de sort_order."
      required:
        - "stores"
        - "product_groups"
        - "meal_slots"
      x-calculado: true
    ExternalCatalogItem:
      type: "object"
      description: "Producto del lote con sus presentaciones (entrada)."
