          type: "integer"
          description: "Decimales con que se capturó el porcentaje de la tasa anual; la pantalla lo muestra así y los cálculos usan annual_rate_num/annual_rate_den. NULL = sin tasa o sin dato"
      required:
        - "name"
        - "kind"
        - "holder_person_id"
        - "payment_frequency"
    CreditUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de crédito (tabla `credit`)."
      x-tabla: "credit"
      properties:
        name:
          type: "string"
          description: "Nombre visible (Kueski Pay)"
        kind:
          type: "string"
          enum:
            - "revolving_line"
            - "bank_card"
            - "term_loan"
            - "store_credit"
          description: "revolving_line = línea revolvente tipo Kueski, bank_card = tarjeta bancaria, term_loan = préstamo personal a plazo fijo, store_credit = crédito de tienda con abonos"
        lender:
          type:
            - "string"
            - "null"
          description: "Institución que otorga el crédito · null borra el valor"
        holder_person_id:
          type: "integer"
          description: "Titular del crédito (Axel)"
        credit_limit_cents:
          anyOf:
            - $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
            - type: "null"
          description: "Límite de la línea (Kueski 1000000) · null borra el valor"
        payment_frequency:
          type: "string"
          enum:
            - "weekly"
            - "fortnightly"
            - "monthly"
          description: "Frecuencia de los pagos. fortnightly cae en los días 15 y 30 (o último día)"
        first_payment_min_days:
          type:
            - "integer"
            - "null"
          description: "Días mínimos entre la compra y el primer pago (Kueski 15, oráculo) · null borra el valor"
        availability_reading:
          type: "string"
          enum:
            - "A"
            - "B"
          description: "Lectura del disponible (interruptor de Ajustes, solo aplica en revolving_line): B = el límite es el tope total (por defecto), A = el límite está libre en la fecha ancla y los pagos suman encima"
        availability_confirmed:
          type: "boolean"
          description: "0 = mostrar el aviso «pendiente confirmar» con el acreedor"
        reading_a_anchor_date:
          anyOf:
            - $ref: "componentes-comunes.yaml#/components/schemas/Date"
            - type: "null"
          description: "Fecha «hoy» de la lectura A: lo comprado hasta ese día ya está dentro del límite libre (Kueski 2026-10-10) · null borra el valor"
        statement_day:
          type:
            - "integer"
            - "null"
          description: "Día de corte de la tarjeta · null borra el valor"
        payment_due_day:
          type:
            - "integer"
            - "null"
          description: "Día límite de pago de la tarjeta · null borra el valor"
        annual_rate_num:
          type:
            - "integer"
            - "null"
          description: "Numerador de la tasa anual ordinaria (tarjeta, préstamo) · null borra el valor"
        annual_rate_den:
          type:
            - "integer"
            - "null"
          description: "Denominador de la tasa anual ordinaria · null borra el valor"
        vat_on_interest_bp:
          anyOf:
            - $ref: "#/components/schemas/BasisPoints"
            - type: "null"
          description: "IVA que se suma a los intereses cuando la tasa no lo trae (1600 = 16 %). NULL = la tasa o la cotización ya incluye IVA (Kueski) · null borra el valor"
        annual_fee_cents:
          anyOf:
            - $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
            - type: "null"
          description: "Comisión anual · null borra el valor"
        late_fee_cents:
          anyOf:
            - $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
            - type: "null"
          description: "Comisión por pago tardío · null borra el valor"
        opening_fee_cents:
          anyOf:
            - $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
            - type: "null"
          description: "Comisión por apertura · null borra el valor"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type:
            - "string"
            - "null"
          description: "notes · null borra el valor"
        rate_base:
          type:
            - "string"
            - "null"
          enum:
            - "daily"
            - "monthly"
            - null
          description: "Base con que el estado de cuenta aplica la tasa anual: daily = diaria, monthly = mensual. NULL = falta capturar · null borra el valor"
        min_payment_pct_bp:
          anyOf:
            - $ref: "#/components/schemas/BasisPoints"
            - type: "null"
          description: "Porcentaje del pago mínimo que dice el estado de cuenta, en puntos base. NULL = falta capturar · null borra el valor"
        min_payment_fixed_cents:
          anyOf:
            - $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
            - type: "null"
          description: "Mínimo fijo del pago mínimo que dice el estado de cuenta. NULL = falta capturar · null borra el valor"
        annual_rate_decimals:
          type:
            - "integer"
            - "null"
          description: "Decimales con que se capturó el porcentaje de la tasa anual; la pantalla lo muestra así y los cálculos usan annual_rate_num/annual_rate_den. NULL = sin tasa o sin dato · null borra el valor"
      minProperties: 1
