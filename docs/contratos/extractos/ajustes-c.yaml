      operationId: "updateCostShareRule"
      tags:
        - "Ajustes"
      summary: "Editar reparto por defecto"
      description: "P. ej. el % del Conjunto (50/50 por defecto, decisión B). Un cambio de parts lleva su alcance en scope (Q2-68 C, RN-03; C1-datos §7.2): onward no toca los gastos ya guardados (sus partes están congeladas en expense_share); all recalcula con las partes nuevas las de los gastos ya capturados. parts sin scope: 422 validation_failed."
