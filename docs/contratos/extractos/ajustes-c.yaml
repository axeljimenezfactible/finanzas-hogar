        - "cost_share_rule"
        - "cost_share_rule_part"
        - "person"
      parameters:
        - name: "is_template"
          in: "query"
          required: false
          description: "true (por defecto) = reglas reutilizables (Hogar, Karen, Conjunto 50/50)."
          schema:
            type: "boolean"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
