components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    BasisPoints:
      type: "integer"
      minimum: 0
      maximum: 10000
      description: "Porcentaje en puntos base: 10000 = 100 %, 5000 = 50 %."
      examples:
        - 5000
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    MealSlot:
      type: "object"
      description: "Tiempo de comida (tabla `meal_slot`). Los cuatro tiempos del día: desayuno, comida, cena y colación (cuarto tiempo opcional con costo y calorías). Datos de referencia que crea esta migración. Campos ausentes = sin valor (NULL)."
      x-tabla: "meal_slot"
      required:
        - "id"
        - "code"
        - "name"
        - "sort_order"
        - "is_optional"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        code:
          type: "string"
          enum:
            - "breakfast"
            - "lunch"
            - "dinner"
            - "snack"
          description: "breakfast = desayuno, lunch = comida, dinner = cena, snack = colación"
        name:
          type: "string"
          description: "Nombre en pantalla"
        sort_order:
          type: "integer"
          description: "Orden en el día"
        is_optional:
          type: "boolean"
          description: "1 = tiempo opcional (colación)"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
    Store:
      type: "object"
      description: "Tienda (tabla `store`). Cadena (Walmart, Bodega Aurrera, Sam's Club), sucursal de una cadena, o mercado o tianguis con su día de visita. La membresía y el permiso de lectura asistida viven en la cadena. Campos ausentes = sin valor (NULL)."
      x-tabla: "store"
      required:
        - "id"
        - "kind"
        - "name"
        - "assisted_reading_enabled"
        - "requires_membership"
        - "has_membership"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        kind:
          type: "string"
          enum:
            - "chain"
            - "branch"
            - "market"
          description: "chain = cadena, branch = sucursal de una cadena, market = mercado o tianguis"
        parent_id:
          type: "integer"
          description: "Cadena de la sucursal. Solo en branch"
        name:
          type: "string"
          description: "Nombre: cadena (Bodega Aurrera), sucursal (Vallejo) o mercado"
        profeco_name:
          type: "string"
          description: "Nombre en PROFECO para cruzar precios: cadena_comercial en cadenas, nombre_comercial en sucursales"
        website_url:
          type: "string"
          description: "Sitio de la cadena. Solo en chain"
        assisted_reading_enabled:
          type: "boolean"
          description: "Lectura asistida del sitio de la cadena. Queda en 0 hasta que docs/estado/S5-terminos.md tenga veredicto para ese sitio"
        address:
          type: "string"
          description: "Dirección (sucursal o mercado)"
        municipality:
          type: "string"
          description: "Municipio o alcaldía, para cruzar con PROFECO"
        state:
          type: "string"
          description: "Entidad federativa"
        visit_weekday:
          type: "integer"
          description: "Día de visita del mercado: 1 = lunes … 7 = domingo (ISO 8601)"
        requires_membership:
          type: "boolean"
          description: "1 = la cadena exige membresía (Sam's Club)"
        has_membership:
          type: "boolean"
          description: "1 = la casa ya tiene la membresía (hoy Sam's = 0 y se evalúa)"
        membership_annual_fee_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Costo anual de la membresía en centavos (lo captura Axel en Ajustes)"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        product_group_ids:
          type: "array"
          items:
            type: "integer"
          description: "Qué se compra ahí (store_product_group)."
          x-calculado: true
        assisted_reading_verdict:
          type: "string"
          enum:
            - "allowed"
            - "denied"
            - "missing"
          description: "Veredicto de términos del sitio en docs/estado/S5-terminos.md."
          x-calculado: true
    StoreCreate:
      type: "object"
      additionalProperties: false
      description: "Alta de tienda (tabla `store`)."
      x-tabla: "store"
      properties:
        kind:
          type: "string"
          enum:
            - "chain"
            - "branch"
            - "market"
          description: "chain = cadena, branch = sucursal de una cadena, market = mercado o tianguis"
        parent_id:
          type: "integer"
          description: "Cadena de la sucursal. Solo en branch"
        name:
          type: "string"
          description: "Nombre: cadena (Bodega Aurrera), sucursal (Vallejo) o mercado"
        profeco_name:
          type: "string"
          description: "Nombre en PROFECO para cruzar precios: cadena_comercial en cadenas, nombre_comercial en sucursales"
        website_url:
          type: "string"
          description: "Sitio de la cadena. Solo en chain"
        address:
          type: "string"
          description: "Dirección (sucursal o mercado)"
        municipality:
          type: "string"
          description: "Municipio o alcaldía, para cruzar con PROFECO"
        state:
          type: "string"
          description: "Entidad federativa"
        visit_weekday:
          type: "integer"
          description: "Día de visita del mercado: 1 = lunes … 7 = domingo (ISO 8601)"
        requires_membership:
          type: "boolean"
          description: "1 = la cadena exige membresía (Sam's Club)"
        has_membership:
          type: "boolean"
          description: "1 = la casa ya tiene la membresía (hoy Sam's = 0 y se evalúa)"
        membership_annual_fee_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Costo anual de la membresía en centavos (lo captura Axel en Ajustes)"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
