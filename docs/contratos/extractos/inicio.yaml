          required: true
          description: "Entidad (nombre_codigo de la tabla) de la vista."
          schema:
            type: "string"
            enum:
              - "person"
              - "user_account"
              - "device_session"
              - "income"
              - "category"
              - "expense"
              - "savings_goal"
              - "savings_movement"
              - "credit"
              - "credit_term_rate"
              - "credit_purchase"
              - "scheduled_payment"
              - "promotion"
              - "store"
              - "product"
              - "price"
              - "recipe"
              - "meal_plan_entry"
              - "inventory_item"
              - "weight_entry"
              - "notification_delivery"
              - "job"
              - "backup"
        - name: "mode"
          in: "query"
          required: true
          description: "Modo de la vista."
          schema:
            type: "string"
            enum:
              - "table"
              - "board"
              - "calendar"
              - "gallery"
        - name: "group_by"
          in: "query"
          required: false
          description: "Propiedad de agrupación del tablero (nombre_codigo o calculada); valores permitidos por entidad en C1 §8."
          schema:
            type: "string"
            pattern: "^[a-z][a-z0-9_]*$"
        - name: "date_field"
          in: "query"
          required: false
          description: "Propiedad de fecha del calendario (C1 §8)."
          schema:
            type: "string"
            pattern: "^[a-z][a-z0-9_]*$"
        - $ref: "componentes-comunes.yaml#/components/parameters/Q"
        - name: "status"
          in: "query"
          required: false
          description: "Estado propio de la entidad (C1 §8)."
          schema:
