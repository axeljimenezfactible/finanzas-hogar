            - "credit_id"
            - "amount_cents"
            - "household_share_cents"
            - "external_share_cents"
            - "days_left"
            - "payment_count"
            - "is_overdue"
          x-calculado: true
        availability:
          type: "array"
          items:
            type: "object"
            description: "Disponible de una línea revolvente con interruptor A/B (N-022 b, motor S3)."
            properties:
              credit_id:
                type: "integer"
                description: "Línea."
              availability_reading:
                type: "string"
                enum:
                  - "A"
                  - "B"
