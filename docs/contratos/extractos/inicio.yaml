              - "user_account"
              - "device_session"
              - "income"
              - "category"
              - "expense"
              - "savings_goal"
              - "savings_movement"
              - "credit"
              - "credit_term_rate"
              - "credit_purchase"
              - "scheduled_payment"
              - "promotion"
              - "store"
              - "product"
              - "price"
              - "recipe"
              - "meal_plan_entry"
              - "inventory_item"
              - "weight_entry"
              - "notification_delivery"
