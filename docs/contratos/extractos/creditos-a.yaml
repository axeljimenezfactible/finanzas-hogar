# Finanzas Hogar · Contrato C1 v1.4.0 · extracto «creditos-a». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto creditos-a"
  version: "1.4.0"
  description: "Extracto de la etiqueta «Créditos» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Créditos"
    description: "Líneas, compras a crédito, pagos, promociones y comparador de escenarios."
paths:
  /api/v1/credits:
    get:
      operationId: "listCredits"
      tags:
        - "Créditos"
      summary: "Líneas de crédito"
      description: "Orden por defecto: next_payment_date (P-17); name para la barra lateral (N-005) y la forma de pago (N-053)."
      x-necesidades:
        - "N-005"
        - "N-053"
        - "N-190"
        - "N-283"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_statement"
        - "credit_term_rate"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Q"
        - name: "kind"
          in: "query"
          required: false
          description: "Tipo de crédito."
          schema:
            type: "string"
            enum:
              - "revolving_line"
              - "bank_card"
              - "term_loan"
              - "store_credit"
        - name: "status"
          in: "query"
          required: false
          description: "active (por defecto) o archived."
          schema:
            type: "string"
            enum:
              - "active"
              - "archived"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/credits/totals:
    get:
      operationId: "getCreditTotals"
      tags:
        - "Créditos"
      summary: "Totales de créditos"
      description: "Totales de créditos."
      x-necesidades:
        - "N-191"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "credit_statement"
        - "credit_term_rate"
        - "scheduled_payment"
        - "scheduled_payment_share"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditTotals"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/credits/debt-trend:
    get:
      operationId: "getDebtTrend"
      tags:
