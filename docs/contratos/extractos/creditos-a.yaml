components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    BasisPoints:
      type: "integer"
      minimum: 0
      maximum: 10000
      description: "Porcentaje en puntos base: 10000 = 100 %, 5000 = 50 %."
      examples:
        - 5000
    Credit:
      type: "object"
      description: "Crédito (tabla `credit`). Crédito del titular: línea revolvente tipo Kueski, tarjeta bancaria, préstamo personal a plazo fijo o crédito de tienda con abonos. Guarda el límite, la lectura A/B, las fechas de corte y pago y las comisiones. Campos ausentes = sin valor (NULL)."
      x-tabla: "credit"
      required:
        - "id"
        - "name"
        - "kind"
        - "holder_person_id"
        - "payment_frequency"
        - "availability_reading"
        - "availability_confirmed"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        name:
          type: "string"
          description: "Nombre visible (Kueski Pay)"
        kind:
          type: "string"
          enum:
            - "revolving_line"
            - "bank_card"
            - "term_loan"
            - "store_credit"
          description: "revolving_line = línea revolvente tipo Kueski, bank_card = tarjeta bancaria, term_loan = préstamo personal a plazo fijo, store_credit = crédito de tienda con abonos"
        lender:
          type: "string"
          description: "Institución que otorga el crédito"
        holder_person_id:
          type: "integer"
          description: "Titular del crédito (Axel)"
        credit_limit_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Límite de la línea (Kueski 1000000)"
        payment_frequency:
          type: "string"
          enum:
            - "weekly"
            - "fortnightly"
            - "monthly"
          description: "Frecuencia de los pagos. fortnightly cae en los días 15 y 30 (o último día)"
        first_payment_min_days:
          type: "integer"
          description: "Días mínimos entre la compra y el primer pago (Kueski 15, oráculo)"
        availability_reading:
          type: "string"
          enum:
            - "A"
            - "B"
          description: "Lectura del disponible (interruptor de Ajustes, solo aplica en revolving_line): B = el límite es el tope total (por defecto), A = el límite está libre en la fecha ancla y los pagos suman encima"
        availability_confirmed:
          type: "boolean"
          description: "0 = mostrar el aviso «pendiente confirmar» con el acreedor"
        reading_a_anchor_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha «hoy» de la lectura A: lo comprado hasta ese día ya está dentro del límite libre (Kueski 2026-10-10)"
        statement_day:
          type: "integer"
          description: "Día de corte de la tarjeta"
        payment_due_day:
          type: "integer"
          description: "Día límite de pago de la tarjeta"
        annual_rate_num:
          type: "integer"
          description: "Numerador de la tasa anual ordinaria (tarjeta, préstamo)"
        annual_rate_den:
          type: "integer"
          description: "Denominador de la tasa anual ordinaria"
        vat_on_interest_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "IVA que se suma a los intereses cuando la tasa no lo trae (1600 = 16 %). NULL = la tasa o la cotización ya incluye IVA (Kueski) Desde 1.4 (00004, Q2-67 opción 1) si la tasa ya incluye IVA lo dice `credit.vat_included`: este porcentaje conserva su significado y solo lleva valor cuando `vat_included` = 0; con `vat_included` = 1 es NULL, y con `vat_included` NULL el dato falta por capturar (RN-26)"
        annual_fee_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Comisión anual"
        late_fee_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Comisión por pago tardío"
        opening_fee_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Comisión por apertura"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        rate_base:
          type: "string"
          enum:
            - "daily"
            - "monthly"
          description: "Base con que el estado de cuenta aplica la tasa anual: daily = diaria, monthly = mensual. NULL = falta capturar"
        min_payment_pct_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "Porcentaje del pago mínimo que dice el estado de cuenta, en puntos base. NULL = falta capturar"
        min_payment_fixed_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Mínimo fijo del pago mínimo que dice el estado de cuenta. NULL = falta capturar"
        annual_rate_decimals:
          type: "integer"
          description: "Decimales con que se capturó el porcentaje de la tasa anual; la pantalla lo muestra así y los cálculos usan annual_rate_num/annual_rate_den. NULL = sin tasa o sin dato"
        vat_included:
          type: "boolean"
          description: "¿La tasa anual o la cotización ya incluye IVA? 1 = sí, no se suma IVA aparte; 0 = no, se suma el de vat_on_interest_bp; NULL = falta capturar (S3 lo lista como `vat` en missing_terms de `bank_card` y `store_credit`). Los créditos que ya existían al migrar pasan con el significado de 1.3 (porcentaje con valor → 0; NULL → 1). Con 0 y vat_on_interest_bp NULL falta el porcentaje: PROVISIONAL (bloqueo abierto S3-iva-lectura, pregunta 2) `vat` también va en missing_terms y S3 dice «falta capturar»; no calcula con 0 % ni inventa un porcentaje (K18)"
          x-provisional: true
        live_debt_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Deuda viva = capital + intereses por pagar (motor S3)."
          x-calculado: true
        available_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Disponible hoy: revolvente con la lectura activa; tarjeta = límite − saldo; préstamo y tienda: ausente."
          x-calculado: true
        next_payment_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Próximo pago con alguna parte pendiente."
          x-calculado: true
        next_payment_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto del próximo pago."
          x-calculado: true
        live_purchase_count:
          type: "integer"
          description: "Compras vivas (status active)."
          x-calculado: true
        annual_rate_pct:
          type: "string"
          description: "Tasa anual en porcentaje como se capturó: annual_rate_num/annual_rate_den redondeada ROUND_HALF_UP a annual_rate_decimals decimales (K12); ausente sin tasa o sin decimales."
          x-calculado: true
        missing_terms:
          type: "array"
          items:
            type: "string"
            enum:
              - "annual_rate"
              - "rate_base"
              - "vat"
              - "min_payment_pct_bp"
              - "min_payment_fixed_cents"
          description: "Datos del estado de cuenta que faltan para la fórmula general de tarjeta bancaria o crédito de tienda (K18, RN-26): son 5 desde C1 v1.3 (Q2-67 opción 1, K46): annual_rate, rate_base, vat, min_payment_pct_bp y min_payment_fixed_cents. vat sale mientras vat_included sea NULL (falta capturar si la tasa incluye IVA). Vacío = completo o no aplica. Con alguno, la pantalla muestra «falta capturar». Con vat_included = 0 y sin vat_on_interest_bp también sale vat: PROVISIONAL, bloqueo S3-iva-lectura (pregunta 2; lectura en uso de S3 1.5 §5.3)."
          x-calculado: true
          x-provisional: true
    CreditTotals:
      type: "object"
      description: "Totales de créditos (N-191)."
      properties:
        live_debt_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Deuda viva total."
        fortnight_total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Pagos con fecha en la quincena en curso."
        fortnight_household_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte del hogar."
        fortnight_external_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte de Karen."
        month_total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Pagos del mes en curso."
        month_household_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte del hogar."
        month_external_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte de Karen."
        interest_paid_month_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Intereses pagados en el mes."
        interest_paid_year_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Intereses pagados en el año calendario."
      required:
        - "live_debt_cents"
        - "fortnight_total_cents"
        - "fortnight_household_cents"
        - "fortnight_external_cents"
        - "month_total_cents"
        - "month_household_cents"
        - "month_external_cents"
        - "interest_paid_month_cents"
        - "interest_paid_year_cents"
      x-calculado: true
    AvailabilityPreview:
      type: "object"
      description: "Vista previa A/B (N-285, N-201, motor S3). Canon semilla 10-oct-2026: hoy A 1000000 y B 690550; mínimos A 809450 y B 500000."
      properties:
        credit_id:
          type: "integer"
          description: "Línea revolvente."
        availability_reading:
          type: "string"
          enum:
            - "A"
            - "B"
          description: "Lectura activa."
        availability_confirmed:
          type: "boolean"
          description: "false = aviso «pendiente confirmar»."
        reading_a:
          type: "object"
          description: "Disponible con una lectura."
          properties:
            available_today_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Disponible de hoy."
            horizon_min_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Mínimo del horizonte."
          required:
            - "available_today_cents"
            - "horizon_min_cents"
          x-calculado: true
