  /api/v1/credits/{credit_id}/availability-series:
    get:
      operationId: "getAvailabilitySeries"
      tags:
        - "Créditos"
      summary: "Serie de disponible"
      description: "Serie de disponible."
      x-necesidades:
        - "N-203"
        - "N-209"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
