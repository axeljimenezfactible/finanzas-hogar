      summary: "Vista previa A/B"
      description: "Solo líneas revolventes; otras: 422 `not_revolving`."
      x-necesidades:
        - "N-285"
        - "N-201"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_statement"
        - "credit_term_rate"
