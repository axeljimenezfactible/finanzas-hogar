  /api/v1/credits/{credit_id}/term-rates:
    get:
      operationId: "listCreditTermRates"
      tags:
        - "Créditos"
      summary: "Tasas por plazo"
      description: "Orden: term_count. Conocidas: 2 quincenas 17.27 %, 4 quincenas 25.8685 % (decisión C); rate_pct las muestra como se capturaron, con rate_decimals (K12)."
      x-necesidades:
        - "N-204"
        - "N-286"
      x-tablas:
        - "credit_term_rate"
      parameters:
        - name: "credit_id"
          in: "path"
          required: true
