  /api/v1/credits/{credit_id}/card-status:
    get:
      operationId: "getCardStatus"
      tags:
        - "Créditos"
      summary: "Estado de la tarjeta"
      description: "Solo bank_card; otras: 422 `not_a_card`."
      x-necesidades:
        - "N-205"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_statement"
        - "credit_term_rate"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - name: "credit_id"
          in: "path"
          required: true
