  /api/v1/ticket-scans/{attachment_id}/draft:
    put:
      operationId: "saveTicketScanDraft"
      tags:
        - "Gastos"
      summary: "Guardar correcciones para después"
      description: "«Guardar para después» (K3): guarda como borrador las correcciones de encabezado y renglones de una lectura sin confirmar en attachment.ocr_draft_json y ocr_draft_saved_at, y reemplaza el borrador anterior. No crea gasto, precio ni inventario y no toca la lectura cruda. confirmTicketScan vacía el borrador. Una lectura ya confirmada responde 409 `conflict`."
      x-necesidades:
        - "N-075"
      x-tablas:
        - "attachment"
        - "audit_log"
      parameters:
        - name: "attachment_id"
          in: "path"
          required: true
          description: "Id del registro (attachment_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketScanDraft"
      responses:
