      tags:
        - "Gastos"
      summary: "Adjuntar ticket"
      description: "Imagen JPG, PNG o WebP, o PDF (U1 N-064). Tamaño máximo 10 MB (K43), el valor vigente de app_setting attachment.max_size_mb (K44; se cambia con updateDataSettings, N-325): un archivo mayor responde 413 `payload_too_large` y el mensaje dice el máximo vigente. El archivo se guarda con nombre generado por el servidor, nunca el del usuario."
