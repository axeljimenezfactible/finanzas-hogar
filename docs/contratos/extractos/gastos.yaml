          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "file"
              properties:
                file:
                  type: "string"
                  contentMediaType: "application/octet-stream"
                  description: "Adjunto de un gasto. Tipos admitidos: image/jpeg, image/png, image/webp, application/pdf."
                kind:
                  type: "string"
                  enum:
                    - "ticket_photo"
                    - "invoice"
                    - "bank_statement"
                    - "other"
                  description: "Tipo (attachment.kind)."
            encoding:
              file:
                contentType: "image/jpeg, image/png, image/webp, application/pdf"
      responses:
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
