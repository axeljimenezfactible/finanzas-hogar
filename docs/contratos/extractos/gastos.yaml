# Finanzas Hogar · Contrato C1 v1.5.0 · extracto «gastos». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto gastos"
  version: "1.5.0"
  description: "Extracto de la etiqueta «Gastos» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Gastos"
    description: "Gastos, adjuntos y captura de tickets con OCR."
paths:
  /api/v1/expenses:
    get:
      operationId: "listExpenses"
      tags:
        - "Gastos"
      summary: "Lista de gastos"
      description: "Periodo por defecto: mes en curso. Orden por defecto: -expense_date,-created_at; cualquier columna puede ordenar. `credit_id` filtra la forma de pago por línea. Páginas de 50."
      x-necesidades:
        - "N-040"
        - "N-063"
      x-tablas:
        - "attachment"
        - "category"
        - "cost_share_rule"
        - "cost_share_rule_part"
        - "credit_purchase"
        - "expense"
        - "expense_item"
        - "expense_share"
        - "person"
        - "store"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/PersonId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Family"
        - $ref: "componentes-comunes.yaml#/components/parameters/CategoryId"
        - $ref: "componentes-comunes.yaml#/components/parameters/StoreId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/CreditId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Q"
        - name: "kind"
          in: "query"
          required: false
          description: "Tipo: fixed, variable o upcoming."
          style: "form"
          explode: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "fixed"
                - "variable"
                - "upcoming"
        - name: "payment_method"
          in: "query"
          required: false
          description: "Forma de pago."
          style: "form"
          explode: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "cash"
                - "debit"
                - "transfer"
                - "credit"
        - name: "has_attachment"
          in: "query"
          required: false
          description: "Con ticket sí o no."
          schema:
            type: "boolean"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    post:
      operationId: "createExpense"
      tags:
        - "Gastos"
      summary: "Registrar gasto"
      description: "Devuelve el gasto con sus partes calculadas (expense_share; el resto y los centavos van a la persona del resto de la regla). Captura sin conexión (K9): la cola del teléfono manda cada gasto con su Idempotency-Key y su captured_at. La clave queda también en expense.idempotency_key, sin purga: un reintento con la misma clave responde 200 con el mismo gasto e Idempotent-Replayed: true, sin crear otro, aunque hayan pasado más de 24 h (pasadas las 24 h solo se compara la clave). Con la misma clave y otro cuerpo dentro de las 24 h, 409 `idempotency_key_reused`."
      x-necesidades:
        - "N-054"
      x-tablas:
        - "attachment"
        - "audit_log"
        - "category"
        - "cost_share_rule"
        - "cost_share_rule_part"
        - "credit_purchase"
        - "expense"
        - "expense_item"
        - "expense_share"
        - "idempotency_key"
        - "person"
        - "store"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "200":
          description: "Reintento de una captura ya registrada con la misma Idempotency-Key (K9): devuelve el mismo recurso, sin crear otro, con Idempotent-Replayed: true."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
