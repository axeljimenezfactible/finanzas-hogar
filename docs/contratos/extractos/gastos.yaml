              properties:
                file:
                  type: "string"
                  contentMediaType: "application/octet-stream"
                  description: "Foto del ticket. Tipos admitidos: image/jpeg, image/png, image/webp."
            encoding:
              file:
                contentType: "image/jpeg, image/png, image/webp"
      responses:
