        captured_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Instante en que la persona capturó el gasto en el teléfono. En una captura atrasada es anterior a created_at. NULL = captura en línea: la hora de captura es created_at"
        cost_share_rule_parts:
          type: "array"
          items:
            $ref: "#/components/schemas/CostShareRulePartInput"
          description: "Reparto propio del gasto («Conjunto con %»): crea una regla de un solo uso. Excluye cost_share_rule_id."
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ExpenseItemInput"
          description: "Renglones del ticket (expense_item). Σ line_total_cents = amount_cents."
