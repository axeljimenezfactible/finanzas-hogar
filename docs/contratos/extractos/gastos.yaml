          description: "Concepto o comercio. NULL = sin descripción: el registro en 3 toques no la pide (N-054) y la pantalla muestra la categoría · null borra el valor"
        category_id:
          type: "integer"
          description: "Categoría"
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Importe de lo comprado en centavos, con IVA y descuentos y sin intereses de financiamiento (despensa 1 = 309450)"
        expense_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de la compra o consumo. El devengo empieza en su mes"
        accrual_months:
          type: "integer"
          description: "Meses calendario en que se devenga desde el mes de expense_date (despensa bimestral = 2, mitad por mes)"
        payment_method:
          type: "string"
          enum:
            - "cash"
            - "debit"
            - "transfer"
            - "credit"
          description: "Medio de pago. credit = el efectivo sale según los pagos programados de su credit_purchase"
        paid_by_person_id:
          type:
            - "integer"
            - "null"
          description: "Quién pagó de su bolsillo (papel de contado de Karen). NULL = el titular · null borra el valor"
        person_id:
          type:
            - "integer"
            - "null"
          description: "Persona a quien se atribuye (comida fuera de Ximena). NULL = hogar en general · null borra el valor"
        cost_share_rule_id:
          type:
            - "integer"
            - "null"
          description: "Reparto del gasto. NULL = la regla de la categoría o la de por defecto · null borra el valor"
        store_id:
          type:
            - "integer"
            - "null"
          description: "Tienda donde se compró · null borra el valor"
        planned_item_id:
          type:
            - "integer"
            - "null"
          description: "Partida planificada que cumple (gasto fijo o venidero) · null borra el valor"
        notes:
          type:
            - "string"
            - "null"
          description: "notes · null borra el valor"
        cost_share_rule_parts:
          type: "array"
          items:
            $ref: "#/components/schemas/CostShareRulePartInput"
          description: "Reparto propio del gasto («Conjunto con %»): crea una regla de un solo uso. Excluye cost_share_rule_id."
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ExpenseItemInput"
          description: "Renglones del ticket (expense_item). Σ line_total_cents = amount_cents."
      minProperties: 1
    ExpenseMarkPaidRequest:
      type: "object"
      additionalProperties: false
      description: "Marca un gasto venidero como pagado (N-065): fecha real y monto real; kind pasa a variable o fixed según su partida."
      x-tabla: "expense"
      properties:
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Importe de lo comprado en centavos, con IVA y descuentos y sin intereses de financiamiento (despensa 1 = 309450)"
        expense_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de la compra o consumo. El devengo empieza en su mes"
      required:
        - "amount_cents"
        - "expense_date"
    ExpenseTotals:
      type: "object"
      description: "Totales sobre exactamente el conjunto filtrado (todas sus páginas) (N-041)."
      properties:
        expense_count:
          type: "integer"
          description: "Número de gastos."
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ amount_cents."
        household_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ parte del hogar."
        external_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ parte de Karen."
      required:
        - "expense_count"
        - "amount_cents"
        - "household_share_cents"
        - "external_share_cents"
      x-calculado: true
    ExpenseSummary:
      type: "object"
      description: "Resumen del periodo con los filtros (N-042). Promedios de K20: diario = total del periodo ÷ días reales del periodo; semanal = diario × 7."
      properties:
        period_start:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Inicio del periodo."
        period_end:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fin del periodo."
        household_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ parte del hogar en el periodo."
        previous_household_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ parte del hogar del periodo anterior equivalente."
        difference_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "household_share_cents − previous_household_share_cents."
        daily_average_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Promedio diario: total del periodo ÷ días reales del periodo, ROUND_HALF_UP (motor S2, K20)."
        weekly_average_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Promedio semanal = promedio diario exacto (sin redondear) × 7, con un solo redondeo ROUND_HALF_UP al final (motor S2, K20, K39; RN-27)."
        monthly_average_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Promedio mensual: total ÷ meses del periodo (motor S2; canon R-56 y R-57)."
        top_category_id:
          type: "integer"
          description: "Categoría con mayor gasto."
        top_category_household_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Su parte del hogar."
      required:
        - "period_start"
        - "period_end"
        - "household_share_cents"
        - "previous_household_share_cents"
        - "difference_cents"
      x-calculado: true
    ExpenseMonthlyTrend:
      type: "object"
      description: "Parte del hogar devengada por mes y categoría (N-044): 6 categorías con más gasto del rango y «Otras» (category_id ausente)."
      properties:
        months:
          type: "array"
          items:
            type: "object"
            description: "Mes."
            properties:
              month:
                $ref: "componentes-comunes.yaml#/components/schemas/Month"
                description: "Mes calendario."
              categories:
                type: "array"
                items:
                  type: "object"
                  description: "Categoría."
                  properties:
                    category_id:
                      type: "integer"
                      description: "Categoría; ausente = «Otras»."
                    household_share_cents:
                      $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                      description: "Parte del hogar devengada."
                  required:
                    - "household_share_cents"
                  x-calculado: true
                description: "Hasta 7 filas."
            required:
              - "month"
              - "categories"
            x-calculado: true
          description: "Del primer mes con datos al mes en curso, máximo 12."
      required:
        - "months"
      x-calculado: true
    Attachment:
      type: "object"
      description: "Adjunto (tabla `attachment`). Archivo adjunto: foto de ticket (con su OCR local), factura o estado de cuenta del banco. Ninguna cifra del OCR entra al sistema sin confirmación humana. Campos ausentes = sin valor (NULL)."
      x-tabla: "attachment"
      required:
        - "id"
        - "kind"
        - "mime_type"
        - "size_bytes"
        - "sha256"
        - "ocr_status"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        expense_id:
          type: "integer"
          description: "Gasto al que pertenece. NULL mientras el ticket espera confirmación"
        kind:
          type: "string"
          enum:
            - "ticket_photo"
            - "invoice"
            - "bank_statement"
            - "other"
          description: "Foto de ticket, factura, estado de cuenta del banco u otro"
        original_name:
          type: "string"
          description: "Nombre original del archivo"
        mime_type:
          type: "string"
          description: "Tipo MIME (image/jpeg, application/pdf)"
        size_bytes:
          type: "integer"
          description: "Tamaño en bytes"
        sha256:
          type: "string"
          description: "Huella del archivo (detecta duplicados y corrupción)"
        ocr_status:
          type: "string"
          enum:
            - "none"
            - "pending"
            - "done"
            - "confirmed"
            - "failed"
          description: "Estado del OCR local: none, pending, done (falta confirmar), confirmed, failed"
        ocr_engine:
          type: "string"
          description: "Motor y versión (tesseract 5.5.3 spa)"
        ocr_text:
          type: "string"
          description: "Texto crudo reconocido"
        uploaded_by_user_id:
          type: "integer"
          description: "Cuenta que lo subió"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        ocr_draft_saved_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo se guardó el borrador por última vez"
    TicketScan:
      allOf:
        - $ref: "#/components/schemas/Attachment"
        - type: "object"
          description: "Lectura de ticket (N-071, N-076). Si la persona guardó correcciones con «Guardar para después», las trae en draft (K3)."
          properties:
            has_draft:
              type: "boolean"
              description: "true si hay borrador de correcciones (attachment.ocr_draft_json)."
            draft:
              $ref: "#/components/schemas/TicketScanDraft"
              description: "Borrador de correcciones guardado (K3); ausente si no hay."
            display_store_id:
              type: "integer"
              description: "Tienda que muestra la lista de tickets por confirmar: la del borrador si existe; si no, la propuesta (N-076)."
            display_total_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Total que muestra la lista de tickets por confirmar: el del borrador si existe; si no, el propuesto (N-076)."
            proposed_store_id:
              type: "integer"
              description: "Tienda propuesta."
            proposed_expense_date:
              $ref: "componentes-comunes.yaml#/components/schemas/Date"
              description: "Fecha propuesta."
            proposed_total_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Total propuesto."
            lines:
              type: "array"
              items:
                type: "object"
                description: "Renglón propuesto por el OCR (nada se guarda sin confirmación humana, decisión E)."
                properties:
                  line_no:
                    type: "integer"
                    description: "Orden en el ticket."
                  text:
                    type: "string"
                    description: "Texto leído."
                  product_id:
                    type: "integer"
                    description: "Producto sugerido."
                  presentation_id:
                    type: "integer"
                    description: "Presentación sugerida."
                  quantity_milli:
                    $ref: "#/components/schemas/Milli"
                    description: "Cantidad."
                  unit_price_cents:
                    $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                    description: "Precio unitario."
                  line_total_cents:
                    $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                    description: "Importe."
                  cost_share_rule_id:
                    type: "integer"
                    description: "Cuenta sugerida (regla de reparto)."
                  confidence:
                    type: "string"
                    enum:
                      - "high"
                      - "medium"
                      - "low"
                    description: "Confianza del renglón."
                required:
                  - "line_no"
                  - "text"
                  - "confidence"
                x-calculado: true
              description: "Renglones propuestos en el orden del ticket."
          required:
            - "has_draft"
            - "lines"
          x-calculado: true
      description: "Adjunto de ticket con su propuesta de OCR (ocr_status pending, done o failed)."
    TicketScanDraft:
      type: "object"
      description: "Borrador de correcciones de una lectura de ticket (K3): encabezado y renglones como la persona los dejó con «Guardar para después». Se guarda en attachment.ocr_draft_json (objeto JSON) con su hora en ocr_draft_saved_at; guardar otro reemplaza el anterior y confirmar el ticket lo vacía. La lectura cruda (ocr_text) no cambia."
      properties:
        store_id:
          type: "integer"
          description: "Tienda."
        expense_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha del gasto."
        total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Total del ticket."
        category_id:
          type: "integer"
          description: "Categoría del gasto."
        payment_method:
          type: "string"
          enum:
            - "cash"
            - "debit"
            - "transfer"
            - "credit"
          description: "Medio de pago. credit = el efectivo sale según los pagos programados de su credit_purchase"
        cost_share_rule_id:
          type: "integer"
          description: "Reparto del gasto (regla)."
        lines:
          type: "array"
          items:
            type: "object"
            description: "Renglón del borrador tal como lo dejó la persona (K3). Nada crea gasto, precio ni inventario hasta confirmar; un renglón que la persona quitó no aparece."
            properties:
              line_no:
                type: "integer"
                description: "Orden en el ticket."
              text:
                type: "string"
                description: "Texto leído o corregido."
              product_id:
                type: "integer"
                description: "Producto."
              presentation_id:
                type: "integer"
                description: "Presentación."
              quantity_milli:
                $ref: "#/components/schemas/Milli"
                description: "Cantidad."
              unit_price_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Precio unitario."
              line_total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Importe."
              cost_share_rule_id:
                type: "integer"
                description: "Cuenta (regla de reparto)."
            required:
              - "line_no"
            additionalProperties: false
          description: "Renglones en el orden del ticket (puede ir vacía)."
      required:
        - "lines"
      additionalProperties: false
    TicketConfirmRequest:
      type: "object"
      description: "Confirmación humana de un ticket (N-074): crea el gasto con renglones, los precios (fuente ticket_ocr) y las entradas de inventario; si la forma de pago es crédito, crea la compra (N-218)."
      properties:
        expense:
          $ref: "#/components/schemas/ExpenseCreate"
          description: "Gasto con sus renglones (items). Con payment_method = credit se exige credit_purchase."
        credit_purchase:
          $ref: "#/components/schemas/CreditPurchaseCreate"
          description: "Datos de la compra a crédito (sin expense)."
      required:
        - "expense"
    TicketConfirmResult:
      type: "object"
      description: "Registros creados al confirmar."
      properties:
        expense_id:
          type: "integer"
          description: "Gasto creado."
        price_ids:
          type: "array"
          items:
            type: "integer"
          description: "Precios creados."
        inventory_item_ids:
          type: "array"
          items:
            type: "integer"
          description: "Renglones de inventario creados o actualizados."
        credit_purchase_id:
          type: "integer"
          description: "Compra a crédito creada."
      required:
        - "expense_id"
        - "price_ids"
        - "inventory_item_ids"
      x-calculado: true
    CreditPurchaseShareInput:
      type: "object"
      description: "Capital por persona (credit_purchase_share.principal_cents)."
      properties:
        person_id:
          type: "integer"
          description: "Persona (titular u externa)."
        principal_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Capital que compró esa persona."
      required:
        - "person_id"
        - "principal_cents"
      additionalProperties: false
    CreditPurchaseCreate:
      type: "object"
      additionalProperties: false
      description: "Alta de una compra a crédito (N-218). interest_cents de la cotización (interest_source quoted) o, sin cotización, del plazo con la tasa de la tabla (term_table); el motor S3 genera las partes y los pagos programados con el último ajustando centavos. Canon despensa 1: principal 309450, interest 80050, total 389500, 4 pagos de 97375."
      x-tabla: "credit_purchase"
      properties:
        credit_id:
          type: "integer"
          description: "Crédito usado"
        kind:
          type: "string"
          enum:
            - "installment_plan"
            - "single_charge"
            - "loan_disbursement"
          description: "installment_plan = pagos fijos (Kueski, meses sin intereses, abonos de tienda), single_charge = cargo normal de tarjeta, loan_disbursement = préstamo con tabla de amortización"
        description:
          type: "string"
          description: "Descripción corta"
        purchase_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de la compra (2026-10-10)"
        principal_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Capital: lo que usa la línea (309450)"
        interest_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Intereses de todo el plazo, IVA incluido, tal como los cotizó el acreedor (80050). Nunca reponen la línea"
        term_count:
          type: "integer"
          description: "Número de pagos (4)"
        payment_frequency:
          type: "string"
          enum:
            - "weekly"
            - "fortnightly"
            - "monthly"
          description: "Frecuencia de los pagos (quincenal)"
        first_payment_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Primer pago (2026-10-30)"
        interest_source:
          type: "string"
          enum:
            - "quoted"
            - "term_table"
            - "promotion"
            - "amortization"
          description: "Origen de los intereses: quoted = cotización del acreedor al pagar, term_table = tabla por plazo, promotion = promoción, amortization = tabla de amortización"
        rate_num:
          type: "integer"
          description: "Numerador de la tasa de esta compra (cotización: intereses/capital = 80050/309450)"
        rate_den:
          type: "integer"
          description: "Denominador de la tasa"
        rate_basis:
          type: "string"
          enum:
            - "term_total"
            - "annual"
          description: "term_total = sobre el capital por todo el plazo (Kueski), annual = tasa anual (préstamo)"
        interest_includes_vat:
          type: "boolean"
          description: "1 = los intereses ya traen IVA (Kueski)"
        promotion_id:
          type: "integer"
          description: "Promoción aplicada"
        notes:
          type: "string"
          description: "notes"
        rate_decimals:
          type: "integer"
          description: "Decimales con que se muestra la tasa de esta compra, los mismos con que se capturó o cotizó. NULL = sin tasa o sin dato"
        expense_id:
          type: "integer"
          description: "Gasto existente que origina la compra (credit_purchase.expense_id)."
        expense:
          $ref: "#/components/schemas/ExpenseCreate"
          description: "Gasto vinculado que se crea si no existe (payment_method = credit lo pone la API)."
        shares:
          type: "array"
          items:
            $ref: "#/components/schemas/CreditPurchaseShareInput"
          description: "Capital por persona (desde los renglones del ticket o capturado). Sin partes: todo al titular."
      required:
        - "credit_id"
        - "kind"
        - "purchase_date"
        - "principal_cents"
        - "term_count"
    ExpensePage:
      allOf:
        - $ref: "componentes-comunes.yaml#/components/schemas/Page"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/Expense"
      description: "Página de Expense con la envoltura única (Page)."
    ExpenseItemPage:
      allOf:
        - $ref: "componentes-comunes.yaml#/components/schemas/Page"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/ExpenseItem"
      description: "Página de ExpenseItem con la envoltura única (Page)."
    TicketScanPage:
      allOf:
        - $ref: "componentes-comunes.yaml#/components/schemas/Page"
        - type: "object"
          properties:
            items:
              type: "array"
              items:
                $ref: "#/components/schemas/TicketScan"
      description: "Página de TicketScan con la envoltura única (Page)."
