          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketScan"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/ticket-scans/{attachment_id}/confirm:
    post:
      operationId: "confirmTicketScan"
      tags:
        - "Gastos"
      summary: "Confirmar ticket"
      description: "Una sola transacción: gasto con renglones y cuenta por renglón, precios (fuente ticket_ocr, fecha del ticket, tienda), entradas de inventario de productos con stock (cada una con su inventory_movement de tipo purchase ligado al renglón del ticket) y, si aplica, la compra a crédito."
