          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    BasisPoints:
      type: "integer"
      minimum: 0
      maximum: 10000
      description: "Porcentaje en puntos base: 10000 = 100 %, 5000 = 50 %."
      examples:
        - 5000
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    CostShareRulePartInput:
      type: "object"
      description: "Parte de una regla de reparto (entrada)."
      properties:
        person_id:
          type: "integer"
          description: "Persona (cost_share_rule_part.person_id)."
        pct_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "Porcentaje (cost_share_rule_part.pct_bp)."
        fixed_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto fijo (cost_share_rule_part.fixed_cents)."
      required:
        - "person_id"
      additionalProperties: false
    ShareLine:
      type: "object"
      description: "Parte de dinero de una persona."
      properties:
        person_id:
          type: "integer"
          description: "Persona (expense_share.person_id): el titular representa al hogar."
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto de la parte (expense_share.amount_cents)."
      required:
        - "person_id"
        - "amount_cents"
      x-calculado: true
    Expense:
      type: "object"
      description: "Gasto (tabla `expense`). Gasto real: fijo, variable o venidero. Guarda la fecha que inicia el devengo, los meses de devengo, el medio de pago (si es crédito el efectivo sale por los pagos programados), quién pagó, a quién se atribuye y su reparto. Campos ausentes = sin valor (NULL)."
      x-tabla: "expense"
      required:
        - "id"
        - "kind"
        - "category_id"
        - "amount_cents"
        - "expense_date"
        - "accrual_months"
        - "payment_method"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        kind:
          type: "string"
          enum:
            - "fixed"
            - "variable"
            - "upcoming"
          description: "fixed = gasto fijo, variable = gasto del día a día, upcoming = gasto venidero que ya ocurrió o quedó comprometido"
        description:
          type: "string"
          description: "Concepto o comercio. NULL = sin descripción: el registro en 3 toques no la pide (N-054) y la pantalla muestra la categoría"
        category_id:
          type: "integer"
          description: "Categoría"
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Importe de lo comprado en centavos, con IVA y descuentos y sin intereses de financiamiento (despensa 1 = 309450)"
        expense_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de la compra o consumo. El devengo empieza en su mes"
        accrual_months:
          type: "integer"
          description: "Meses calendario en que se devenga desde el mes de expense_date (despensa bimestral = 2, mitad por mes)"
        payment_method:
          type: "string"
          enum:
            - "cash"
            - "debit"
            - "transfer"
            - "credit"
          description: "Medio de pago. credit = el efectivo sale según los pagos programados de su credit_purchase"
        paid_by_person_id:
          type: "integer"
          description: "Quién pagó de su bolsillo (papel de contado de Karen). NULL = el titular"
        person_id:
          type: "integer"
          description: "Persona a quien se atribuye (comida fuera de Ximena). NULL = hogar en general"
        cost_share_rule_id:
          type: "integer"
          description: "Reparto del gasto. NULL = la regla de la categoría o la de por defecto"
        store_id:
          type: "integer"
          description: "Tienda donde se compró"
        planned_item_id:
          type: "integer"
          description: "Partida planificada que cumple (gasto fijo o venidero)"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        captured_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Instante en que la persona capturó el gasto en el teléfono. En una captura atrasada es anterior a created_at. NULL = captura en línea: la hora de captura es created_at"
        shares:
          type: "array"
          items:
            $ref: "#/components/schemas/ShareLine"
          description: "Partes congeladas del gasto (expense_share). Σ partes = amount_cents."
          x-calculado: true
        household_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte del hogar = parte a nombre del titular."
          x-calculado: true
        external_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte de personas externas (Karen) = amount_cents − parte del hogar."
          x-calculado: true
        has_attachment:
          type: "boolean"
          description: "true si tiene al menos un adjunto (attachment)."
          x-calculado: true
        credit_purchase_id:
          type: "integer"
          description: "Compra a crédito vinculada (credit_purchase.expense_id), solo con payment_method = credit."
          x-calculado: true
        accruals:
          type: "array"
          items:
            type: "object"
            description: "Devengo por mes (motor S2)."
            properties:
              month:
                $ref: "componentes-comunes.yaml#/components/schemas/Month"
                description: "Mes devengado."
              amount_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Monto devengado en ese mes; el último mes ajusta centavos."
            required:
              - "month"
              - "amount_cents"
            x-calculado: true
          description: "Devengo: mes o meses a los que se asigna el gasto (accrual_months)."
          x-calculado: true
        cash_flows:
          type: "array"
          items:
            type: "object"
            description: "Salida de efectivo."
            properties:
              date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Fecha en que sale el dinero."
              amount_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Monto."
            required:
              - "date"
              - "amount_cents"
            x-calculado: true
          description: "Efectivo: la fecha del gasto si es de contado o los pagos programados si es a crédito."
          x-calculado: true
        created_by_user_account_id:
          type: "integer"
          description: "Cuenta que lo creó (audit_log)."
          x-calculado: true
        updated_by_user_account_id:
          type: "integer"
          description: "Cuenta que lo cambió por última vez (audit_log)."
          x-calculado: true
    ExpenseItemInput:
      type: "object"
      additionalProperties: false
      description: "Alta de renglón de gasto (tabla `expense_item`)."
      x-tabla: "expense_item"
      properties:
        line_no:
          type: "integer"
          description: "Orden del renglón en el ticket"
        description:
          type: "string"
          description: "Texto del renglón como viene en el ticket"
        presentation_id:
          type: "integer"
          description: "Presentación del catálogo. NULL mientras no se liga"
        quantity_milli:
          $ref: "#/components/schemas/Milli"
          description: "Cantidad de presentaciones ×1000: 3 piezas = 3000, 1.250 kg a granel = 1250"
        unit_price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio por presentación en centavos"
        line_total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Importe del renglón con descuentos e IVA. La suma de renglones es el importe del gasto"
        cost_share_rule_id:
          type: "integer"
          description: "Reparto del renglón (Hogar, Karen, Conjunto 50/50 o una regla de un solo uso para «mixto»). NULL = el del gasto"
        cost_share_rule_parts:
          type: "array"
          items:
            $ref: "#/components/schemas/CostShareRulePartInput"
          description: "Reparto «mixto» del renglón: crea una regla de un solo uso (cost_share_rule.is_template = 0)."
      required:
        - "line_no"
        - "description"
        - "quantity_milli"
        - "line_total_cents"
    ExpenseItem:
      type: "object"
      description: "Renglón de gasto (tabla `expense_item`). Renglón de un gasto con ticket (la despensa): presentación, cantidad, importe y reparto del renglón (cuenta axel, karen, conjunto o mixto de data.json). Campos ausentes = sin valor (NULL)."
      x-tabla: "expense_item"
      required:
        - "id"
        - "expense_id"
        - "line_no"
        - "description"
        - "quantity_milli"
        - "line_total_cents"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        expense_id:
          type: "integer"
          description: "Gasto al que pertenece"
        line_no:
          type: "integer"
          description: "Orden del renglón en el ticket"
        description:
          type: "string"
          description: "Texto del renglón como viene en el ticket"
        presentation_id:
          type: "integer"
          description: "Presentación del catálogo. NULL mientras no se liga"
        quantity_milli:
          $ref: "#/components/schemas/Milli"
          description: "Cantidad de presentaciones ×1000: 3 piezas = 3000, 1.250 kg a granel = 1250"
        unit_price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio por presentación en centavos"
        line_total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Importe del renglón con descuentos e IVA. La suma de renglones es el importe del gasto"
        cost_share_rule_id:
          type: "integer"
          description: "Reparto del renglón (Hogar, Karen, Conjunto 50/50 o una regla de un solo uso para «mixto»). NULL = el del gasto"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        household_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte del hogar del renglón."
          x-calculado: true
        external_share_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Parte de Karen del renglón."
          x-calculado: true
    ExpenseCreate:
      type: "object"
      additionalProperties: false
      description: "Alta de un gasto (N-054). payment_method = credit no se acepta aquí: la compra a crédito crea su gasto (POST /api/v1/credit-purchases). kind por defecto: variable, o upcoming si la fecha es posterior a hoy. description es opcional: si falta, el gasto queda sin descripción (NULL) y la pantalla muestra la categoría; la API no inventa un texto de relleno (S1 C-16). captured_at (opcional) es el instante en que se capturó en el teléfono: una captura atrasada de la cola sin conexión lo manda junto con su Idempotency-Key (K9); sin valor, la hora de captura es la del alta."
      x-tabla: "expense"
      properties:
        kind:
          type: "string"
          enum:
            - "fixed"
            - "variable"
            - "upcoming"
          description: "fixed = gasto fijo, variable = gasto del día a día, upcoming = gasto venidero que ya ocurrió o quedó comprometido"
        description:
          type: "string"
