          description: "Inicio de vigencia, inclusive"
        valid_to:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fin de vigencia, inclusive (Chedraui: solo 2026-10-30)"
        source_note:
          type: "string"
          description: "De dónde se tomó (tablero oficial de promociones Kueski 2026)"
        is_active:
          type: "boolean"
          description: "is_active"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        rate_decimals:
          type: "integer"
          description: "Decimales con que se capturó la tasa promocional (0 % → 0). NULL = sin dato"
        is_current:
          type: "boolean"
          description: "Vigente hoy."
          x-calculado: true
        rate_pct:
          type: "string"
          description: "Tasa promocional como se capturó (K12): rate_num/rate_den redondeada ROUND_HALF_UP a rate_decimals decimales; con tasa 0 la pantalla muestra «sin intereses» (N-287)."
          x-calculado: true
    OptimizerWeights:
      type: "object"
      description: "Pesos de los 4 objetivos (app_setting optimizer.weights; iguales y normalizados, decisión C)."
      properties:
        lowest_interest:
          type: "integer"
          description: "Menores intereses."
        even_low_payment:
          type: "integer"
          description: "Pago por quincena parejo y bajo tope."
        max_available:
          type: "integer"
          description: "Máximo disponible."
        most_value_per_peso:
          type: "integer"
          description: "Comprar más por peso."
      required:
        - "lowest_interest"
        - "even_low_payment"
        - "max_available"
        - "most_value_per_peso"
      x-app-setting: "optimizer.weights"
    ScenarioRequest:
      type: "object"
      description: "Compra planeada y restricciones (N-226). Las restricciones que se manden sobreescriben, solo para esta comparación, las globales de /settings/optimizer (K16); las que no se manden toman la global. Si alguna queda sin valor, el resultado avisa «faltan restricciones» y no recomienda."
      properties:
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          minimum: 1
          description: "Monto de la compra (planned_item.amount_cents)."
          x-columna: "planned_item.amount_cents"
        desired_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha deseada (planned_item.start_date)."
          x-columna: "planned_item.start_date"
        store_id:
          type: "integer"
          description: "Tienda o comercio (promotion.store_id)."
        merchant_name:
          type: "string"
          description: "Comercio (promotion.merchant_name)."
        shares:
          type: "array"
          items:
            $ref: "#/components/schemas/CreditPurchaseShareInput"
          description: "Quién compra: capital por persona."
        min_available_buffer_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Colchón mínimo de disponible, medido en la línea que se usa (optimizer.min_available_buffer_cents, K16). Lo captura Axel; no hay valor por defecto. Ausente = sin capturar: el comparador avisa «faltan restricciones» y no recomienda (K16)."
          x-app-setting: "optimizer.min_available_buffer_cents"
        max_live_purchases:
          type: "integer"
          description: "Máximo de compras vivas a la vez en el crédito que se usa (optimizer.max_live_purchases, K16). Lo captura Axel; no hay valor por defecto. Ausente = sin capturar: el comparador avisa «faltan restricciones» y no recomienda (K16)."
          x-app-setting: "optimizer.max_live_purchases"
        zero_debt_by_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Deuda en cero, en el crédito que se usa, antes de esta fecha (optimizer.zero_debt_by_date, K16). Lo captura Axel; no hay valor por defecto. Ausente = sin capturar: el comparador avisa «faltan restricciones» y no recomienda (K16)."
          x-app-setting: "optimizer.zero_debt_by_date"
        date_window_days:
          type: "integer"
          description: "«Fecha ± días» de los escenarios (optimizer.date_window_days). En la petición sobreescribe solo para esta comparación el valor vigente, que se lee y cambia en parameters de getOptimizerSettings y updateOptimizerSettings (valor inicial 7, Q2-75, K50, K44)."
          x-app-setting: "optimizer.date_window_days"
        weights:
          $ref: "#/components/schemas/OptimizerWeights"
          description: "Pesos."
      required:
        - "amount_cents"
        - "desired_date"
      additionalProperties: false
    Scenario:
      type: "object"
      description: "Escenario evaluado (motor S3, búsqueda exhaustiva)."
      properties:
        credit_id:
          type: "integer"
          description: "Línea."
        term_count:
          type: "integer"
          description: "Plazo en pagos."
        purchase_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de compra."
        store_id:
          type: "integer"
          description: "Tienda del escenario (motor S3, Q2-33 (b)): la tienda es dimensión del escenario solo si la petición no fija store_id; si lo fija, es esa. Ausente cuando S3 la entrega en null (escenario sin tienda)."
        promotion_id:
          type: "integer"
          description: "Promoción aplicada."
        interest_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Intereses totales."
        max_fortnight_payment_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Pago máximo por quincena."
        fortnight_payment_spread_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Diferencia entre la quincena más alta y la más baja."
        min_available_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Disponible mínimo resultante."
        max_live_purchases:
          type: "integer"
          description: "Compras vivas máximas."
        zero_debt_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha en que la deuda queda en cero."
        value_per_peso_milli:
          type: "integer"
          description: "Rendimiento por peso ×1000: unidades base de la canasta por peso gastado con los precios vigentes de cada tienda (K17)."
        score_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "Puntaje ponderado con normalización mín-máx entre los escenarios generados (K17)."
      required:
        - "credit_id"
        - "term_count"
        - "purchase_date"
        - "interest_cents"
        - "max_fortnight_payment_cents"
        - "fortnight_payment_spread_cents"
        - "min_available_cents"
        - "max_live_purchases"
        - "zero_debt_date"
      x-calculado: true
    ScenarioResult:
      type: "object"
      description: "Resultado del comparador (N-226): los 4 óptimos lado a lado y la recomendación ponderada (pesos iguales normalizados por defecto). Si faltan restricciones (K16) no evalúa ni recomienda: status = missing_constraints, listas vacías y missing_constraints dice cuáles faltan."
      properties:
        status:
          type: "string"
          enum:
            - "ok"
            - "missing_constraints"
            - "no_valid_scenario"
          description: "ok = hay recomendación; missing_constraints = faltan restricciones (K16); no_valid_scenario = ningún escenario respeta las restricciones."
        missing_constraints:
          type: "array"
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "min_available_buffer_cents"
              - "max_live_purchases"
              - "zero_debt_by_date"
              - "date_window_days"
          description: "Valores sin capturar (K16). Vacío = completos; con alguno, la pantalla muestra «faltan restricciones» y el comparador no recomienda."
          x-calculado: true
        constraints_used:
          type: "object"
          description: "Restricciones con que se evaluó: las de la petición o, si no vinieron, las globales (K16)."
          properties:
            min_available_buffer_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Colchón mínimo de disponible, medido en la línea que se usa (optimizer.min_available_buffer_cents, K16). Lo captura Axel; no hay valor por defecto. Ausente = sin capturar: el comparador avisa «faltan restricciones» y no recomienda (K16)."
              x-app-setting: "optimizer.min_available_buffer_cents"
            max_live_purchases:
              type: "integer"
              description: "Máximo de compras vivas a la vez en el crédito que se usa (optimizer.max_live_purchases, K16). Lo captura Axel; no hay valor por defecto. Ausente = sin capturar: el comparador avisa «faltan restricciones» y no recomienda (K16)."
              x-app-setting: "optimizer.max_live_purchases"
            zero_debt_by_date:
              $ref: "componentes-comunes.yaml#/components/schemas/Date"
              description: "Deuda en cero, en el crédito que se usa, antes de esta fecha (optimizer.zero_debt_by_date, K16). Lo captura Axel; no hay valor por defecto. Ausente = sin capturar: el comparador avisa «faltan restricciones» y no recomienda (K16)."
              x-app-setting: "optimizer.zero_debt_by_date"
            date_window_days:
              type: "integer"
              description: "«Fecha ± días» de los escenarios (optimizer.date_window_days). En la petición sobreescribe solo para esta comparación el valor vigente, que se lee y cambia en parameters de getOptimizerSettings y updateOptimizerSettings (valor inicial 7, Q2-75, K50, K44)."
              x-app-setting: "optimizer.date_window_days"
        evaluated_count:
          type: "integer"
          description: "Escenarios evaluados."
        valid:
          type: "array"
          items:
            $ref: "#/components/schemas/Scenario"
          description: "Escenarios que respetan las 3 restricciones duras."
        optima:
          type: "object"
          description: "Óptimo por objetivo."
          properties:
            lowest_interest:
              $ref: "#/components/schemas/Scenario"
              description: "Menores intereses."
            even_low_payment:
              $ref: "#/components/schemas/Scenario"
              description: "Pago por quincena parejo y bajo tope."
            max_available:
              $ref: "#/components/schemas/Scenario"
              description: "Máximo disponible."
            most_value_per_peso:
              $ref: "#/components/schemas/Scenario"
              description: "Comprar más por peso."
          x-calculado: true
        recommendation:
          $ref: "#/components/schemas/Scenario"
          description: "Recomendación por puntaje ponderado; ausente si status no es ok."
        rejected:
          type: "array"
          items:
            type: "object"
            description: "Descartado."
            properties:
              scenario:
                $ref: "#/components/schemas/Scenario"
                description: "Escenario."
              violated_constraint:
                type: "string"
                enum:
                  - "min_available_buffer"
                  - "max_live_purchases"
                  - "zero_debt_by_date"
                description: "Restricción que viola."
            required:
              - "scenario"
              - "violated_constraint"
            x-calculado: true
          description: "Descartados."
      required:
        - "status"
        - "missing_constraints"
        - "evaluated_count"
        - "valid"
        - "optima"
        - "rejected"
      x-calculado: true
