# Finanzas Hogar · Contrato C1 v1.5.0 · extracto «creditos-b». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto creditos-b"
  version: "1.5.0"
  description: "Extracto de la etiqueta «Créditos» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Créditos"
    description: "Líneas, compras a crédito, pagos, promociones y comparador de escenarios."
paths:
  /api/v1/credit-purchases:
    get:
      operationId: "listCreditPurchases"
      tags:
        - "Créditos"
      summary: "Compras a crédito"
      description: "Orden por defecto: -purchase_date."
      x-necesidades:
        - "N-202"
        - "N-215"
      x-tablas:
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "expense"
        - "promotion"
        - "scheduled_payment"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/CreditId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Family"
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/PersonId"
        - name: "status"
          in: "query"
          required: false
          description: "active (vivas, por defecto), paid_off o cancelled."
          schema:
            type: "string"
            enum:
              - "active"
              - "paid_off"
              - "cancelled"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchasePage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    post:
      operationId: "createCreditPurchase"
      tags:
        - "Créditos"
      summary: "Crear compra a crédito"
      description: "Crear compra a crédito."
      x-necesidades:
        - "N-218"
      x-tablas:
        - "audit_log"
        - "credit"
        - "credit_purchase"
        - "credit_purchase_share"
        - "credit_term_rate"
        - "expense"
        - "expense_share"
        - "idempotency_key"
        - "person"
        - "promotion"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseCreate"
      responses:
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/credit-purchases/preview:
    post:
      operationId: "previewCreditPurchase"
      tags:
        - "Créditos"
      summary: "Vista previa del cálculo"
      description: "No guarda nada (no necesita Idempotency-Key)."
      x-necesidades:
        - "N-216"
        - "N-217"
      x-tablas:
        - "credit"
        - "credit_term_rate"
        - "person"
        - "promotion"
        - "scheduled_payment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseCreate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchasePreview"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/credit-purchases/{credit_purchase_id}:
    get:
      operationId: "getCreditPurchase"
      tags:
        - "Créditos"
      summary: "Compra a crédito"
      description: "Compra a crédito."
      x-necesidades:
        - "N-215"
      x-tablas:
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "expense"
        - "promotion"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - name: "credit_purchase_id"
          in: "path"
          required: true
          description: "Id del registro (credit_purchase_id)."
          schema:
            type: "integer"
            minimum: 1
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    patch:
      operationId: "updateCreditPurchase"
      tags:
        - "Créditos"
      summary: "Editar compra"
      description: "Editar compra."
      x-necesidades:
        - "N-219"
      x-tablas:
        - "audit_log"
        - "credit_purchase"
      parameters:
        - name: "credit_purchase_id"
          in: "path"
          required: true
          description: "Id del registro (credit_purchase_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    delete:
      operationId: "deleteCreditPurchase"
      tags:
        - "Créditos"
      summary: "Eliminar compra"
      description: "Quita sus pagos programados. Con pagos hechos responde 409 `has_payments`."
      x-necesidades:
        - "N-219"
      x-tablas:
        - "audit_log"
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "expense"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - name: "credit_purchase_id"
          in: "path"
          required: true
          description: "Id del registro (credit_purchase_id)."
          schema:
            type: "integer"
            minimum: 1
      responses:
        "204":
          description: "Hecho, sin contenido."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/scheduled-payments:
    get:
      operationId: "listScheduledPayments"
      tags:
        - "Créditos"
      summary: "Pagos programados"
      description: "Orden por defecto: due_date. Por defecto: con alguna parte pendiente, de hoy en adelante."
      x-necesidades:
        - "N-192"
        - "N-206"
        - "N-207"
        - "N-215"
        - "N-260"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "person"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/CreditId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Family"
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/PersonId"
        - name: "credit_purchase_id"
          in: "query"
          required: false
          description: "Pagos de una compra (amortización N-206, abonos N-207)."
          schema:
            type: "integer"
        - name: "status"
          in: "query"
          required: false
          description: "pending (alguna parte sin pagar), paid u overdue."
          schema:
            type: "string"
            enum:
              - "pending"
              - "paid"
              - "overdue"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPaymentPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/scheduled-payments/{scheduled_payment_id}/payments:
    post:
      operationId: "markScheduledPaymentPaid"
      tags:
        - "Créditos"
      summary: "Marcar parte como pagada"
      description: "Cada parte (hogar o Karen) se marca por separado; fecha real (hoy por defecto) y monto (el programado por defecto). La reposición de capital la calcula S3."
      x-necesidades:
        - "N-210"
      x-tablas:
        - "audit_log"
        - "credit"
        - "credit_payment"
        - "idempotency_key"
        - "person"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - name: "scheduled_payment_id"
          in: "path"
          required: true
          description: "Id del registro (scheduled_payment_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPaymentCreate"
      responses:
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPayment"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/credit-payments/{credit_payment_id}:
    delete:
      operationId: "deleteCreditPayment"
      tags:
        - "Créditos"
      summary: "Desmarcar pago"
      description: "Desmarcar pago."
      x-necesidades:
        - "N-210"
      x-tablas:
        - "audit_log"
        - "credit_payment"
      parameters:
        - name: "credit_payment_id"
          in: "path"
          required: true
          description: "Id del registro (credit_payment_id)."
          schema:
            type: "integer"
            minimum: 1
      responses:
        "204":
          description: "Hecho, sin contenido."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/promotions:
    get:
      operationId: "listPromotions"
      tags:
        - "Créditos"
      summary: "Promociones"
      description: "Por defecto: vigentes y futuras. Orden: valid_from."
      x-necesidades:
        - "N-217"
        - "N-287"
      x-tablas:
        - "credit"
        - "promotion"
        - "store"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/CreditId"
        - $ref: "componentes-comunes.yaml#/components/parameters/StoreId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - name: "merchant_name"
          in: "query"
          required: false
          description: "Comercio."
          schema:
            type: "string"
        - name: "valid_on"
          in: "query"
          required: false
          description: "Vigentes en esta fecha (N-217: fecha de compra)."
          schema:
            $ref: "componentes-comunes.yaml#/components/schemas/Date"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/scenario-comparisons:
    post:
      operationId: "compareScenarios"
      tags:
        - "Créditos"
      summary: "Comparador de escenarios"
      description: "Búsqueda exhaustiva sin solver (crédito × plazo × fecha ± días × promoción). Respeta las 3 restricciones duras: las que trae la petición sobreescriben solo para esta comparación las globales (K16). Si después de eso falta alguna (o el «± días»), responde 200 con status missing_constraints, sin escenarios ni recomendación, y la pantalla avisa «faltan restricciones». El tope por persona es objetivo, no restricción (K13). No guarda nada: «Usar escenario» abre la captura de compra (createCreditPurchase). Tiempo máximo 5 s (K43), el valor vigente de app_setting comparator.timeout_seconds (K44; se cambia con updateOptimizerSettings, N-321): si la búsqueda lo pasa, responde 503 `unavailable` sin escenarios. S3 lo mide (S3-12)."
      x-necesidades:
        - "N-226"
      x-tablas:
        - "app_setting"
        - "credit"
        - "credit_purchase"
        - "credit_term_rate"
        - "person"
        - "price"
        - "promotion"
        - "scheduled_payment"
        - "scheduled_payment_share"
        - "store"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResult"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        "503":
          $ref: "componentes-comunes.yaml#/components/responses/ServiceUnavailable"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    BasisPoints:
      type: "integer"
      minimum: 0
      maximum: 10000
      description: "Porcentaje en puntos base: 10000 = 100 %, 5000 = 50 %."
      examples:
        - 5000
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    CostShareRulePartInput:
      type: "object"
      description: "Parte de una regla de reparto (entrada)."
      properties:
        person_id:
          type: "integer"
          description: "Persona (cost_share_rule_part.person_id)."
        pct_bp:
          $ref: "#/components/schemas/BasisPoints"
          description: "Porcentaje (cost_share_rule_part.pct_bp)."
        fixed_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto fijo (cost_share_rule_part.fixed_cents)."
      required:
        - "person_id"
      additionalProperties: false
    ShareLine:
      type: "object"
      description: "Parte de dinero de una persona."
      properties:
        person_id:
          type: "integer"
          description: "Persona (expense_share.person_id): el titular representa al hogar."
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto de la parte (expense_share.amount_cents)."
      required:
        - "person_id"
        - "amount_cents"
      x-calculado: true
    ExpenseItemInput:
      type: "object"
      additionalProperties: false
      description: "Alta de renglón de gasto (tabla `expense_item`)."
      x-tabla: "expense_item"
      properties:
        line_no:
          type: "integer"
          description: "Orden del renglón en el ticket"
        description:
          type: "string"
          description: "Texto del renglón como viene en el ticket"
        presentation_id:
          type: "integer"
          description: "Presentación del catálogo. NULL mientras no se liga"
        quantity_milli:
          $ref: "#/components/schemas/Milli"
          description: "Cantidad de presentaciones ×1000: 3 piezas = 3000, 1.250 kg a granel = 1250"
        unit_price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio por presentación en centavos"
        line_total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Importe del renglón con descuentos e IVA. La suma de renglones es el importe del gasto"
        cost_share_rule_id:
          type: "integer"
          description: "Reparto del renglón (Hogar, Karen, Conjunto 50/50 o una regla de un solo uso para «mixto»). NULL = el del gasto"
        cost_share_rule_parts:
          type: "array"
          items:
            $ref: "#/components/schemas/CostShareRulePartInput"
          description: "Reparto «mixto» del renglón: crea una regla de un solo uso (cost_share_rule.is_template = 0)."
      required:
        - "line_no"
        - "description"
        - "quantity_milli"
        - "line_total_cents"
    ExpenseCreate:
      type: "object"
      additionalProperties: false
      description: "Alta de un gasto (N-054). payment_method = credit no se acepta aquí: la compra a crédito crea su gasto (POST /api/v1/credit-purchases). kind por defecto: variable, o upcoming si la fecha es posterior a hoy. description es opcional: si falta, el gasto queda sin descripción (NULL) y la pantalla muestra la categoría; la API no inventa un texto de relleno (S1 C-16). captured_at (opcional) es el instante en que se capturó en el teléfono: una captura atrasada de la cola sin conexión lo manda junto con su Idempotency-Key (K9); sin valor, la hora de captura es la del alta."
      x-tabla: "expense"
      properties:
        kind:
          type: "string"
          enum:
            - "fixed"
            - "variable"
            - "upcoming"
          description: "fixed = gasto fijo, variable = gasto del día a día, upcoming = gasto venidero que ya ocurrió o quedó comprometido"
        description:
          type: "string"
          description: "Concepto o comercio. NULL = sin descripción: el registro en 3 toques no la pide (N-054) y la pantalla muestra la categoría"
