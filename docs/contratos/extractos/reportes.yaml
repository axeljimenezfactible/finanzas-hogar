# Finanzas Hogar · Contrato C1 v1.3.0 · extracto «reportes». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto reportes"
  version: "1.3.0"
  description: "Extracto de la etiqueta «Reportes» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Reportes"
    description: "Reportes, estado de cuenta de Karen, avisos enviados y jobs."
paths:
  /api/v1/reports:
    get:
      operationId: "listReports"
      tags:
        - "Reportes"
      summary: "Reportes generados"
      description: "Orden por defecto: -generated_at."
      x-necesidades:
        - "N-245"
        - "N-257"
        - "N-262"
      x-tablas:
        - "generated_report"
        - "notification"
        - "notification_delivery"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/PersonId"
        - name: "kind"
          in: "query"
          required: false
          description: "monthly_pdf o external_statement_pdf."
          schema:
            type: "string"
            enum:
              - "monthly_pdf"
              - "external_statement_pdf"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReportPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/reports/monthly:
    post:
      operationId: "generateMonthlyReport"
      tags:
        - "Reportes"
      summary: "Generar reporte mensual PDF"
      description: "LaTeX (lualatex) local. El resultado aparece en listReports."
      x-necesidades:
        - "N-248"
      x-tablas:
        - "audit_log"
        - "budget"
        - "category"
        - "credit_purchase"
        - "expense"
        - "expense_share"
        - "generated_report"
        - "idempotency_key"
        - "job"
        - "notification"
        - "notification_delivery"
        - "notification_recipient"
        - "notification_subscription"
        - "period"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyReportRequest"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReport"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/reports/external-statements:
    post:
      operationId: "generateExternalStatement"
      tags:
        - "Reportes"
      summary: "Generar estado de cuenta de Karen"
      description: "Generar estado de cuenta de Karen."
      x-necesidades:
        - "N-261"
      x-tablas:
        - "audit_log"
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "generated_report"
        - "idempotency_key"
        - "person"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalStatementRequest"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReport"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/reports/{report_id}/file:
    get:
      operationId: "downloadReportFile"
      tags:
        - "Reportes"
      summary: "Descargar PDF"
      description: "Solo con sesión válida."
      x-necesidades:
        - "N-249"
      x-tablas:
        - "generated_report"
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          description: "Id del registro (report_id)."
          schema:
            type: "integer"
            minimum: 1
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/pdf:
              schema:
                type: "string"
                contentMediaType: "application/pdf"
                description: "PDF guardado."
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/reports/{report_id}/send:
    post:
      operationId: "sendReport"
      tags:
        - "Reportes"
      summary: "Reintentar envío por Telegram"
      description: "Reintentar envío por Telegram."
      x-necesidades:
        - "N-250"
      x-tablas:
        - "generated_report"
        - "idempotency_key"
        - "notification_delivery"
        - "notification_recipient"
        - "notification_subscription"
      parameters:
        - name: "report_id"
          in: "path"
          required: true
          description: "Id del registro (report_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReport"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/monthly-report/months:
    get:
      operationId: "listMonthlyReportMonths"
      tags:
        - "Reportes"
      summary: "Meses disponibles"
      description: "Meses disponibles."
      x-necesidades:
        - "N-255"
      x-tablas:
        - "expense"
        - "generated_report"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportMonths"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/monthly-report:
    get:
      operationId: "getMonthlyReport"
      tags:
        - "Reportes"
      summary: "Reporte del mes (vista web)"
      description: "Por defecto el último mes cerrado. Mismas cifras que el PDF."
      x-necesidades:
        - "N-256"
        - "N-257"
      x-tablas:
        - "budget"
        - "category"
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "expense"
        - "expense_share"
        - "generated_report"
        - "income"
        - "meal_plan_entry"
        - "period"
        - "person"
        - "planned_item"
        - "price"
        - "savings_goal"
        - "savings_movement"
        - "scheduled_payment"
        - "scheduled_payment_share"
        - "weight_entry"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/persons/{person_id}/statement:
    get:
      operationId: "getExternalStatement"
      tags:
        - "Reportes"
      summary: "Estado de cuenta de Karen"
      description: "Solo personas externas. Por defecto el mes en curso."
      x-necesidades:
        - "N-260"
      x-tablas:
        - "credit"
        - "credit_payment"
        - "credit_purchase"
        - "credit_purchase_share"
        - "expense"
        - "expense_share"
        - "person"
        - "scheduled_payment"
        - "scheduled_payment_share"
      parameters:
        - name: "person_id"
          in: "path"
          required: true
          description: "Id del registro (person_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalStatement"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notification-deliveries:
    get:
      operationId: "listNotificationDeliveries"
      tags:
        - "Reportes"
      summary: "Avisos enviados"
      description: "Orden por defecto: -created_at. Texto plano tal como se envió."
      x-necesidades:
        - "N-247"
        - "N-245"
      x-tablas:
        - "notification"
        - "notification_delivery"
        - "notification_recipient"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - name: "notification_id"
          in: "query"
          required: false
          description: "Tipo de aviso."
          schema:
            type: "integer"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/jobs:
    get:
      operationId: "listJobs"
      tags:
        - "Reportes"
      summary: "Jobs programados"
      description: "Próximo envío de cada resumen (next_run_at) y próximo respaldo diario."
      x-necesidades:
        - "N-246"
        - "N-302"
        - "N-296"
        - "N-291"
      x-tablas:
        - "job"
        - "notification"
        - "notification_subscription"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    BudgetMonth:
      type: "object"
      description: "Resumen del mes (N-080). Real = Σ parte del hogar devengada (motor S2)."
      properties:
        month:
          $ref: "componentes-comunes.yaml#/components/schemas/Month"
          description: "Mes."
        income_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Quincenas capturadas o esperadas + extras."
        planned_spending_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ presupuesto de las categorías."
        planned_savings_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ aportaciones mensuales planificadas."
        unassigned_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "income − planned_spending − planned_savings."
        actual_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ parte del hogar devengada en el mes."
        remaining_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "planned_spending − actual (negativo si se rebasó)."
        used_pct:
          type: "integer"
          description: "actual ÷ planned_spending × 100, entero ROUND_HALF_UP; ausente sin plan."
        status:
          type: "string"
          enum:
            - "normal"
            - "warning"
            - "exceeded"
          description: "normal si % < 80; warning si ≥ 80; exceeded si ≥ 100 (decisión F)."
        days_left:
          type: "integer"
          description: "Días que faltan para terminar el mes, contando hoy (0 en meses pasados)."
      required:
        - "month"
        - "income_cents"
        - "planned_spending_cents"
        - "planned_savings_cents"
        - "unassigned_cents"
        - "actual_cents"
        - "remaining_cents"
        - "days_left"
      x-calculado: true
    BudgetCategoryRows:
      type: "object"
      description: "Presupuesto por categoría activa (N-081)."
      properties:
        month:
          $ref: "componentes-comunes.yaml#/components/schemas/Month"
          description: "Mes."
        rows:
          type: "array"
          items:
            type: "object"
            description: "Categoría."
            properties:
              category_id:
                type: "integer"
                description: "Categoría."
              planned_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Plan del mes."
              actual_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Parte del hogar devengada."
              difference_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "plan − real."
              used_pct:
                type: "integer"
                description: "% usado entero."
              status:
                type: "string"
                enum:
                  - "normal"
                  - "warning"
                  - "exceeded"
                description: "normal si % < 80; warning si ≥ 80; exceeded si ≥ 100 (decisión F)."
              expense_count:
                type: "integer"
                description: "Número de gastos."
            required:
              - "category_id"
              - "actual_cents"
              - "expense_count"
            x-calculado: true
          description: "Orden por defecto: used_pct descendente."
      required:
        - "month"
        - "rows"
      x-calculado: true
    BudgetFortnights:
      type: "object"
      description: "Quincenas del mes (N-082). Q1 del 1 al 15 y Q2 del 16 al último día (K8)."
      properties:
        month:
          $ref: "componentes-comunes.yaml#/components/schemas/Month"
          description: "Mes."
        fortnights:
          type: "array"
          items:
            type: "object"
            description: "Quincena."
            properties:
              half:
                type: "integer"
                enum:
                  - 1
                  - 2
                description: "Q1 (1) o Q2 (2)."
              start_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Inicio."
              end_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Fin."
              pay_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Día de pago (15, o 30/último día)."
              actual_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Parte del hogar por fecha del gasto."
              planned_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Parte del plan de la quincena (motor S2)."
            required:
              - "half"
              - "start_date"
              - "end_date"
              - "pay_date"
              - "actual_cents"
              - "planned_cents"
            x-calculado: true
          description: "Q1 y Q2."
      required:
        - "month"
        - "fortnights"
      x-calculado: true
    PersonParticipation:
      type: "object"
      description: "Participación de una persona externa (Karen) (N-026): solo despensa común y su línea revolvente. Nota fija: «Karen paga directo a Kueski su parte; su parte es informativa y repone la línea cuando paga»."
      properties:
        person_id:
          type: "integer"
          description: "Persona externa."
        month:
          $ref: "componentes-comunes.yaml#/components/schemas/Month"
          description: "Mes en curso."
        accrued_groceries_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Su parte devengada de la despensa en el mes (motor S2)."
        purchases:
          type: "array"
          items:
            type: "object"
            description: "Compra particular viva."
            properties:
              credit_purchase_id:
                type: "integer"
                description: "Compra."
              description:
                type: "string"
                description: "Comercio o descripción."
              purchase_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Fecha."
              total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Total."
              payments_made:
                type: "integer"
                description: "Pagos hechos."
              payments_total:
                type: "integer"
                description: "Pagos de la serie."
              balance_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Saldo."
            required:
              - "credit_purchase_id"
              - "purchase_date"
              - "total_cents"
              - "payments_made"
              - "payments_total"
              - "balance_cents"
            x-calculado: true
          description: "Sus compras a crédito vivas."
        payment_shares:
          type: "array"
          items:
            type: "object"
            description: "Su parte de un pago."
            properties:
              scheduled_payment_id:
                type: "integer"
                description: "Pago."
              due_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Fecha."
              amount_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Monto de su parte."
              status:
                type: "string"
                enum:
                  - "paid"
                  - "pending"
                description: "Pagada o pendiente."
            required:
              - "scheduled_payment_id"
              - "due_date"
              - "amount_cents"
              - "status"
            x-calculado: true
          description: "Con fecha en el mes."
        live_debt_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Σ de sus partes pendientes."
      required:
        - "person_id"
        - "month"
        - "accrued_groceries_cents"
        - "purchases"
        - "payment_shares"
        - "live_debt_cents"
      x-calculado: true
    MealPlanTrends:
      type: "object"
      description: "Tendencias de comidas (N-129, N-233): últimas 12 semanas con plan."
      properties:
        weeks:
          type: "array"
          items:
            type: "object"
            description: "Semana."
            properties:
              week_start:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Lunes."
              cost_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
