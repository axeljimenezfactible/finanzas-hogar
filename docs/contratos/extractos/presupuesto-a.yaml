      description: "Alta de un monto mensual con vigencia (N-087, N-278). category_id ausente = presupuesto total. valid_from_date = día 1 del primer mes en que rige; valid_to_date = último día del último mes, ausente = sin fin. Un monto de un solo mes empieza y termina en ese mes (RN-22). Alcance de un cambio de monto (K2): «de este mes en adelante» (scope=onward, preseleccionado) o «solo este mes» (scope=this_month); lo aplica updateBudget partiendo los renglones sin traslapes; con onward el monto nuevo rige sin fin y reemplaza los renglones posteriores de la categoría (C1-datos.md §7.1)."
