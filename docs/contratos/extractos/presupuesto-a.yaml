      tags:
        - "Presupuesto"
      summary: "Fijar monto de una categoría"
      description: "Si la vigencia se traslapa con la de otro renglón de la misma categoría (o del total) responde 409 `budget_overlap` (invariante 7 de S1). Sirve cuando la categoría no tiene monto que rija ese mes: «solo este mes» (K2) = valid_from_date y valid_to_date del mismo mes; «de este mes en adelante» = sin valid_to_date. El alta solo llena meses sin monto y nunca cambia ni elimina otros renglones: si la categoría ya tiene un renglón posterior, una vigencia sin fin se traslapa (409) y el alta llega hasta el día anterior a ese renglón; reemplazar los renglones posteriores es el efecto de updateBudget con scope=onward (C1-datos.md §7.1). Cambiar un monto que ya rige se hace con updateBudget y su alcance (scope)."
