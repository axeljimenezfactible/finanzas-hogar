  /api/v1/budgets:
    get:
      operationId: "listBudgets"
      tags:
        - "Presupuesto"
      summary: "Presupuesto mensual por categoría"
      description: "Renglones cuya vigencia toca el periodo `period` (por defecto el mes en curso). El monto de un mes es el del renglón cuya vigencia lo contiene (RN-22). Cada renglón trae is_single_month («solo este mes») y following_month_amount_cents, el monto que rige el mes siguiente (N-275, K2). Orden por defecto: category_id y valid_from_date."
      x-necesidades:
        - "N-275"
      x-tablas:
        - "budget"
        - "category"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/CategoryId"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
