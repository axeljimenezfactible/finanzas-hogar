            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/budgets/{budget_id}:
    patch:
      operationId: "updateBudget"
      tags:
        - "Presupuesto"
      summary: "Ajustar presupuesto"
      description: "Cambia el monto, cierra o reabre la vigencia (valid_to_date) o las notas. Un cambio de amount_cents aplica el alcance de K2 sobre el mes `month` (el que muestra la pantalla: en P-06 el elegido, en P-26.02 el mes en curso), que debe caer en la vigencia del renglón. Con `scope=onward` (por omisión) el monto nuevo rige desde `month` sin fin (valid_to_date NULL): el renglón termina el último día del mes anterior, otro renglón con el monto nuevo rige desde `month` y los renglones posteriores de la misma categoría (o del total) se eliminan, con su registro en audit_log, porque el monto nuevo los reemplaza (C1-datos.md §7.1). Con `scope=this_month` el monto nuevo rige solo ese mes, el anterior sigue desde el mes siguiente hasta el fin original y los renglones posteriores no cambian. Si el renglón empieza en `month`, el monto cambia en ese renglón (con onward queda sin fin y también se eliminan los posteriores; con this_month el resto de la vigencia queda en otro renglón con el monto anterior). Responde el renglón que rige en `month`. Los cambios de valid_to_date o notes no usan scope ni month. Una vigencia que se traslapa con otro renglón de la misma categoría responde 409 `budget_overlap`; `month` fuera de la vigencia, 422 `out_of_range`."
      x-necesidades:
        - "N-087"
        - "N-278"
      x-tablas:
        - "audit_log"
        - "budget"
      parameters:
        - name: "budget_id"
          in: "path"
          required: true
          description: "Id del registro (budget_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/BudgetScope"
        - $ref: "componentes-comunes.yaml#/components/parameters/BudgetMonth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    delete:
      operationId: "deleteBudget"
      tags:
        - "Presupuesto"
      summary: "Quitar monto"
      description: "Quitar monto."
      x-necesidades:
        - "N-278"
      x-tablas:
        - "audit_log"
        - "budget"
      parameters:
