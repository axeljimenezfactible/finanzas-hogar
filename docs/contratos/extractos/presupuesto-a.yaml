components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    Period:
      type: "object"
      description: "Periodo (tabla `period`). Mes calendario (periodo base del presupuesto) y sus dos quincenas (subperiodos). Los días de pago (15, y 30 o último día) son FIRMES (oráculo). Los rangos de la quincena (1 a 15 y 16 a fin de mes) son FIRMES (K8). Ambos se validan en la propia tabla. Campos ausentes = sin valor (NULL)."
      x-tabla: "period"
      required:
        - "id"
        - "kind"
        - "year"
        - "month"
        - "start_date"
        - "end_date"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        kind:
          type: "string"
          enum:
            - "month"
            - "fortnight"
          description: "month = mes calendario, fortnight = quincena"
        parent_id:
          type: "integer"
          description: "Mes al que pertenece la quincena. NULL en meses"
        year:
          type: "integer"
          description: "Año"
        month:
          type: "integer"
          description: "Mes"
        half:
          type: "integer"
          enum:
            - 1
            - 2
          description: "Quincena 1 (días 1 a 15) o 2 (día 16 a fin de mes). NULL en meses"
        start_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Primer día (ISO)"
        end_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Último día, inclusive (ISO)"
        pay_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Día de pago de la quincena: 15, o 30 o el último día si el mes es más corto (28-feb-2027). NULL en meses"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        label:
          type: "string"
          description: "Clave del periodo en el formato del filtro `period` (2026-10 o 2026-10-q1)."
          x-calculado: true
    Budget:
      type: "object"
      description: "Presupuesto (tabla `budget`). Monto mensual planeado por categoría o total, con vigencia: rige desde un mes hasta otro (inclusive) o sin fin. El monto de un solo mes es un renglón que empieza y termina en ese mes. Sirve para «real contra plan» y para las alertas al 80 % y 100 %. Campos ausentes = sin valor (NULL)."
      x-tabla: "budget"
      required:
        - "id"
        - "amount_cents"
        - "valid_from_date"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        category_id:
          type: "integer"
          description: "Categoría. NULL = presupuesto total del mes"
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto planeado por mes en centavos"
        valid_from_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Primer día del primer mes en que rige"
        valid_to_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Último día del último mes en que rige, inclusive. NULL = rige hasta que se cambie. Cada cambio hecho en Ajustes elige su vigencia (K2) con el alcance `scope` de updateBudget: «de este mes en adelante» (`onward`, preseleccionada y valor por omisión) deja NULL y elimina los renglones posteriores de la misma categoría, que el monto nuevo reemplaza (updateBudget, C1-datos.md §7.1); «solo este mes» (`this_month`) pone el último día de ese mes y el monto anterior sigue desde el mes siguiente"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        is_single_month:
          type: "boolean"
          description: "true si la vigencia es un solo mes («solo este mes», K2)."
          x-calculado: true
        following_month_amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
