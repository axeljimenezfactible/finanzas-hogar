# Finanzas Hogar · Contrato C1 v1.4.0 · extracto «ajustes-e». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto ajustes-e"
  version: "1.4.0"
  description: "Extracto de la etiqueta «Ajustes» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Ajustes"
    description: "Las 14 secciones de Ajustes, sesiones y sistema."
paths:
  /api/v1/notifications:
    get:
      operationId: "listNotifications"
      tags:
        - "Ajustes"
      summary: "Avisos y su configuración"
      description: "Avisos y su configuración."
      x-necesidades:
        - "N-296"
        - "N-298"
      x-tablas:
        - "job"
        - "notification"
        - "notification_subscription"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notifications/{notification_id}:
    patch:
      operationId: "updateNotification"
      tags:
        - "Ajustes"
      summary: "Editar aviso"
      description: "Activa o desactiva el aviso o el reporte y cambia sus parámetros propios. La hora, el día y la anticipación se cambian en updateReportSettings y updateAlertSettings (Q2-11 B, K47)."
      x-necesidades:
        - "N-297"
        - "N-300"
      x-tablas:
        - "audit_log"
        - "notification"
      parameters:
        - name: "notification_id"
          in: "path"
          required: true
          description: "Id del registro (notification_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notifications/{notification_id}/recipients:
    put:
      operationId: "setNotificationRecipients"
      tags:
        - "Ajustes"
      summary: "Destinatarios de un aviso"
      description: "Lista completa de ids de destinatario (notification_recipient)."
      x-necesidades:
        - "N-297"
        - "N-300"
      x-tablas:
        - "audit_log"
        - "notification_recipient"
        - "notification_subscription"
      parameters:
        - name: "notification_id"
          in: "path"
          required: true
          description: "Id del registro (notification_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdList"
      responses:
        "204":
          description: "Hecho, sin contenido."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notifications/{notification_id}/test:
    post:
      operationId: "sendTestNotification"
      tags:
        - "Ajustes"
      summary: "Enviar aviso de prueba"
      description: "Envía ahora el aviso (p. ej. resumen diario o una alerta) a una persona: sirve de disparo manual. Texto plano, sin parse_mode."
      x-necesidades:
        - "N-300"
      x-tablas:
        - "notification"
        - "notification_delivery"
        - "notification_recipient"
      parameters:
        - name: "notification_id"
          in: "path"
          required: true
          description: "Id del registro (notification_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestNotificationRequest"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notification-recipients:
    get:
      operationId: "listNotificationRecipients"
      tags:
        - "Ajustes"
      summary: "Registro de chat"
      description: "Chats confirmados por persona. Nunca devuelve chat_id ni el token del bot. Los chats detectados pendientes están en listTelegramChatCandidates (N-299, K4)."
      x-necesidades:
        - "N-299"
      x-tablas:
        - "notification_recipient"
        - "person"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipientPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/telegram-chat-candidates:
    get:
      operationId: "listTelegramChatCandidates"
      tags:
        - "Ajustes"
      summary: "Chats detectados por confirmar"
      description: "Chats que el bot detectó cuando alguien le escribió y que esperan confirmación (confirmed_at ausente): nombre que da Telegram, fecha y hora de detección y chat_id enmascarado (chat_id_masked). El chat_id completo nunca se devuelve (K4). Cada candidato trae su id, el que usan confirmTelegramChatCandidate (N-316) y dismissTelegramChatCandidate (N-324). Orden: -detected_at."
      x-necesidades:
        - "N-299"
      x-tablas:
        - "telegram_chat_candidate"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChatCandidatePage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/telegram-chat-candidates/{candidate_id}/confirm:
    post:
      operationId: "confirmTelegramChatCandidate"
      tags:
        - "Ajustes"
      summary: "Confirmar chat detectado"
      description: "Liga el chat detectado a una persona (por omisión, la del usuario de la sesión): pone person_id y confirmed_at y crea su notification_recipient en la misma transacción (K4). Un chat ya confirmado responde 409 `conflict`."
      x-necesidades:
        - "N-316"
      x-tablas:
        - "audit_log"
        - "idempotency_key"
        - "notification_recipient"
        - "person"
        - "telegram_chat_candidate"
      parameters:
        - name: "candidate_id"
          in: "path"
          required: true
          description: "Id del registro (candidate_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChatCandidateConfirm"
      responses:
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipient"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/telegram-chat-candidates/{candidate_id}:
    delete:
      operationId: "dismissTelegramChatCandidate"
      tags:
        - "Ajustes"
      summary: "Descartar chat detectado"
      description: "Descarta un chat detectado que nadie va a confirmar: borra su renglón de telegram_chat_candidate. No toca chats confirmados ni destinatarios (notification_recipient). Solo candidatos pendientes (confirmed_at ausente); uno ya confirmado o inexistente responde 404."
      x-necesidades:
        - "N-324"
      x-tablas:
        - "audit_log"
        - "telegram_chat_candidate"
      parameters:
        - name: "candidate_id"
          in: "path"
          required: true
          description: "Id del registro (candidate_id)."
          schema:
            type: "integer"
            minimum: 1
      responses:
        "204":
          description: "Hecho, sin contenido."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notification-recipients/{recipient_id}:
    patch:
      operationId: "updateNotificationRecipient"
      tags:
        - "Ajustes"
      summary: "Editar destinatario"
      description: "Editar destinatario."
      x-necesidades:
        - "N-299"
      x-tablas:
        - "audit_log"
        - "notification_recipient"
      parameters:
        - name: "recipient_id"
          in: "path"
          required: true
          description: "Id del registro (recipient_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRecipientUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipient"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/backups:
    get:
      operationId: "listBackups"
      tags:
        - "Ajustes"
      summary: "Respaldos"
      description: "Orden por defecto: -started_at."
      x-necesidades:
        - "N-302"
      x-tablas:
        - "backup"
        - "job"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    post:
      operationId: "createBackup"
      tags:
        - "Ajustes"
      summary: "Respaldar ahora"
      description: "VACUUM INTO a la carpeta de respaldos local + PRAGMA integrity_check."
      x-necesidades:
        - "N-303"
      x-tablas:
        - "backup"
        - "idempotency_key"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    IdList:
      type: "object"
      description: "Lista de ids (reemplazo completo)."
      properties:
        ids:
          type: "array"
          items:
            type: "integer"
          description: "Ids en el orden deseado."
          x-entrada: true
      required:
        - "ids"
    Notification:
      type: "object"
      description: "Aviso (tabla `notification`). Cada aviso o reporte configurable: resúmenes diario y semanal, reporte mensual, pago próximo, presupuesto 80/100 %, precios viejos y plan sin armar. Esta migración crea los siete con los parámetros que ya decidió Axel. Campos ausentes = sin valor (NULL)."
      x-tabla: "notification"
      required:
        - "id"
        - "code"
        - "name"
        - "is_enabled"
        - "params_json"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        code:
          type: "string"
          enum:
            - "daily_summary"
            - "weekly_summary"
            - "monthly_report"
            - "payment_due"
            - "budget_threshold"
            - "stale_prices"
            - "meal_plan_missing"
          description: "Clave del aviso"
        name:
          type: "string"
          description: "Nombre en Ajustes"
        is_enabled:
          type: "boolean"
          description: "1 = activo"
        params_json:
          type: "object"
          additionalProperties: true
          description: "Parámetros propios del aviso (objeto JSON). La hora, el día, la anticipación, los umbrales del presupuesto y los días antes del pago próximo no van aquí: son claves de `app_setting` (RN-29): `alerts.budget_warning_pct`, `alerts.budget_limit_pct` y `alerts.payment_due_days_before` desde el esquema 1.3 (00003, K44), y `reports.*` (hora y día de los reportes), `alerts.send_time`, `alerts.stale_prices_advance_days` y `alerts.meal_plan_missing_weekday` desde el 1.4 (00004, Q2-11 B, K47); se leen y cambian en getReportSettings y getAlertSettings. Con los valores iniciales solo `budget_threshold` conserva un parámetro (`scopes`); los demás avisos quedan con `{}`. Los Down de la 00004 y de la 00003 los reponen aquí."
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        recipient_ids:
          type: "array"
          items:
            type: "integer"
          description: "Destinatarios suscritos (notification_subscription)."
          x-calculado: true
        job_id:
          type: "integer"
          description: "Job que lo programa."
          x-calculado: true
    NotificationUpdate:
      type: "object"
      additionalProperties: false
      description: "Activa o desactiva un aviso o un reporte programado (N-297, N-300) y cambia sus parámetros propios (params_json). La hora, el día y la anticipación ya no van aquí (Q2-11 B, K47): son claves de app_setting con valor inicial y «restablecer» (K44), las de los reportes en updateReportSettings y las de los avisos en updateAlertSettings. is_enabled es FIRME."
      x-tabla: "notification"
      properties:
        is_enabled:
          type: "boolean"
          description: "1 = activo"
        params_json:
          type: "object"
          additionalProperties: true
          description: "Parámetros propios del aviso (objeto JSON). La hora, el día, la anticipación, los umbrales del presupuesto y los días antes del pago próximo no van aquí: son claves de `app_setting` (RN-29): `alerts.budget_warning_pct`, `alerts.budget_limit_pct` y `alerts.payment_due_days_before` desde el esquema 1.3 (00003, K44), y `reports.*` (hora y día de los reportes), `alerts.send_time`, `alerts.stale_prices_advance_days` y `alerts.meal_plan_missing_weekday` desde el 1.4 (00004, Q2-11 B, K47); se leen y cambian en getReportSettings y getAlertSettings. Con los valores iniciales solo `budget_threshold` conserva un parámetro (`scopes`); los demás avisos quedan con `{}`. Los Down de la 00004 y de la 00003 los reponen aquí."
      minProperties: 1
    TestNotificationRequest:
      type: "object"
      description: "Enviar ahora un aviso de prueba a una persona (N-300); sirve para disparar a mano el resumen diario o una alerta."
      properties:
        person_id:
          type: "integer"
          description: "Destinataria (Axel o Ximena)."
      required:
        - "person_id"
    NotificationDelivery:
      type: "object"
      description: "Envío de aviso (tabla `notification_delivery`). Cada envío de un aviso a un destinatario, con clave para no mandar dos veces lo mismo y el resultado HTTP. Campos ausentes = sin valor (NULL)."
      x-tabla: "notification_delivery"
      required:
        - "id"
        - "notification_id"
        - "recipient_id"
        - "dedupe_key"
        - "status"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        notification_id:
          type: "integer"
          description: "Aviso"
        recipient_id:
          type: "integer"
          description: "Destinatario"
        dedupe_key:
          type: "string"
          description: "Clave que evita repetir el mismo aviso (payment_due:42:2026-10-29)"
        status:
          type: "string"
          enum:
            - "pending"
            - "sent"
            - "failed"
            - "skipped"
          description: "Estado del envío"
        message_text:
          type: "string"
          description: "Texto plano enviado (sin parse_mode)"
        http_status:
          type: "integer"
          description: "Código HTTP de la API de Telegram"
        error:
          type: "string"
          description: "Error resumido, sin token ni datos sensibles"
        sent_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Momento del envío"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        notification_code:
          type: "string"
          description: "Clave del aviso."
          x-calculado: true
    NotificationRecipient:
      type: "object"
      description: "Destinatario (tabla `notification_recipient`). Destino de avisos de una persona: su chat de Telegram en el bot MultiX. El chat_id no es credencial. El token del bot nunca se guarda en la base. Campos ausentes = sin valor (NULL)."
      x-tabla: "notification_recipient"
      required:
        - "id"
        - "person_id"
        - "channel"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        person_id:
          type: "integer"
          description: "Persona destinataria"
        channel:
          type: "string"
          enum:
            - "telegram"
          description: "Canal (bot MultiX)"
        label:
          type: "string"
          description: "Etiqueta (Celular de Ximena)"
        verified_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo se comprobó con un mensaje de prueba"
        is_active:
          type: "boolean"
          description: "is_active"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        is_registered:
          type: "boolean"
          description: "true si tiene chat registrado y verificado."
          x-calculado: true
    TelegramChatCandidate:
      type: "object"
      description: "Chat de Telegram por confirmar (tabla `telegram_chat_candidate`). Chat que el bot detectó cuando alguien le escribió y que espera confirmación en Ajustes «Notificaciones». Guarda solo el chat_id y el nombre que da Telegram. Al confirmarlo se liga a la persona y la API crea su notification_recipient en la misma transacción; descartarlo borra el renglón. Campos ausentes = sin valor (NULL)."
      x-tabla: "telegram_chat_candidate"
      required:
        - "id"
        - "telegram_name"
        - "detected_at"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        telegram_name:
          type: "string"
          description: "Nombre que da Telegram para ese chat"
        detected_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo lo detectó el bot"
        confirmed_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo la persona lo confirmó en Ajustes. NULL = pendiente"
        person_id:
          type: "integer"
          description: "Persona a quien se ligó al confirmar"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        chat_id_masked:
          type: "string"
          description: "chat_id enmascarado: «•••» y sus últimos 4 caracteres (p. ej. «•••4821»), para distinguir dos chats con el mismo nombre. El chat_id completo nunca se devuelve (C1-12, K4)."
          x-calculado: true
    TelegramChatCandidateConfirm:
      type: "object"
      description: "Confirmación de un chat detectado (N-316, K4)."
      properties:
        person_id:
          type: "integer"
          description: "Persona a quien se liga el chat; sin valor, la persona del usuario de la sesión."
      additionalProperties: false
    NotificationRecipientUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de destinatario (tabla `notification_recipient`)."
      x-tabla: "notification_recipient"
      properties:
        label:
          type:
            - "string"
            - "null"
          description: "Etiqueta (Celular de Ximena) · null borra el valor"
        is_active:
          type: "boolean"
          description: "is_active"
      minProperties: 1
    Backup:
      type: "object"
