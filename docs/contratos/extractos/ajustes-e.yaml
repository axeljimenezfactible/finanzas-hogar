  /api/v1/system/ca-certificate:
    get:
      operationId: "getCaCertificate"
      tags:
        - "Ajustes"
      summary: "Certificado raíz de la CA local"
      description: "Archivo de la CA local (no la base)."
      x-necesidades:
        - "N-274"
      x-tablas: []
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/x-pem-file:
              schema:
                type: "string"
                contentMediaType: "application/x-pem-file"
                description: "Certificado raíz público de mkcert (rootCA.pem). Nunca la llave."
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    TestNotificationRequest:
      type: "object"
      description: "Enviar ahora un aviso de prueba a una persona (N-300); sirve para disparar a mano el resumen diario o una alerta."
      properties:
        person_id:
          type: "integer"
          description: "Destinataria (Axel o Ximena)."
      required:
        - "person_id"
    NotificationDelivery:
      type: "object"
      description: "Envío de aviso (tabla `notification_delivery`). Cada envío de un aviso a un destinatario, con clave para no mandar dos veces lo mismo y el resultado HTTP. Campos ausentes = sin valor (NULL)."
      x-tabla: "notification_delivery"
      required:
        - "id"
        - "notification_id"
        - "recipient_id"
        - "dedupe_key"
        - "status"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        notification_id:
          type: "integer"
          description: "Aviso"
        recipient_id:
          type: "integer"
          description: "Destinatario"
        dedupe_key:
          type: "string"
          description: "Clave que evita repetir el mismo aviso (payment_due:42:2026-10-29)"
        status:
          type: "string"
          enum:
            - "pending"
            - "sent"
            - "failed"
            - "skipped"
          description: "Estado del envío"
        message_text:
          type: "string"
          description: "Texto plano enviado (sin parse_mode)"
        http_status:
          type: "integer"
          description: "Código HTTP de la API de Telegram"
        error:
          type: "string"
          description: "Error resumido, sin token ni datos sensibles"
        sent_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Momento del envío"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        notification_code:
          type: "string"
          description: "Clave del aviso."
          x-calculado: true
    NotificationRecipient:
      type: "object"
      description: "Destinatario (tabla `notification_recipient`). Destino de avisos de una persona: su chat de Telegram en el bot MultiX. El chat_id no es credencial. El token del bot nunca se guarda en la base. Campos ausentes = sin valor (NULL)."
      x-tabla: "notification_recipient"
      required:
        - "id"
        - "person_id"
        - "channel"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        person_id:
          type: "integer"
          description: "Persona destinataria"
        channel:
          type: "string"
          enum:
            - "telegram"
          description: "Canal (bot MultiX)"
        label:
          type: "string"
          description: "Etiqueta (Celular de Ximena)"
        verified_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo se comprobó con un mensaje de prueba"
        is_active:
          type: "boolean"
          description: "is_active"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        is_registered:
          type: "boolean"
          description: "true si tiene chat registrado y verificado."
          x-calculado: true
    TelegramChatCandidate:
      type: "object"
      description: "Chat de Telegram por confirmar (tabla `telegram_chat_candidate`). Chat que el bot detectó cuando alguien le escribió y que espera confirmación en Ajustes «Notificaciones». Guarda solo el chat_id y el nombre que da Telegram. Al confirmarlo se liga a la persona y la API crea su notification_recipient en la misma transacción; descartarlo borra el renglón. Campos ausentes = sin valor (NULL)."
      x-tabla: "telegram_chat_candidate"
      required:
        - "id"
        - "telegram_name"
        - "detected_at"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        telegram_name:
          type: "string"
          description: "Nombre que da Telegram para ese chat"
        detected_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo lo detectó el bot"
        confirmed_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo la persona lo confirmó en Ajustes. NULL = pendiente"
        person_id:
          type: "integer"
          description: "Persona a quien se ligó al confirmar"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        chat_id_masked:
          type: "string"
          description: "chat_id enmascarado: «•••» y sus últimos 4 caracteres (p. ej. «•••4821»), para distinguir dos chats con el mismo nombre. El chat_id completo nunca se devuelve (C1-12, K4)."
          x-calculado: true
    TelegramChatCandidateConfirm:
      type: "object"
      description: "Confirmación de un chat detectado (N-316, K4)."
      properties:
        person_id:
          type: "integer"
          description: "Persona a quien se liga el chat; sin valor, la persona del usuario de la sesión."
      additionalProperties: false
    NotificationRecipientUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de destinatario (tabla `notification_recipient`)."
      x-tabla: "notification_recipient"
      properties:
        label:
          type:
            - "string"
            - "null"
          description: "Etiqueta (Celular de Ximena) · null borra el valor"
        is_active:
          type: "boolean"
          description: "is_active"
      minProperties: 1
    Backup:
      type: "object"
      description: "Respaldo (tabla `backup`). Respaldo local de la base (VACUUM INTO) con huella, resultado de integrity_check y prueba de restauración. Campos ausentes = sin valor (NULL)."
      x-tabla: "backup"
      required:
        - "id"
        - "kind"
        - "status"
        - "started_at"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        kind:
          type: "string"
          enum:
            - "scheduled"
            - "manual"
            - "pre_migration"
          description: "Diario programado, manual o previo a una migración"
        status:
          type: "string"
          enum:
            - "running"
            - "ok"
            - "failed"
          description: "Estado"
        started_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Inicio"
        finished_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Fin"
        file_path:
          type: "string"
          description: "Ruta del archivo en la carpeta o disco de respaldos"
        size_bytes:
          type: "integer"
          description: "Tamaño en bytes"
        sha256:
          type: "string"
          description: "Huella del archivo"
        integrity_check:
          type: "string"
          description: "Resultado de PRAGMA integrity_check sobre la copia (ok o el error)"
        restore_tested_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Última restauración de prueba"
        restore_test_result:
          type: "string"
          description: "Resultado de esa restauración"
        pruned_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo se borró el archivo por la política de retención"
        error:
          type: "string"
          description: "Error resumido"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
