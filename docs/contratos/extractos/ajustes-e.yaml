# Finanzas Hogar · Contrato C1 v1.1.0 · extracto «ajustes-e». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto ajustes-e"
  version: "1.1.0"
  description: "Extracto de la etiqueta «Ajustes» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Ajustes"
    description: "Las 14 secciones de Ajustes, sesiones y sistema."
paths:
  /api/v1/notifications/{notification_id}/test:
    post:
      operationId: "sendTestNotification"
      tags:
        - "Ajustes"
      summary: "Enviar aviso de prueba"
      description: "Envía ahora el aviso (p. ej. resumen diario o una alerta) a una persona: sirve de disparo manual. Texto plano, sin parse_mode."
      x-necesidades:
        - "N-300"
      x-tablas:
        - "notification"
        - "notification_delivery"
        - "notification_recipient"
      parameters:
        - name: "notification_id"
          in: "path"
          required: true
          description: "Id del registro (notification_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestNotificationRequest"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notification-recipients:
    get:
      operationId: "listNotificationRecipients"
      tags:
        - "Ajustes"
      summary: "Registro de chat"
      description: "Chats confirmados por persona. Nunca devuelve chat_id ni el token del bot. Los chats detectados pendientes están en listTelegramChatCandidates (N-299, K4)."
      x-necesidades:
        - "N-299"
      x-tablas:
        - "notification_recipient"
        - "person"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipientPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/telegram-chat-candidates:
    get:
      operationId: "listTelegramChatCandidates"
      tags:
        - "Ajustes"
      summary: "Chats detectados por confirmar"
      description: "Chats que el bot detectó cuando alguien le escribió y que esperan confirmación (confirmed_at ausente): nombre que da Telegram, fecha y hora de detección y chat_id enmascarado (chat_id_masked). El chat_id completo nunca se devuelve (K4). Orden: -detected_at."
      x-necesidades:
        - "N-299"
      x-tablas:
        - "telegram_chat_candidate"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChatCandidatePage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/telegram-chat-candidates/{candidate_id}/confirm:
    post:
      operationId: "confirmTelegramChatCandidate"
      tags:
        - "Ajustes"
      summary: "Confirmar chat detectado"
      description: "Liga el chat detectado a una persona (por omisión, la del usuario de la sesión): pone person_id y confirmed_at y crea su notification_recipient en la misma transacción (K4). Un chat ya confirmado responde 409 `conflict`."
      x-necesidades:
        - "N-316"
      x-tablas:
        - "audit_log"
        - "idempotency_key"
        - "notification_recipient"
        - "person"
        - "telegram_chat_candidate"
      parameters:
        - name: "candidate_id"
          in: "path"
          required: true
          description: "Id del registro (candidate_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramChatCandidateConfirm"
      responses:
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipient"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/notification-recipients/{recipient_id}:
    patch:
      operationId: "updateNotificationRecipient"
      tags:
        - "Ajustes"
      summary: "Editar destinatario"
      description: "Editar destinatario."
      x-necesidades:
        - "N-299"
      x-tablas:
        - "audit_log"
        - "notification_recipient"
      parameters:
        - name: "recipient_id"
          in: "path"
          required: true
          description: "Id del registro (recipient_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRecipientUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipient"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/backups:
    get:
      operationId: "listBackups"
      tags:
        - "Ajustes"
      summary: "Respaldos"
      description: "Orden por defecto: -started_at."
      x-necesidades:
        - "N-302"
      x-tablas:
        - "backup"
        - "job"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/Period"
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
    post:
      operationId: "createBackup"
      tags:
        - "Ajustes"
      summary: "Respaldar ahora"
      description: "VACUUM INTO a la carpeta de respaldos local + PRAGMA integrity_check."
      x-necesidades:
        - "N-303"
      x-tablas:
        - "backup"
        - "idempotency_key"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/backups/{backup_id}/restore:
    post:
      operationId: "restoreBackup"
      tags:
        - "Ajustes"
      summary: "Restaurar respaldo"
      description: "Acción crítica: doble confirmación en pantalla y `confirmation` = RESTAURAR; antes toma un respaldo pre_migration."
      x-necesidades:
        - "N-303"
      x-tablas:
        - "backup"
      parameters:
        - name: "backup_id"
          in: "path"
          required: true
          description: "Id del registro (backup_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRestoreRequest"
      responses:
        "202":
          description: "Aceptado: el trabajo quedó registrado o en curso."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/system/seed-status:
    get:
      operationId: "getSeedStatus"
      tags:
        - "Ajustes"
      summary: "Datos semilla"
      description: "Datos semilla."
      x-necesidades:
        - "N-305"
      x-tablas:
        - "audit_log"
        - "credit_purchase"
        - "expense"
        - "expense_item"
        - "planned_item"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedStatus"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/ai/providers:
    get:
      operationId: "listAiProviders"
      tags:
        - "Ajustes"
      summary: "IA opcional"
      description: "IA opcional."
      x-necesidades:
        - "N-306"
      x-tablas:
        - "app_setting"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviders"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/ai/providers/{provider}:
    patch:
      operationId: "updateAiProvider"
      tags:
        - "Ajustes"
      summary: "Activar o desactivar IA"
      description: "Activar o desactivar IA."
      x-necesidades:
        - "N-307"
      x-tablas:
        - "app_setting"
        - "audit_log"
      parameters:
        - name: "provider"
          in: "path"
          required: true
          description: "Proveedor de IA."
          schema:
            type: "string"
            enum:
              - "local_model"
              - "claude_api"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
