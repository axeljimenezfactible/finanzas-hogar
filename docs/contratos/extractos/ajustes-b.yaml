# Finanzas Hogar · Contrato C1 v1.4.0 · extracto «ajustes-b». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto ajustes-b"
  version: "1.4.0"
  description: "Extracto de la etiqueta «Ajustes» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Ajustes"
    description: "Las 14 secciones de Ajustes, sesiones y sistema."
paths:
  /api/v1/planned-items/{planned_item_id}:
    patch:
      operationId: "updatePlannedItem"
      tags:
        - "Ajustes"
      summary: "Editar o desactivar partida"
      description: "Edita o desactiva una partida (is_active = false). En el ingreso esperado: montos de cada quincena (amount_cents, second_half_amount_cents) y fecha desde la que rigen (N-280)."
      x-necesidades:
        - "N-278"
        - "N-280"
      x-tablas:
        - "audit_log"
        - "planned_item"
      parameters:
        - name: "planned_item_id"
          in: "path"
          required: true
          description: "Id del registro (planned_item_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedItemUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedItem"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/imports/planned-items/preview:
