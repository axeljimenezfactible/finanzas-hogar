tags:
  - name: "Ajustes"
    description: "Las 14 secciones de Ajustes, sesiones y sistema."
paths:
  /api/v1/imports/planned-items/preview:
    post:
      operationId: "previewPlannedItemsImport"
      tags:
        - "Ajustes"
      summary: "Vista previa de gastos_fijos_ingresos.csv"
      description: "No escribe nada."
      x-necesidades:
        - "N-304"
      x-tablas:
        - "category"
        - "cost_share_rule"
        - "credit"
        - "person"
        - "planned_item"
      requestBody:
