        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "file"
              properties:
                file:
                  type: "string"
                  contentMediaType: "application/octet-stream"
                  description: "Archivo gastos_fijos_ingresos.csv (plantilla de plan.md §8.2). Tipos admitidos: text/csv."
            encoding:
              file:
                contentType: "text/csv"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
