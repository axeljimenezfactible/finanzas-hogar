      x-tabla: "planned_item"
      required:
        - "id"
        - "kind"
        - "description"
        - "amount_cents"
        - "frequency"
        - "interval_count"
        - "start_date"
        - "accrual_months"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        kind:
          type: "string"
          enum:
            - "income"
            - "fixed_expense"
            - "upcoming_expense"
          description: "Tipo (columna «tipo» del CSV): ingreso, gasto fijo o gasto venidero"
        description:
          type: "string"
          description: "Concepto"
        amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto de cada ocurrencia en centavos (sueldo por quincena, renta por mes). En quincenal es el de la quincena del 15, y también el del 30 si second_half_amount_cents es NULL"
        second_half_amount_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto de la quincena del 30 (o último día del mes) cuando difiere del de la quincena del 15 (N-279). NULL = las dos quincenas iguales"
        frequency:
          type: "string"
          enum:
            - "weekly"
            - "fortnightly"
            - "monthly"
            - "yearly"
            - "once"
          description: "Periodicidad. fortnightly cae en los días de pago 15 y 30 (o último día). Las demás se repiten desde start_date"
        interval_count:
          type: "integer"
          description: "Cada cuántas unidades se repite (despensa bimestral = monthly cada 2)"
        start_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Primera ocurrencia o fecha única. Su día del mes es el ancla y se recorta al último día en meses cortos"
