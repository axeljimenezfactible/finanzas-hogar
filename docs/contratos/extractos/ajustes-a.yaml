          type: "integer"
          description: "Persona a quien se atribuye. En ingresos solo el titular (disparador). NULL = hogar en general"
        cost_share_rule_id:
          type: "integer"
          description: "Reparto del gasto. NULL = el de la categoría o el de por defecto"
        payment_method:
          type: "string"
          enum:
