        term_count:
          type: "integer"
          description: "Plazo planeado en pagos (4 quincenas)"
        accrual_months:
          type: "integer"
          description: "Meses en que se devenga cada ocurrencia (despensa bimestral = 2)"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
