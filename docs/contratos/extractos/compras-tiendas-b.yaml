      operationId: "listInventoryMovements"
      tags:
        - "Compras y tiendas"
      summary: "Movimientos de un artículo"
      description: "Movimientos guardados del renglón (inventory_movement): fecha, tipo (compra, sobrante de receta, consumo del plan o ajuste), motivo en los ajustes, diferencia y origen (renglón de ticket o entrada del plan). Orden por defecto: -movement_date."
      x-necesidades:
        - "N-181"
      x-tablas:
        - "expense_item"
        - "inventory_item"
        - "inventory_movement"
        - "meal_plan_entry"
      parameters:
        - name: "inventory_item_id"
          in: "path"
          required: true
          description: "Id del registro (inventory_item_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/Cursor"
        - $ref: "componentes-comunes.yaml#/components/parameters/Limit"
        - $ref: "componentes-comunes.yaml#/components/parameters/Sort"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementPage"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/inventory-items/{inventory_item_id}/adjustments:
    post:
      operationId: "adjustInventoryItem"
      tags:
        - "Compras y tiendas"
      summary: "Ajustar existencia"
      description: "Cantidad nueva o diferencia, con motivo (conteo, consumo o merma): cambia la existencia y escribe el movimiento adjustment en la misma transacción."
      x-necesidades:
        - "N-183"
      x-tablas:
        - "audit_log"
        - "idempotency_key"
        - "inventory_item"
        - "inventory_movement"
      parameters:
        - name: "inventory_item_id"
          in: "path"
          required: true
          description: "Id del registro (inventory_item_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustmentRequest"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    RecipeIngredientInput:
      type: "object"
      additionalProperties: false
      description: "Alta de ingrediente de receta (tabla `recipe_ingredient`)."
      x-tabla: "recipe_ingredient"
      properties:
        product_id:
          type: "integer"
          description: "Ingrediente (producto genérico)"
        presentation_id:
          type: "integer"
          description: "Presentación comprable sugerida"
        quantity_milli:
          $ref: "#/components/schemas/Milli"
          description: "Cantidad para base_servings en milésimas de la unidad base (250 g = 250000, media pieza = 500)"
        display_text:
          type: "string"
          description: "Cantidad como la escribe la receta (1/2 taza)"
        is_optional:
          type: "boolean"
          description: "1 = ingrediente opcional"
        sort_order:
          type: "integer"
          description: "Orden en la receta"
      required:
        - "product_id"
        - "quantity_milli"
    RecipeCreate:
      type: "object"
      additionalProperties: false
      description: "Alta de receta (N-136). origin = household y author_person_id = persona de la sesión los pone la API."
      x-tabla: "recipe"
      properties:
        name:
          type: "string"
          description: "Nombre"
        description:
          type: "string"
          description: "Descripción corta"
        instructions:
          type: "string"
          description: "Pasos de preparación"
        base_servings:
          type: "integer"
          description: "Porciones para las que están escritas las cantidades (base 2)"
        prep_minutes:
          type: "integer"
          description: "Minutos de preparación"
        cook_minutes:
          type: "integer"
          description: "Minutos de cocción"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
        meal_slot_ids:
          type: "array"
          uniqueItems: true
          items:
            type: "integer"
            minimum: 1
          description: "Tiempos aptos (una fila de recipe_meal_slot por tiempo)."
          x-columna: "recipe_meal_slot.meal_slot_id"
        ingredients:
          type: "array"
          items:
            $ref: "#/components/schemas/RecipeIngredientInput"
          description: "Ingredientes (recipe_ingredient) en orden."
      required:
        - "name"
    NutritionFact:
      type: "object"
      description: "Dato nutricional (tabla `nutrition_fact`). Kilocalorías por 100 g de un producto (o de una presentación específica) con fuente citada. Macronutrientes previstos, se llenan después. Campos ausentes = sin valor (NULL)."
      x-tabla: "nutrition_fact"
      required:
        - "id"
        - "product_id"
        - "kcal_milli_per_100g"
        - "source"
        - "is_preferred"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        product_id:
          type: "integer"
          description: "Producto"
        presentation_id:
          type: "integer"
          description: "Presentación específica (etiqueta, Open Food Facts). NULL = valor genérico del producto"
        kcal_milli_per_100g:
          type: "integer"
          description: "Milésimas de kilocaloría por 100 g (884 kcal = 884000)"
        protein_mg_per_100g:
          type: "integer"
          description: "Proteína en mg por 100 g (previsto)"
        fat_mg_per_100g:
          type: "integer"
          description: "Grasa en mg por 100 g (previsto)"
        carbs_mg_per_100g:
          type: "integer"
          description: "Carbohidratos en mg por 100 g (previsto)"
        fiber_mg_per_100g:
          type: "integer"
          description: "Fibra en mg por 100 g (previsto)"
        source:
          type: "string"
          enum:
            - "usda_fdc"
            - "open_food_facts"
            - "mx_table"
            - "store_label"
            - "manual"
          description: "Fuente: USDA FoodData Central, Open Food Facts, tabla mexicana citada, etiqueta de tienda o captura manual"
        source_ref:
          type: "string"
          description: "Cita: fdc_id, código de barras, tabla y página o URL de la etiqueta"
        source_license:
          type: "string"
          description: "Licencia de la fuente (CC0, ODbL)"
        is_preferred:
          type: "boolean"
          description: "1 = valor que usan los cálculos"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
    NutritionFactCreate:
      type: "object"
      additionalProperties: false
      description: "Dato nutricional manual con cita (source manual, mx_table o store_label; N-175)."
      x-tabla: "nutrition_fact"
      properties:
        presentation_id:
          type: "integer"
          description: "Presentación específica (etiqueta, Open Food Facts). NULL = valor genérico del producto"
        kcal_milli_per_100g:
          type: "integer"
          description: "Milésimas de kilocaloría por 100 g (884 kcal = 884000)"
        protein_mg_per_100g:
          type: "integer"
          description: "Proteína en mg por 100 g (previsto)"
        fat_mg_per_100g:
          type: "integer"
          description: "Grasa en mg por 100 g (previsto)"
        carbs_mg_per_100g:
          type: "integer"
          description: "Carbohidratos en mg por 100 g (previsto)"
        fiber_mg_per_100g:
          type: "integer"
          description: "Fibra en mg por 100 g (previsto)"
        source:
          type: "string"
          enum:
            - "usda_fdc"
            - "open_food_facts"
            - "mx_table"
            - "store_label"
            - "manual"
          description: "Fuente: USDA FoodData Central, Open Food Facts, tabla mexicana citada, etiqueta de tienda o captura manual"
        source_ref:
          type: "string"
          description: "Cita: fdc_id, código de barras, tabla y página o URL de la etiqueta"
        source_license:
          type: "string"
          description: "Licencia de la fuente (CC0, ODbL)"
        is_preferred:
          type: "boolean"
          description: "1 = valor que usan los cálculos"
      required:
        - "kcal_milli_per_100g"
        - "source"
    Price:
      type: "object"
      description: "Precio (tabla `price`). Precio observado de una presentación en una tienda, con fecha y fuente autorizada. Un precio es viejo a los 30 días y pesa menos en la comparativa. Campos ausentes = sin valor (NULL)."
      x-tabla: "price"
      required:
        - "id"
        - "presentation_id"
        - "store_id"
        - "price_cents"
        - "observed_date"
        - "source"
        - "is_promotional"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        presentation_id:
          type: "integer"
          description: "Presentación"
        store_id:
          type: "integer"
          description: "Tienda del precio (sucursal, cadena o mercado)"
        price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio de una presentación en centavos con IVA (Nutrioli Oli 500 ml en Bodega Aurrera: 15000)"
        observed_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha del precio. Es viejo cuando tiene 30 días o más"
        source:
          type: "string"
          enum:
            - "ticket_manual"
            - "ticket_ocr"
            - "site_assisted"
            - "profeco"
            - "manual"
          description: "Fuente del precio: ticket_manual (ticket capturado a mano), ticket_ocr (ticket por OCR ya confirmado), site_assisted (agente externo desde K53: PROVISIONAL, bloqueo S5-agente-externo, pregunta d), profeco (referencia) o manual (captura a mano sin ticket)."
        is_promotional:
          type: "boolean"
          description: "1 = precio de promoción (sexta lata de atún a 2100), no se toma como precio regular"
        source_ref:
          type: "string"
          description: "Referencia de la fuente (mes del dataset PROFECO, URL)"
        expense_item_id:
          type: "integer"
          description: "Renglón de ticket que originó el precio"
        attachment_id:
          type: "integer"
          description: "Foto del ticket"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        base_unit_price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio por 1 kg, 1 l o 1 pieza (K7)."
          x-calculado: true
        age_days:
          type: "integer"
          description: "Días desde observed_date."
          x-calculado: true
        is_stale:
          type: "boolean"
          description: "Viejo: 30 días o más (K22)."
          x-calculado: true
    PriceCreate:
      type: "object"
      additionalProperties: false
      description: "Captura manual de un precio (N-174); source = manual lo pone la API."
      x-tabla: "price"
      properties:
        presentation_id:
          type: "integer"
          description: "Presentación"
        store_id:
          type: "integer"
          description: "Tienda del precio (sucursal, cadena o mercado)"
        price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio de una presentación en centavos con IVA (Nutrioli Oli 500 ml en Bodega Aurrera: 15000)"
        observed_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha del precio. Es viejo cuando tiene 30 días o más"
        is_promotional:
          type: "boolean"
          description: "1 = precio de promoción (sexta lata de atún a 2100), no se toma como precio regular"
        source_ref:
          type: "string"
          description: "Referencia de la fuente (mes del dataset PROFECO, URL)"
      required:
        - "presentation_id"
        - "store_id"
        - "price_cents"
        - "observed_date"
    PriceUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de precio (tabla `price`)."
      x-tabla: "price"
      properties:
        store_id:
          type: "integer"
          description: "Tienda del precio (sucursal, cadena o mercado)"
        price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio de una presentación en centavos con IVA (Nutrioli Oli 500 ml en Bodega Aurrera: 15000)"
        observed_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha del precio. Es viejo cuando tiene 30 días o más"
      minProperties: 1
    PriceSummary:
      type: "object"
      description: "Resumen de precios (N-172)."
      properties:
        fresh_count:
          type: "integer"
          description: "Productos con precio fresco."
        stale_count:
          type: "integer"
          description: "Con precio viejo."
        no_price_count:
          type: "integer"
          description: "Sin precio."
        stores:
          type: "array"
          items:
            type: "object"
            description: "Por tienda."
            properties:
              store_id:
                type: "integer"
                description: "Tienda."
              latest_observed_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Precio más reciente."
            required:
              - "store_id"
            x-calculado: true
          description: "Tiendas activas."
      required:
        - "fresh_count"
        - "stale_count"
        - "no_price_count"
        - "stores"
      x-calculado: true
    ExternalAgentReference:
      type: "object"
      description: "Datos de referencia para el agente externo (K53): ids de tiendas, grupos de producto y tiempos de comida con los que arma sus lotes. Los ids de productos y presentaciones los devuelve importExternalCatalog."
      properties:
        stores:
          type: "array"
          items:
            type: "object"
            description: "Tienda o mercado."
            properties:
              id:
                type: "integer"
                description: "store.id."
              kind:
                type: "string"
                enum:
                  - "chain"
                  - "branch"
                  - "market"
                description: "store.kind."
              name:
                type: "string"
                description: "store.name."
              parent_id:
                type: "integer"
                description: "Cadena de la sucursal (store.parent_id); solo en branch."
            required:
              - "id"
              - "kind"
              - "name"
            x-calculado: true
          description: "Tiendas y mercados dados de alta, en orden de id."
        product_groups:
          type: "array"
          items:
            type: "object"
            description: "Grupo de producto."
            properties:
              id:
                type: "integer"
                description: "product_group.id."
              name:
                type: "string"
                description: "product_group.name."
              purchase_channel:
                type: "string"
                enum:
                  - "market"
                  - "chain"
                description: "product_group.purchase_channel."
            required:
              - "id"
              - "name"
              - "purchase_channel"
            x-calculado: true
          description: "Grupos de producto, en orden de id."
        meal_slots:
          type: "array"
          items:
            type: "object"
            description: "Tiempo de comida."
            properties:
              id:
                type: "integer"
                description: "meal_slot.id."
              code:
                type: "string"
                enum:
                  - "breakfast"
                  - "lunch"
                  - "dinner"
                  - "snack"
                description: "meal_slot.code."
              name:
                type: "string"
                description: "meal_slot.name."
            required:
              - "id"
              - "code"
              - "name"
            x-calculado: true
          description: "Tiempos de comida, en orden de sort_order."
      required:
        - "stores"
        - "product_groups"
        - "meal_slots"
      x-calculado: true
    ExternalCatalogItem:
      type: "object"
      description: "Producto del lote con sus presentaciones (entrada)."
      properties:
        name:
          type: "string"
          description: "Nombre genérico en español (product.name). Llave del alta o actualización, sin distinguir mayúsculas."
        base_unit:
          type: "string"
          enum:
            - "g"
            - "ml"
            - "piece"
          description: "Unidad base (product.base_unit). Si el producto ya existe con otra unidad base, el renglón sale rejected: la unidad base no cambia por lote."
        grams_per_unit_milli:
          type: "integer"
          description: "Gramos por unidad base ×1000 (product.grams_per_unit_milli); no se manda si base_unit = g."
        product_group_id:
          type: "integer"
          description: "Grupo (product.product_group_id; ids de getExternalAgentReference)."
        presentations:
          type: "array"
          items:
            type: "object"
            description: "Presentación del lote (entrada)."
            properties:
              name:
                type: "string"
                description: "Presentación como se ve en tienda (presentation.name). Llave dentro del producto: si ya existe, se actualizan los demás campos."
              size_milli:
                $ref: "#/components/schemas/Milli"
                description: "Contenido en milésimas de la unidad base (presentation.size_milli), mayor que 0."
              brand:
                type: "string"
                description: "Marca (presentation.brand)."
              is_bulk:
                type: "boolean"
                description: "A granel (presentation.is_bulk); false si falta."
              barcode:
                type: "string"
                description: "Código de barras EAN o UPC de 8 a 14 dígitos (presentation.barcode). Si ya pertenece a otra presentación, el renglón sale rejected."
            required:
              - "name"
              - "size_milli"
          description: "Presentaciones del producto (1 o más)."
      required:
        - "name"
        - "base_unit"
        - "presentations"
    ExternalCatalogImport:
      type: "object"
      description: "Lote de productos y presentaciones del agente externo (K53): alta o actualización por nombre. PROVISIONAL (bloqueo S5-agente-externo, pregunta b): el agente escribe solo productos, presentaciones, precios y recetas; inventario no."
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ExternalCatalogItem"
          description: "De 1 a 500 productos. PROVISIONAL (bloqueo S5-agente-externo, pregunta g): tamaño máximo del lote, supuesto de k53-aplicar; no es decisión de Axel."
      required:
        - "items"
    ExternalPriceItem:
      type: "object"
      description: "Precio del lote (entrada)."
      properties:
        presentation_id:
          type: "integer"
          description: "Presentación (presentation.id; la devuelve importExternalCatalog)."
        store_id:
          type: "integer"
          description: "Tienda (store.id; de getExternalAgentReference)."
        price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Precio de una presentación con IVA (price.price_cents)."
        observed_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha en que el agente vio el precio (price.observed_date); no puede ser futura."
        is_promotional:
          type: "boolean"
          description: "Precio de promoción (price.is_promotional); false si falta."
        external_ref:
          type: "string"
          description: "Referencia del agente externo: URL de la ficha o clave del producto en la tienda. Se guarda en price.source_ref."
      required:
        - "presentation_id"
        - "store_id"
        - "price_cents"
        - "observed_date"
    ExternalPriceImport:
      type: "object"
      description: "Lote de precios del agente externo (K53). La API pone price.source; el lote no la manda. PROVISIONAL (bloqueo S5-agente-externo, preguntas a y d): source = site_assisted, que la documentación llama «agente externo», y en la comparativa compite como manual, con la misma frescura."
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ExternalPriceItem"
          description: "De 1 a 500 precios. PROVISIONAL (bloqueo S5-agente-externo, pregunta g): tamaño máximo del lote, supuesto de k53-aplicar; no es decisión de Axel."
      required:
        - "items"
    ExternalRecipeImport:
      type: "object"
      description: "Lote de recetas del agente externo (K53), con la forma de RecipeCreate. PROVISIONAL (bloqueo S5-agente-externo, preguntas c y f): cada receta entra como borrador, con origen «external_agent», y no aparece en el plan de comidas hasta que una persona la confirma; el esquema 1.4 todavía no guarda ni el borrador ni ese origen."
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/RecipeCreate"
          description: "De 1 a 100 recetas. PROVISIONAL (bloqueo S5-agente-externo, pregunta g): tamaño máximo del lote, supuesto de k53-aplicar; no es decisión de Axel."
      required:
        - "items"
    ExternalImportResult:
      type: "object"
      description: "Resultado de un lote del agente externo, renglón por renglón y en el orden recibido. Un renglón rechazado no detiene a los demás."
      properties:
        created_count:
          type: "integer"
          description: "Renglones creados."
        updated_count:
          type: "integer"
          description: "Renglones que ya existían y cambiaron."
        unchanged_count:
          type: "integer"
          description: "Renglones que ya existían iguales: repetir el lote no duplica nada."
