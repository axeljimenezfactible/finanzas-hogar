components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    Presentation:
      type: "object"
      description: "Presentación (tabla `presentation`). Presentación comprable de un producto (marca y contenido), con su factor de equivalencia a la unidad base. Campos ausentes = sin valor (NULL)."
      x-tabla: "presentation"
      required:
        - "id"
        - "product_id"
        - "name"
        - "size_milli"
        - "is_bulk"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        product_id:
          type: "integer"
          description: "Producto genérico"
        name:
          type: "string"
          description: "Presentación como se ve en tienda (Nutrioli Oli 500 ml)"
        brand:
          type: "string"
          description: "Marca"
        size_milli:
          $ref: "#/components/schemas/Milli"
          description: "Contenido en milésimas de la unidad base: 500 ml = 500000, 750 g = 750000, 1 pieza = 1000"
        is_bulk:
          type: "boolean"
          description: "1 = a granel: se vende por kilo o por unidad base"
        barcode:
          type: "string"
          description: "Código de barras EAN o UPC (cruce con Open Food Facts)"
        is_active:
          type: "boolean"
          description: "is_active"
        notes:
          type: "string"
          description: "notes"
