          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/products/{product_id}/presentations:
    post:
      operationId: "createPresentation"
      tags:
        - "Compras y tiendas"
      summary: "Nueva presentación"
      description: "Nueva presentación."
      x-necesidades:
        - "N-175"
      x-tablas:
        - "audit_log"
        - "idempotency_key"
        - "presentation"
      parameters:
        - name: "product_id"
          in: "path"
          required: true
          description: "Id del registro (product_id)."
          schema:
            type: "integer"
            minimum: 1
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationCreate"
      responses:
        "201":
          description: "Creado."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/presentations/{presentation_id}:
    patch:
      operationId: "updatePresentation"
      tags:
        - "Compras y tiendas"
      summary: "Editar presentación"
      description: "Editar presentación."
      x-necesidades:
        - "N-175"
      x-tablas:
        - "audit_log"
        - "presentation"
      parameters:
        - name: "presentation_id"
          in: "path"
          required: true
          description: "Id del registro (presentation_id)."
          schema:
            type: "integer"
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationUpdate"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "componentes-comunes.yaml#/components/responses/NotFound"
        "409":
          $ref: "componentes-comunes.yaml#/components/responses/Conflict"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    Milli:
      type: "integer"
      description: "Cantidad en milésimas de la unidad base (g, ml o pieza): 1000 = 1 g, 1 ml o 1 pieza; en porciones, 1000 = 1 porción."
      examples:
        - 1000
    ShoppingListItem:
      type: "object"
      description: "Artículo de la lista de compras (tabla `shopping_list_item`). Un artículo de la lista: un producto que calculó S4 al generar la lista o un artículo agregado a mano (producto del catálogo o texto libre). Guarda la tienda o mercado elegido, la cantidad elegida y si ya se compró. Se comparte en el servidor entre los dos teléfonos (K1). Campos ausentes = sin valor (NULL)."
      x-tabla: "shopping_list_item"
      required:
        - "id"
        - "shopping_list_id"
        - "origin"
        - "is_bought"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        shopping_list_id:
          type: "integer"
          description: "Lista a la que pertenece"
        origin:
          type: "string"
          enum:
            - "calculated"
            - "manual"
          description: "calculated = lo calculó S4 (recetas del plan o reposición por ritmo), manual = lo agregó una persona (N-152)"
        product_id:
          type: "integer"
          description: "Producto del catálogo"
        free_text:
          type: "string"
          description: "Artículo escrito a mano que no está en el catálogo"
        free_text_unit:
          type: "string"
          enum:
            - "g"
            - "ml"
            - "piece"
          description: "Unidad de la cantidad de un artículo en texto libre (un producto usa su product.base_unit)"
        presentation_id:
          type: "integer"
          description: "Presentación elegida para comprar. NULL = la que recomienda S5"
        needed_milli:
          $ref: "#/components/schemas/Milli"
          description: "Necesidad que calculó S4 en la última generación (plan − existencia + reposición), en milésimas de la unidad base"
        quantity_milli:
          $ref: "#/components/schemas/Milli"
          description: "Cantidad a comprar que fijó una persona (N-152, N-153), en milésimas de la unidad base. NULL en calculated = comprar la necesidad"
        store_id:
          type: "integer"
          description: "Tienda o mercado elegido (N-153, N-165). NULL = el que recomienda S5"
        is_bought:
          type: "boolean"
          description: "1 = comprado (N-151). No crea gasto ni precio hasta confirmar el ticket"
        bought_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Cuándo se marcó como comprado"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        packages_to_buy:
          type: "integer"
          description: "Piezas a comprar de la presentación (motor S4)."
          x-calculado: true
        assigned_store_id:
          type: "integer"
          description: "Tienda asignada (motor S4 §6.5; Q2-39 a Q2-42 A): la elegida (store_id) si la hay; si no, en vertical chain la de la cotización que rige y en vertical market el mercado que surte su grupo con la próxima visita más cercana (en empate, el primero dado de alta). Rige la agrupación (groups[].store_id). Ausente = sin tienda: artículo de cadena sin cotización o de mercado sin mercado dado de alta (Q2-40 A)."
          x-calculado: true
        recommended_store_id:
          type: "integer"
          description: "Tienda o mercado que recomienda S5 por precio (QuoteFor); rige el precio y la presentación mientras store_id esté ausente. En vertical market no rige la agrupación y puede ser distinta de assigned_store_id (Q2-41 A: el artículo se queda en el mercado; la cadena se ve en la comparativa y se puede elegir)."
          x-calculado: true
        recommended_presentation_id:
          type: "integer"
          description: "Presentación que recomienda S5; rige mientras presentation_id esté ausente."
          x-calculado: true
        estimated_price_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Costo estimado con la cotización que rige (S4 §8.1): piezas × precio del paquete, en la tienda de esa cotización (en vertical market puede ser otra que assigned_store_id). Ausente = sin precio: no suma en los totales (Q2-42 A)."
          x-calculado: true
        price_observed_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha del precio usado."
          x-calculado: true
        is_stale_price:
          type: "boolean"
          description: "Precio viejo: 30 días o más (K22)."
          x-calculado: true
        reasons:
          type: "array"
          items:
            type: "string"
            enum:
              - "recipe"
              - "replenishment"
              - "manual"
          description: "Motivo: recetas del plan, reposición por ritmo de consumo o manual (origin = manual)."
          x-calculado: true
        recipe_ids:
          type: "array"
          items:
            type: "integer"
          description: "Recetas del plan que lo piden."
          x-calculado: true
    ShoppingList:
      type: "object"
      description: "Lista de compras de la semana (N-150). Guarda lo que no se calcula (artículos a mano, tienda, presentación o cantidad elegidas y marcas de comprado; shopping_list y shopping_list_item) y añade al consultar lo que calculan S4 y S5 (piezas, tienda recomendada, precio y frescura). Agrupada por vertical y tienda asignada (orden de groups[]: S4 §6.5, Q2-42 A), luego categoría de producto, orden alfabético. Marcas y artículos compartidos en el servidor entre los dos teléfonos (K1)."
      properties:
        shopping_list_id:
          type: "integer"
          description: "Lista guardada de la semana (shopping_list.id). Ausente = la semana todavía no tiene lista: se crea al generarla (N-127) o al agregar un artículo (N-152)."
        start_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Primer día de la semana (shopping_list.start_date; lunes, K8)."
        end_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Último día de la semana, inclusive (shopping_list.end_date)."
        generated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "Última generación desde el plan (shopping_list.generated_at). Ausente = no se ha generado."
        groups:
          type: "array"
          items:
            type: "object"
            description: "Grupo: par vertical y tienda asignada (S4 §6.5). Orden (Q2-42 A): primero los de mercado y luego los de cadena; dentro de cada vertical, por visit_date ascendente (sin fecha al final) y luego por id de tienda, con el grupo sin tienda al final."
            properties:
              purchase_channel:
                type: "string"
                enum:
                  - "market"
                  - "chain"
                description: "Vertical (product_group.purchase_channel)."
              store_id:
                type: "integer"
                description: "Tienda asignada del grupo (assigned_store_id de sus artículos). Ausente = sin tienda; en vertical market es el grupo «sin mercado dado de alta» (Q2-40 A), con el total de sus artículos con precio de S5."
              visit_weekday:
                type: "integer"
                description: "Día ISO de visit_date (1 = lunes … 7 = domingo), que es el visit_weekday del mercado. Solo en grupos de mercado con tienda."
              visit_date:
                $ref: "componentes-comunes.yaml#/components/schemas/Date"
                description: "Fecha de la próxima visita del mercado (S4 next_visit, que calcula S5 §9; Q2-42 A: se cuenta desde la fecha más tardía entre hoy y el lunes de la semana de la lista). Solo en grupos de mercado con tienda."
              items:
                type: "array"
                items:
                  $ref: "#/components/schemas/ShoppingListItem"
                description: "Artículos."
              total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Total estimado del grupo: Σ estimated_price_cents de sus artículos con precio (calculated y manual, comprados o no). Los que no tienen precio no suman y se reconocen por estimated_price_cents ausente (Q2-42 A)."
            required:
              - "purchase_channel"
              - "items"
              - "total_cents"
            x-calculado: true
          description: "Grupos."
        total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Total estimado de la lista: Σ groups[].total_cents, solo artículos con precio (Q2-42 A)."
      required:
        - "start_date"
        - "end_date"
        - "groups"
        - "total_cents"
      x-calculado: true
    ShoppingListItemCreate:
      type: "object"
      additionalProperties: false
      description: "Artículo agregado a mano (N-152): producto del catálogo (product_id) o texto libre (free_text con free_text_unit), nunca ambos; cantidad a comprar; tienda y presentación opcionales (ausentes = las que recomienda S5). origin = manual lo pone la API. Marcas y artículos compartidos en el servidor entre los dos teléfonos (K1)."
      x-tabla: "shopping_list_item"
      properties:
        product_id:
          type: "integer"
          description: "Producto del catálogo"
        free_text:
          type: "string"
          description: "Artículo escrito a mano que no está en el catálogo"
        free_text_unit:
          type: "string"
          enum:
            - "g"
            - "ml"
            - "piece"
          description: "Unidad de la cantidad de un artículo en texto libre (un producto usa su product.base_unit)"
        presentation_id:
          type: "integer"
          description: "Presentación elegida para comprar. NULL = la que recomienda S5"
        quantity_milli:
          $ref: "#/components/schemas/Milli"
          description: "Cantidad a comprar que fijó una persona (N-152, N-153), en milésimas de la unidad base. NULL en calculated = comprar la necesidad"
        store_id:
          type: "integer"
          description: "Tienda o mercado elegido (N-153, N-165). NULL = el que recomienda S5"
        notes:
          type: "string"
          description: "notes"
      required:
        - "quantity_milli"
    ShoppingListItemUpdate:
      type: "object"
      additionalProperties: false
      description: "Cambios parciales (JSON Merge Patch, RFC 7396) de un artículo: marcar o desmarcar comprado (is_bought, N-151; bought_at lo pone o lo quita la API) y cambiar tienda, presentación o cantidad (N-153). null en store_id, presentation_id o quantity_milli vuelve a lo que recomienda o calcula el sistema (en un artículo manual la cantidad no se puede borrar). Marcas y artículos compartidos en el servidor entre los dos teléfonos (K1)."
      x-tabla: "shopping_list_item"
      properties:
        presentation_id:
          type:
            - "integer"
            - "null"
          description: "Presentación elegida para comprar. NULL = la que recomienda S5 · null borra el valor"
        quantity_milli:
          anyOf:
            - $ref: "#/components/schemas/Milli"
            - type: "null"
          description: "Cantidad a comprar que fijó una persona (N-152, N-153), en milésimas de la unidad base. NULL en calculated = comprar la necesidad · null borra el valor"
        store_id:
          type:
            - "integer"
            - "null"
          description: "Tienda o mercado elegido (N-153, N-165). NULL = el que recomienda S5 · null borra el valor"
        is_bought:
          type: "boolean"
          description: "1 = comprado (N-151). No crea gasto ni precio hasta confirmar el ticket"
        notes:
          type:
            - "string"
            - "null"
          description: "notes · null borra el valor"
      minProperties: 1
    ShoppingListStoreAssignment:
      type: "object"
      description: "«Usar esta tienda» (N-165). Marcas y artículos compartidos en el servidor entre los dos teléfonos (K1)."
      properties:
        store_id:
          type: "integer"
          minimum: 1
          description: "Tienda o mercado elegido en la comparativa (shopping_list_item.store_id)."
          x-columna: "shopping_list_item.store_id"
      required:
        - "store_id"
      additionalProperties: false
    ShoppingListStoreAssignmentResult:
      type: "object"
      description: "Resultado de «Usar esta tienda»."
      properties:
        assigned_count:
          type: "integer"
          description: "Artículos que quedaron con esa tienda (tienen precio en ella)."
        without_price_count:
          type: "integer"
          description: "Artículos sin precio en esa tienda; conservan su tienda."
      required:
        - "assigned_count"
        - "without_price_count"
      x-calculado: true
    Basket:
      type: "object"
      description: "Canasta disponible para comparar (N-160)."
      properties:
        basket:
          type: "string"
          enum:
            - "shopping_list"
            - "expense"
          description: "Lista vigente o compra registrada."
        expense_id:
          type: "integer"
          description: "Gasto con renglones."
        expense_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha."
        store_id:
          type: "integer"
          description: "Tienda de la compra."
        total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Total."
        item_count:
          type: "integer"
          description: "Artículos."
      required:
        - "basket"
        - "item_count"
      x-calculado: true
    BasketComparison:
      type: "object"
      description: "Comparativa de canasta (N-161 a N-164, motor S5). Sam's Club se compara como si tuvieran membresía. Canon semilla 10-oct-2026: Bodega Aurrera 309450 contra Walmart 323300 (+13850); idénticos 277350 contra 287400 (+10050); 33 idénticos, 3 sustitutos; Bodega gana 22, empates 8, Walmart 3."
      properties:
        basket:
          type: "string"
          enum:
            - "shopping_list"
            - "expense"
          description: "Canasta comparada."
        expense_id:
          type: "integer"
          description: "Compra comparada."
        stores:
          type: "array"
          items:
            type: "object"
            description: "Por tienda."
            properties:
              store_id:
                type: "integer"
                description: "Tienda."
              total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Total."
              identical_count:
                type: "integer"
                description: "Renglones idénticos (no piezas; S5 §7.2)."
              identical_total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Total de idénticos."
              substitute_count:
                type: "integer"
                description: "Sustitutos."
              missing_count:
                type: "integer"
                description: "Sin precio."
              stale_count:
                type: "integer"
                description: "Precios viejos."
              difference_vs_cheapest_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Total de la tienda − total de cheapest_store_id. Solo en tiendas completas; ausente en las incompletas o si no hay cheapest_store_id (S5 §7.4)."
              assumes_membership:
                type: "boolean"
                description: "Comparada como si tuvieran membresía."
            required:
              - "store_id"
              - "total_cents"
              - "identical_count"
              - "identical_total_cents"
              - "substitute_count"
              - "missing_count"
              - "stale_count"
              - "assumes_membership"
            x-calculado: true
          description: "Primero las tiendas completas (missing_count = 0) por total ascendente y después las incompletas por total ascendente (S5 §7.4; desempates en S5)."
        cheapest_store_id:
          type: "integer"
          description: "Tienda más barata: la primera tienda completa de stores (missing_count = 0). Ausente si ninguna está completa (S5 §7.4; un solo significado con basket=shopping_list y basket=expense)."
        items:
          type: "array"
          items:
            type: "object"
            description: "Por artículo."
            properties:
              product_id:
                type: "integer"
                description: "Producto."
              quantity_milli:
                $ref: "#/components/schemas/Milli"
                description: "Cantidad."
              prices:
                type: "array"
                items:
                  type: "object"
                  description: "Precio de un artículo en una tienda."
                  properties:
                    store_id:
                      type: "integer"
                      description: "Tienda."
                    presentation_id:
                      type: "integer"
                      description: "Presentación."
                    price_cents:
                      $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                      description: "Precio."
                    base_unit_price_cents:
                      $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                      description: "Precio por 1 kg, 1 l o 1 pieza según la unidad base, ROUND_HALF_UP (K7)."
                    observed_date:
                      $ref: "componentes-comunes.yaml#/components/schemas/Date"
                      description: "Fecha."
                    source:
                      type: "string"
                      enum:
                        - "ticket_manual"
                        - "ticket_ocr"
                        - "site_assisted"
                        - "profeco"
                        - "manual"
                      description: "Fuente."
                    is_stale:
                      type: "boolean"
                      description: "Viejo."
                  required:
                    - "store_id"
                    - "presentation_id"
                    - "price_cents"
                    - "base_unit_price_cents"
                    - "observed_date"
                    - "source"
                    - "is_stale"
                  x-calculado: true
                description: "Precio en cada tienda."
              winner_store_id:
                type: "integer"
                description: "Tienda ganadora; ausente si empate."
              difference_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Diferencia entre la más cara y la más barata."
              is_substitute:
                type: "boolean"
                description: "Presentación distinta comparada por unidad base."
              substitute_note:
                type: "string"
                description: "Nota del sustituto."
            required:
              - "product_id"
              - "quantity_milli"
              - "prices"
              - "is_substitute"
            x-calculado: true
          description: "Orden por diferencia descendente."
        winners:
          type: "array"
          items:
            type: "object"
            description: "Ganadores."
            properties:
              store_id:
                type: "integer"
                description: "Tienda."
              wins:
                type: "integer"
                description: "Artículos en que gana."
            required:
              - "store_id"
              - "wins"
            x-calculado: true
          description: "Por tienda."
        ties:
          type: "integer"
          description: "Empates."
        membership:
          type: "object"
          description: "Membresía Sam's (N-164, motor S5). Punto de equilibrio = compras al año que cubren la membresía (K7)."
          properties:
            store_id:
              type: "integer"
              description: "Tienda con membresía."
            basket_savings_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Ahorro de la canasta contra la mejor tienda sin membresía."
            annual_savings_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Ahorro anual estimado."
            annual_fee_cents:
              $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
              description: "Costo anual (store.membership_annual_fee_cents); ausente si no se ha capturado."
            break_even_purchases:
              type: "integer"
              description: "Compras al año para cubrir la membresía."
            verdict:
              type: "string"
              enum:
                - "worth_it"
                - "not_worth_it"
                - "missing_fee"
              description: "Veredicto."
          required:
