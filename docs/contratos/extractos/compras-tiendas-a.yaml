# Finanzas Hogar · Contrato C1 v1.5.0 · extracto «compras-tiendas-a». Archivo generado por backend/internal/api/c1gen/build.py: no se edita a mano.
# Fuente única: docs/contratos/openapi.yaml. Índice y regla de uso: docs/contratos/extractos/INDICE.md.
openapi: "3.1.1"
info:
  title: "Finanzas Hogar · API (C1) · extracto compras-tiendas-a"
  version: "1.5.0"
  description: "Extracto de la etiqueta «Compras y tiendas» del contrato C1 (docs/contratos/openapi.yaml): sus rutas y los esquemas que usan. Parámetros, encabezados, respuestas y esquemas base viven en componentes-comunes.yaml."
security:
  - cookieAuth: []
tags:
  - name: "Compras y tiendas"
    description: "Lista de compras, comparar canasta, productos, precios e inventario."
paths:
  /api/v1/shopping-list:
    get:
      operationId: "getShoppingList"
      tags:
        - "Compras y tiendas"
      summary: "Lista de compras de la semana"
      description: "Lista guardada de la semana (shopping_list y shopping_list_item) con lo que calculan S4 y S5 al consultar: piezas, tienda y presentación recomendadas, precio estimado y frescura (N-150). Semana de la lista: `week` obligatorio con una semana (`2026-W42`, lunes a domingo, K8), la que muestra la pantalla (R3-01); el contrato no tiene semana por omisión. Si la semana todavía no tiene lista responde la lista vacía, sin shopping_list_id. «Terminar compra» (N-073) pide is_bought=true y abre la captura del ticket con esos artículos como renglones propuestos. Lista compartida en el servidor (K1)."
      x-necesidades:
        - "N-150"
        - "N-073"
      x-tablas:
        - "inventory_item"
        - "meal_plan_entry"
        - "presentation"
        - "price"
        - "product"
        - "product_group"
        - "recipe_ingredient"
        - "shopping_list"
        - "shopping_list_item"
        - "store"
        - "store_product_group"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/ListWeek"
        - $ref: "componentes-comunes.yaml#/components/parameters/StoreId"
        - name: "is_bought"
          in: "query"
          required: false
          description: "true = solo los artículos marcados como comprados (prellenado de «Terminar compra», N-073); false = solo los pendientes."
          schema:
            type: "boolean"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        "400":
          $ref: "componentes-comunes.yaml#/components/responses/BadRequest"
        "401":
          $ref: "componentes-comunes.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "componentes-comunes.yaml#/components/responses/UnprocessableEntity"
        default:
          $ref: "componentes-comunes.yaml#/components/responses/Error"
  /api/v1/shopping-list/generate:
    post:
      operationId: "generateShoppingList"
      tags:
        - "Compras y tiendas"
      summary: "Generar lista de compras"
      description: "Produce o actualiza la lista de la semana desde el plan de comidas (motor S4: ingredientes del plan escalados − existencia + reposición por ritmo). Crea shopping_list si falta, pone generated_at y guarda la necesidad (needed_milli) en un artículo calculated por producto; conserva lo que eligió una persona (cantidad, tienda, presentación, comprado) y los artículos a mano (invariante 13 de S1). Semana de la lista: `week` obligatorio con una semana (`2026-W42`, lunes a domingo, K8), la que muestra la pantalla (R3-01); el contrato no tiene semana por omisión. Lista compartida en el servidor (K1)."
      x-necesidades:
        - "N-127"
      x-tablas:
        - "audit_log"
        - "idempotency_key"
        - "inventory_item"
        - "meal_plan_entry"
        - "presentation"
        - "price"
        - "product"
        - "product_group"
        - "recipe_ingredient"
        - "shopping_list"
        - "shopping_list_item"
        - "store"
        - "store_product_group"
      parameters:
        - $ref: "componentes-comunes.yaml#/components/parameters/ListWeek"
        - $ref: "componentes-comunes.yaml#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Correcto."
          headers:
            X-Request-Id:
              $ref: "componentes-comunes.yaml#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "componentes-comunes.yaml#/components/headers/IdempotentReplayed"
          content:
