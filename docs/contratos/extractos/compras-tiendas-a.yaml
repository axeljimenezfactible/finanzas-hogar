      description: "Marca o desmarca comprado (N-151) y cambia tienda, presentación o cantidad (N-153). Marcar comprado no crea gasto ni precio: eso pasa al confirmar el ticket (N-073 → confirmTicketScan o createExpense). Si el artículo no es de la semana `week` responde 422 `out_of_range` (R3-01). Lista compartida en el servidor (K1)."
      x-necesidades:
