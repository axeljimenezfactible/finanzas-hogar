components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    LiveDebt:
      type: "object"
      description: "Deuda viva a una fecha (N-092, motor S3): lo que queda por pagar después de la fecha de las compras hechas hasta esa fecha."
      properties:
        date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de corte."
        total_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Deuda viva total (capital + intereses)."
        credits:
          type: "array"
          items:
            type: "object"
            description: "Por línea."
            properties:
              credit_id:
                type: "integer"
                description: "Crédito."
              total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Deuda viva."
            required:
              - "credit_id"
              - "total_cents"
            x-calculado: true
          description: "Por línea."
        purchases:
          type: "array"
          items:
            type: "object"
            description: "Por compra."
            properties:
              credit_purchase_id:
                type: "integer"
                description: "Compra."
              credit_id:
                type: "integer"
                description: "Crédito."
              total_cents:
                $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
                description: "Deuda viva."
            required:
              - "credit_purchase_id"
              - "credit_id"
              - "total_cents"
            x-calculado: true
          description: "Por compra."
      required:
        - "date"
        - "total_cents"
        - "credits"
        - "purchases"
      x-calculado: true
    CashFlowAssumptions:
      type: "object"
      description: "Supuestos de la proyección (N-093)."
      properties:
        projection_mode:
          type: "string"
          enum:
            - "contracted_only"
            - "with_repeat_cadence"
          description: "Modo de los meses 7 a 12 (K21; ajuste projection.repeat_cadence_enabled): contracted_only = solo compromisos contratados, gastos fijos e ingresos del CSV (por defecto); with_repeat_cadence = además la cadencia bimestral de despensa a crédito y el papel alterno de $199."
        planned_items:
          type: "array"
          items:
            $ref: "#/components/schemas/PlannedItem"
          description: "Ingreso esperado, gastos fijos y despensas programadas (planned_item activos)."
        variable_estimate_method:
          type: "string"
          description: "Método del gasto variable estimado (lo fija S2 y lo informa aquí)."
        variable_estimate_cents:
          $ref: "componentes-comunes.yaml#/components/schemas/MoneyCents"
          description: "Monto estimado por quincena."
      required:
        - "projection_mode"
        - "planned_items"
        - "variable_estimate_method"
      x-calculado: true
    Income:
      type: "object"
      description: "Ingreso (tabla `income`). Ingreso recibido por el titular: fijo quincenal (lo captura Axel cada quincena) o extra capturado a mano. Ximena no aporta ingresos al modelo. Campos ausentes = sin valor (NULL)."
      x-tabla: "income"
      required:
        - "id"
        - "person_id"
        - "kind"
        - "description"
        - "amount_cents"
        - "income_date"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        person_id:
          type: "integer"
          description: "Quién recibe el ingreso"
        kind:
          type: "string"
          enum:
            - "fixed"
            - "extra"
          description: "fixed = ingreso fijo quincenal, extra = ingreso extra"
        planned_item_id:
