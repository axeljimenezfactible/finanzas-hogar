components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    IdList:
      type: "object"
      description: "Lista de ids (reemplazo completo)."
      properties:
        ids:
          type: "array"
          items:
            type: "integer"
          description: "Ids en el orden deseado."
          x-entrada: true
      required:
        - "ids"
    SettingParameterInteger:
      type: "object"
      x-calculado: true
      description: "Parámetro operativo de tipo entero (K44, C1 §11.7): una clave de app_setting del hogar con su valor vigente y su valor inicial. Solo se valida tipo y signo, como los disparadores trg_app_setting_param_int* de 00003; sin topes mínimos ni máximos hasta la puerta 2."
      required:
        - "key"
        - "value_type"
        - "unit"
        - "value"
        - "initial_value"
        - "is_initial"
      properties:
        key:
          type: "string"
          description: "Clave de app_setting (app_setting.setting_key)."
        value_type:
          type: "string"
          enum:
            - "integer"
          description: "Tipo del valor."
        unit:
          type: "string"
          description: "Unidad en español (intentos, minutos, días, MB…)."
        value:
          type:
            - "integer"
            - "null"
          minimum: 0
          description: "Valor vigente (app_setting.value_json del hogar). null = no hay valor guardado."
        initial_value:
          type:
            - "integer"
            - "null"
          minimum: 0
          description: "Valor inicial sembrado por la migración (el decidido en decisiones.md §A–§K; K44). «Restablecer» vuelve a él. null = no hay valor inicial."
        is_initial:
          type: "boolean"
          description: "true si el valor vigente es igual al inicial."
    Promotion:
      type: "object"
      description: "Promoción (tabla `promotion`). Calendario de promociones capturado a mano: comercio, plazo, tasa (0 % casi siempre), compra mínima y vigencia. Campos ausentes = sin valor (NULL)."
      x-tabla: "promotion"
      required:
        - "id"
        - "merchant_name"
        - "term_count"
        - "rate_num"
        - "rate_den"
