components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
  schemas:
    IdList:
      type: "object"
      description: "Lista de ids (reemplazo completo)."
      properties:
        ids:
          type: "array"
          items:
            type: "integer"
          description: "Ids en el orden deseado."
          x-entrada: true
      required:
        - "ids"
    CreditTermRate:
      type: "object"
      description: "Tasa por plazo (tabla `credit_term_rate`). Tabla editable de tasas por plazo de un crédito, como fracción exacta del capital por todo el plazo con IVA incluido. Kueski: 2 quincenas = 53450/309450 (17.27 %), 4 quincenas = 80050/309450 (25.8685 %). Campos ausentes = sin valor (NULL)."
      x-tabla: "credit_term_rate"
      required:
        - "id"
        - "credit_id"
        - "term_count"
        - "rate_num"
        - "rate_den"
        - "source"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "integer"
          description: "id"
        credit_id:
          type: "integer"
          description: "Crédito"
        term_count:
          type: "integer"
          description: "Plazo en número de pagos (2, 4, 6, 8, 10 o 12 quincenas en Kueski)"
        rate_num:
          type: "integer"
          description: "Numerador: si viene de una cotización, los intereses en centavos (80050)"
        rate_den:
          type: "integer"
          description: "Denominador: si viene de una cotización, el capital en centavos (309450). Una tasa tecleada como 25.8685 % se guarda 258685/1000000"
        source:
          type: "string"
          enum:
            - "quote"
            - "manual"
          description: "quote = sale de una cotización real, manual = tecleada en la tabla editable"
        quote_date:
          $ref: "componentes-comunes.yaml#/components/schemas/Date"
          description: "Fecha de la cotización (2026-10-10)"
        notes:
          type: "string"
          description: "notes"
        created_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "created_at"
        updated_at:
          $ref: "componentes-comunes.yaml#/components/schemas/DateTime"
          description: "updated_at"
        rate_decimals:
          type: "integer"
          description: "Decimales con que se capturó o se leyó de la cotización el porcentaje (17.27 % → 2; 25.8685 % → 4). La pantalla redondea la fracción a esos decimales con HALF_UP; los cálculos usan rate_num/rate_den. NULL = sin dato"
        rate_pct:
          type: "string"
          description: "Tasa en porcentaje como se capturó (K12): rate_num/rate_den redondeada ROUND_HALF_UP a rate_decimals decimales (17.27 con 2; 25.8685 con 4); ausente si falta rate_decimals. El cálculo usa siempre la fracción rate_num/rate_den."
          x-calculado: true
    CreditTermRateCreate:
      type: "object"
      additionalProperties: false
      description: "Alta de tasa por plazo (tabla `credit_term_rate`)."
      x-tabla: "credit_term_rate"
      properties:
        term_count:
          type: "integer"
          description: "Plazo en número de pagos (2, 4, 6, 8, 10 o 12 quincenas en Kueski)"
        rate_num:
          type: "integer"
          description: "Numerador: si viene de una cotización, los intereses en centavos (80050)"
        rate_den:
          type: "integer"
          description: "Denominador: si viene de una cotización, el capital en centavos (309450). Una tasa tecleada como 25.8685 % se guarda 258685/1000000"
        source:
          type: "string"
          enum:
            - "quote"
            - "manual"
