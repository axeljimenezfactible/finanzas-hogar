components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "fh_session"
      description: "Sesión larga por dispositivo. Cookie HttpOnly, Secure y SameSite=Strict; el token en claro solo viaja en la cookie (la base guarda su SHA-256 en device_session.token_hash). Duración 90 días renovable con el uso (K11, app_setting session.max_age_days)."
    serviceToken:
      type: "http"
      scheme: "bearer"
      description: "Credencial de servicio del agente externo (K53): encabezado Authorization: Bearer con un token propio, distinto de la cookie de sesión. Solo lo aceptan las operaciones con x-agente-externo (/api/v1/external-agent/*), que no aceptan la cookie; ninguna otra operación lo acepta. El token en claro nunca se guarda ni se registra. PROVISIONAL (bloqueo S5-agente-externo, pregunta e): el esquema 1.4 no tiene dónde guardar la credencial; dónde vive y a nombre de quién quedan audit_log e idempotency_key se decide en la puerta 4."
      x-provisional: true
  schemas:
    BasisPoints:
      type: "integer"
      minimum: 0
      maximum: 10000
      description: "Porcentaje en puntos base: 10000 = 100 %, 5000 = 50 %."
      examples:
        - 5000
    SettingParameterInteger:
      type: "object"
      x-calculado: true
      description: "Parámetro operativo de tipo entero (K44, C1 §11.7): una clave de app_setting del hogar con su valor vigente y su valor inicial. El tipo y el rango de cada clave los validan los disparadores de S1 (trg_app_setting_param_int* de 00003; trg_app_setting_param_range* y trg_app_setting_param_time* de 00004) y los declara la propiedad de la clave en el cambio de su sección (minimum, maximum o pattern; puerta 2, K50)."
      required:
        - "key"
        - "value_type"
        - "unit"
        - "value"
        - "initial_value"
        - "is_initial"
      properties:
        key:
          type: "string"
          description: "Clave de app_setting (app_setting.setting_key)."
        value_type:
          type: "string"
          enum:
            - "integer"
          description: "Tipo del valor."
        unit:
          type: "string"
          description: "Unidad en español (intentos, minutos, días, MB…)."
        value:
          type:
            - "integer"
            - "null"
          minimum: 0
          description: "Valor vigente (app_setting.value_json del hogar). null = no hay valor guardado."
        initial_value:
          type:
            - "integer"
            - "null"
          minimum: 0
          description: "Valor inicial sembrado por la migración (el decidido en decisiones.md §A–§K; K44). «Restablecer» vuelve a él. null = no hay valor inicial."
        is_initial:
          type: "boolean"
          description: "true si el valor vigente es igual al inicial."
    Credit:
      type: "object"
      description: "Crédito (tabla `credit`). Crédito del titular: línea revolvente tipo Kueski, tarjeta bancaria, préstamo personal a plazo fijo o crédito de tienda con abonos. Guarda el límite, la lectura A/B, las fechas de corte y pago y las comisiones. Campos ausentes = sin valor (NULL)."
      x-tabla: "credit"
      required:
        - "id"
        - "name"
        - "kind"
        - "holder_person_id"
        - "payment_frequency"
        - "availability_reading"
        - "availability_confirmed"
        - "is_active"
        - "created_at"
        - "updated_at"
      properties:
